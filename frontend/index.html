<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Sistema Logístico</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
const _pageUser = checkAuth(['ADMIN','SUPERVISOR','CLIENTE','LOGISTICA','OPERADOR']);
const _esOperador = _pageUser?.rol === 'OPERADOR';
const _esCliente  = _pageUser?.rol === 'CLIENTE';
buildShell('Dashboard', 'DASHBOARD', _esOperador ? '' : `
  <button class="btn btn-primary btn-sm" onclick="window.location='operacion.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Nueva Operación
  </button>
`, _pageUser);

const content = document.getElementById('page-content');

let resumenMode = 'todo';
let resumenClienteId = '';

async function loadDashboard() {
  try {
    const [resumen, trackings, clientes] = await Promise.all([
      API.get('/reportes/resumen'),
      API.get('/trackings'),
      API.get('/clientes')
    ]);

    const abiertos = trackings.filter(t => t.estatus === 'abierto').length;
    const cerrados = trackings.filter(t => t.estatus === 'cerrado').length;

    const clienteOpts = clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');

    content.innerHTML = `
      <div class="flex justify-between items-center mb-24">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">Resumen del sistema de inspección logística</p>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);text-align:right">
          ${new Date().toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;padding:10px 16px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <div style="display:flex;gap:4px">
            <button id="rs-btn-todo"   class="btn btn-primary btn-sm"   onclick="setResumenMode('todo')">Todo</button>
            <button id="rs-btn-hoy"    class="btn btn-secondary btn-sm" onclick="setResumenMode('hoy')">Hoy</button>
            <button id="rs-btn-ayer"   class="btn btn-secondary btn-sm" onclick="setResumenMode('ayer')">Ayer</button>
            <button id="rs-btn-semana" class="btn btn-secondary btn-sm" onclick="setResumenMode('semana')">Semana</button>
            <button id="rs-btn-mes"    class="btn btn-secondary btn-sm" onclick="setResumenMode('mes')">Mes</button>
            <button id="rs-btn-rango"  class="btn btn-secondary btn-sm" onclick="setResumenMode('rango')">Rango</button>
          </div>
          <div id="rs-rango-inputs" style="display:none;gap:6px;align-items:center">
            <input type="date" id="rs-desde" class="form-control" style="width:140px" onchange="loadResumen()">
            <span style="color:var(--text-muted);font-size:12px">—</span>
            <input type="date" id="rs-hasta" class="form-control" style="width:140px" onchange="loadResumen()">
          </div>
          <select id="rs-cliente" class="form-control" style="width:180px" onchange="resumenClienteId=this.value;loadResumen()">
            <option value="">Todos los clientes</option>
            ${clienteOpts}
          </select>
        </div>
      </div>

      <div id="stat-grid" class="stat-grid"></div>

      <div style="display:grid;grid-template-columns:${_esCliente ? '1fr' : '1fr 1fr'};gap:16px">

        <div class="card">
          <div class="card-header">
            <span class="card-title">Trackings Recientes</span>
            ${(_esOperador || _esCliente) ? '' : `<a href="trackings.html" class="btn btn-ghost btn-sm">Ver todos →</a>`}
          </div>
          ${trackings.length === 0 ? `
            <div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <div class="empty-state-title">Sin trackings aún</div>
              <div class="empty-state-text">Inicia una operación para registrar el primero</div>
            </div>
          ` : `
            <div class="table-wrapper" style="border:none">
              <table>
                <thead>
                  <tr>
                    <th>Tracking #</th>
                    <th>Cliente</th>
                    <th>Grado</th>
                    <th>Piezas</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody>
                  ${trackings.slice(0,8).map(t => `
                    <tr style="cursor:pointer" onclick="window.location='operacion.html?id=${t.id}'">
                      <td class="td-mono">${t.tracking_number}</td>
                      <td>${t.cliente_nombre || '—'}</td>
                      <td>${gradoBadge(t.grado_confianza)}</td>
                      <td class="td-mono">${formatNum(t.cantidad_final)} / ${formatNum(t.cantidad_declarada)}</td>
                      <td>
                        <span class="badge ${t.estatus === 'cerrado' ? 'badge-green' : 'badge-amber'}">
                          ${t.estatus}
                        </span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>

        ${_esCliente ? '' : `
        <div class="card">
          <div class="card-header">
            <span class="card-title">Grados de Confianza</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:16px;padding:4px 0">
            ${[1,2,3].map(g => {
              const info = GRADO_INFO[g];
              const count = trackings.filter(t => t.grado_confianza === g).length;
              const pct = resumen.totalTrackings > 0 ? Math.round(count / resumen.totalTrackings * 100) : 0;
              return `
                <div>
                  <div class="flex justify-between items-center mb-8">
                    <span class="grado-badge ${info.class}">${info.label}</span>
                    <span class="font-mono" style="font-size:12px;color:var(--text-muted)">${count} trackings</span>
                  </div>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width:${pct}%;background:${g===1?'var(--g1-color)':g===2?'var(--g2-color)':'var(--g3-color)'}"></div>
                  </div>
                  <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${info.desc}</div>
                </div>
              `;
            }).join('')}
          </div>
          ${_esOperador ? '' : `
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
            <div class="card-title" style="margin-bottom:12px">Acciones Rápidas</div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <a href="operacion.html" class="btn btn-primary w-full" style="justify-content:center">
                ▶  Iniciar Nueva Operación
              </a>
              <a href="clientes.html" class="btn btn-secondary w-full" style="justify-content:center">
                ⚙  Administrar Clientes
              </a>
              <a href="reportes.html" class="btn btn-secondary w-full" style="justify-content:center">
                📄  Ver Reportes
              </a>
            </div>
          </div>
          `}
        </div>
        `}

      </div>
    `;

    loadResumen();
    if (!_esCliente) {
      buildUphSection();
      initUph();
      buildRankingSection();
      initRanking();
    }
  } catch (e) {
    content.innerHTML = `<div class="alert alert-error">Error cargando dashboard: ${e.message || 'Error desconocido'}</div>`;
  }
}

function setResumenMode(mode) {
  resumenMode = mode;
  ['todo','hoy','ayer','semana','mes','rango'].forEach(m => {
    const btn = document.getElementById(`rs-btn-${m}`);
    if (btn) btn.className = `btn btn-sm ${m === mode ? 'btn-primary' : 'btn-secondary'}`;
  });
  const rangoInputs = document.getElementById('rs-rango-inputs');
  if (rangoInputs) rangoInputs.style.display = mode === 'rango' ? 'flex' : 'none';
  loadResumen();
}

async function loadResumen() {
  const grid = document.getElementById('stat-grid');
  if (!grid) return;

  let desde = '', hasta = '';
  const now = new Date();
  if (resumenMode === 'hoy') {
    desde = hasta = isoDate(now);
  } else if (resumenMode === 'ayer') {
    const ayer = new Date(now); ayer.setDate(ayer.getDate() - 1);
    desde = hasta = isoDate(ayer);
  } else if (resumenMode === 'semana') {
    const d = new Date(now); d.setDate(d.getDate() - 6);
    desde = isoDate(d); hasta = isoDate(now);
  } else if (resumenMode === 'mes') {
    const d = new Date(now); d.setDate(d.getDate() - 29);
    desde = isoDate(d); hasta = isoDate(now);
  } else if (resumenMode === 'rango') {
    desde = document.getElementById('rs-desde')?.value || '';
    hasta = document.getElementById('rs-hasta')?.value || '';
  }

  const params = new URLSearchParams();
  if (desde) params.append('fecha_desde', desde);
  if (hasta) params.append('fecha_hasta', hasta);
  if (resumenClienteId) params.append('cliente_id', resumenClienteId);

  try {
    const [r, sn] = await Promise.all([
      API.get(`/reportes/resumen?${params}`),
      API.get('/skus-nuevos/pendientes'),
    ]);
    grid.innerHTML = `
      <div class="stat-card" style="--accent-color:var(--accent-cyan)">
        <div class="stat-label">Total Trackings</div>
        <div class="stat-value">${formatNum(r.totalTrackings)}</div>
        <div class="stat-sub">${r.totalTrackings - r.trackingsCerrados} abiertos · ${r.trackingsCerrados} cerrados</div>
      </div>
      <div class="stat-card" style="--accent-color:var(--accent-green)">
        <div class="stat-label">Piezas Inspeccionadas</div>
        <div class="stat-value">${formatNum(r.totalPiezas)}</div>
        <div class="stat-sub">Unidades totales procesadas</div>
      </div>
      <div class="stat-card" style="--accent-color:var(--accent-red)">
        <div class="stat-label">Errores Registrados</div>
        <div class="stat-value">${formatNum(r.totalErrores)}</div>
        <div class="stat-sub">Calidad / Origen / Insumos</div>
      </div>
      <div class="stat-card" style="--accent-color:var(--accent-amber)">
        <div class="stat-label">Discrepancias</div>
        <div class="stat-value">${formatNum(r.totalDiscrepancias)}</div>
        <div class="stat-sub">Alertas de inventario</div>
      </div>
      <div class="stat-card" style="--accent-color:var(--accent-amber);${_esOperador ? '' : 'cursor:pointer'}" ${_esOperador ? '' : "onclick=\"window.location='skus-nuevos.html?solo_sin_completar=1'\""}>
        <div class="stat-label">SKUs Nuevos Pendientes</div>
        <div class="stat-value">${formatNum(sn.count)}</div>
        <div class="stat-sub" style="color:var(--accent-amber)">${_esOperador ? 'Sin fotos completas' : 'Sin fotos completas · clic para ver'}</div>
      </div>
    `;
  } catch(e) {}
}

loadDashboard();

// ── Hora por Hora ─────────────────────────────────────────────────────────────

let uphChart = null;
let uphRawData = [];
let uphOperadores = [];

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getRangeFor(mode) {
  const now = new Date();
  if (mode === 'dia') {
    return { desde: isoDate(now), hasta: isoDate(now) };
  } else if (mode === 'semana') {
    const d = new Date(now);
    d.setDate(d.getDate() - 6);
    return { desde: isoDate(d), hasta: isoDate(now) };
  } else {
    const d = new Date(now);
    d.setDate(d.getDate() - 29);
    return { desde: isoDate(d), hasta: isoDate(now) };
  }
}

function buildUphSection() {
  const section = document.createElement('div');
  section.id = 'uph-section';
  section.style.cssText = 'margin-top:16px';
  section.innerHTML = `
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px">
        <span class="card-title">Productividad Hora por Hora</span>
        <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center">
          <div style="display:flex;gap:4px">
            <button id="uph-btn-dia" class="btn btn-primary btn-sm" onclick="setUphMode('dia')">Hoy</button>
            <button id="uph-btn-semana" class="btn btn-secondary btn-sm" onclick="setUphMode('semana')">Semana</button>
            <button id="uph-btn-mes" class="btn btn-secondary btn-sm" onclick="setUphMode('mes')">Mes</button>
          </div>
          <select id="uph-cliente" class="form-control" style="width:170px" onchange="loadUph()">
            <option value="">Todos los clientes</option>
          </select>
          <select id="uph-operador" class="form-control" style="width:170px" onchange="loadUph()">
            <option value="">Todos los operadores</option>
          </select>
        </div>
      </div>
      <div style="padding:0 4px 4px">
        <canvas id="uph-chart" height="100"></canvas>
      </div>
      <div id="uph-empty" class="empty-state" style="display:none">
        <div class="empty-state-icon">📊</div>
        <div class="empty-state-title">Sin datos en el rango seleccionado</div>
        <div class="empty-state-text">Registra operaciones para ver la productividad</div>
      </div>
    </div>
  `;
  document.getElementById('page-content').appendChild(section);
}

let uphMode = 'dia';

function setUphMode(mode) {
  uphMode = mode;
  ['dia','semana','mes'].forEach(m => {
    const btn = document.getElementById(`uph-btn-${m}`);
    if (btn) {
      btn.className = `btn btn-sm ${m === mode ? 'btn-primary' : 'btn-secondary'}`;
    }
  });
  loadUph();
}

async function initUph() {
  try {
    const [operadores, clientes] = await Promise.all([
      API.get('/dashboard/operadores'),
      API.get('/clientes')
    ]);

    const selOp = document.getElementById('uph-operador');
    operadores.forEach(op => {
      const o = document.createElement('option');
      o.value = op; o.textContent = op;
      selOp.appendChild(o);
    });

    const selCl = document.getElementById('uph-cliente');
    clientes.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.nombre;
      selCl.appendChild(o);
    });
  } catch(e) {}
  loadUph();
}

async function loadUph() {
  const { desde, hasta } = getRangeFor(uphMode);
  const operador = document.getElementById('uph-operador')?.value || '';
  const clienteId = document.getElementById('uph-cliente')?.value || '';
  const params = new URLSearchParams({ fecha_desde: desde, fecha_hasta: hasta });
  if (operador) params.append('operador', operador);
  if (clienteId) params.append('cliente_id', clienteId);

  try {
    uphRawData = await API.get(`/dashboard/hora-por-hora?${params}`);
    renderUphChart(uphRawData, uphMode, operador);
  } catch(e) {
    // Show empty state on API error
    const canvas = document.getElementById('uph-chart');
    const emptyEl = document.getElementById('uph-empty');
    if (canvas) canvas.style.display = 'none';
    if (emptyEl) emptyEl.style.display = '';
    if (uphChart) { uphChart.destroy(); uphChart = null; }
  }
}

function renderUphChart(data, mode, operadorFiltro) {
  const canvas = document.getElementById('uph-chart');
  const emptyEl = document.getElementById('uph-empty');
  if (!canvas) return;

  if (!data || data.length === 0) {
    canvas.style.display = 'none';
    emptyEl.style.display = '';
    if (uphChart) { uphChart.destroy(); uphChart = null; }
    return;
  }
  canvas.style.display = '';
  emptyEl.style.display = 'none';

  const porDia = mode === 'semana' || mode === 'mes';
  const labelMap = new Map(); // label → { unidades, meta }

  data.forEach(row => {
    // Hoy → agrega por hora; Semana/Mes → agrega por día
    const label = porDia ? row.fecha : `${String(row.hora).padStart(2,'0')}:00`;
    const prev = labelMap.get(label) || { unidades: 0, meta: 0 };
    prev.unidades += (row.unidades || 0);
    const ops = operadorFiltro ? 1 : (row.num_operadores || 1);
    prev.meta += (row.uph || 0) * ops;
    labelMap.set(label, prev);
  });

  if (mode === 'dia') {
    // Rellenar las 24 horas del día aunque no haya producción
    for (let h = 0; h < 24; h++) {
      const lbl = `${String(h).padStart(2,'0')}:00`;
      if (!labelMap.has(lbl)) labelMap.set(lbl, { unidades: 0, meta: 0 });
    }
  } else {
    // Rellenar todos los días del rango aunque no haya producción
    const { desde, hasta } = getRangeFor(mode);
    const cur = new Date(desde + 'T12:00:00');
    const end = new Date(hasta + 'T12:00:00');
    while (cur <= end) {
      const key = isoDate(cur);
      if (!labelMap.has(key)) labelMap.set(key, { unidades: 0, meta: 0 });
      cur.setDate(cur.getDate() + 1);
    }
  }

  const sortedKeys = [...labelMap.keys()].sort();
  const barData  = sortedKeys.map(l => labelMap.get(l).unidades);
  const lineData = sortedKeys.map(l => labelMap.get(l).meta);

  // Etiquetas legibles: YYYY-MM-DD → DD/MM para semana/mes
  const sortedLabels = porDia
    ? sortedKeys.map(k => { const [,m,d] = k.split('-'); return `${d}/${m}`; })
    : sortedKeys;

  // Actualizar título de la card según modo
  const titleEl = document.querySelector('#uph-section .card-title');
  if (titleEl) titleEl.textContent = porDia ? 'Productividad por Día' : 'Productividad Hora por Hora';

  if (uphChart) uphChart.destroy();

  uphChart = new Chart(canvas, {
    data: {
      labels: sortedLabels,
      datasets: [
        {
          type: 'bar',
          label: 'Unidades procesadas',
          data: barData,
          backgroundColor: sortedKeys.map((l, i) => barData[i] >= lineData[i] && lineData[i] > 0
            ? 'rgba(0,230,118,0.7)'
            : 'rgba(0,188,212,0.65)'),
          borderRadius: 4,
          order: 2,
        },
        {
          type: 'line',
          label: 'Meta (UPH × operadores)',
          data: lineData,
          borderColor: 'rgba(255,171,0,0.9)',
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: 3,
          pointBackgroundColor: 'rgba(255,171,0,0.9)',
          tension: 0.3,
          order: 1,
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: { color: '#b0bec5', font: { size: 11, family: "'IBM Plex Mono', monospace" } }
        },
        tooltip: {
          callbacks: {
            afterBody(ctx) {
              const idx = ctx[0].dataIndex;
              const real = barData[idx];
              const meta = lineData[idx];
              if (meta === 0) return '';
              const pct = Math.round(real / meta * 100);
              return `Eficiencia: ${pct}%`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#78909c', font: { size: 10 }, maxRotation: 45 },
          grid: { color: 'rgba(255,255,255,0.05)' }
        },
        y: {
          beginAtZero: true,
          ticks: { color: '#78909c', font: { size: 11 } },
          grid: { color: 'rgba(255,255,255,0.07)' }
        }
      }
    }
  });
}

// ── Ranking de Operadores ─────────────────────────────────────────────────────

let rankingMode = 'dia';

function buildRankingSection() {
  const section = document.createElement('div');
  section.id = 'ranking-section';
  section.style.cssText = 'margin-top:16px';
  section.innerHTML = `
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px">
        <span class="card-title">🏆 Ranking de Operadores</span>
        <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center">
          <div style="display:flex;gap:4px">
            <button id="rk-btn-dia"   class="btn btn-primary btn-sm"   onclick="setRankingMode('dia')">Hoy</button>
            <button id="rk-btn-ayer"  class="btn btn-secondary btn-sm" onclick="setRankingMode('ayer')">Ayer</button>
            <button id="rk-btn-rango" class="btn btn-secondary btn-sm" onclick="setRankingMode('rango')">Rango</button>
            <button class="btn btn-ghost btn-sm" onclick="resetRanking()" title="Ver ranking de todo el tiempo">↻</button>
          </div>
          <div id="rk-rango-inputs" style="display:none;gap:6px;align-items:center">
            <input type="date" id="rk-desde" class="form-control" style="width:140px" onchange="loadRanking()">
            <span style="color:var(--text-muted);font-size:12px">—</span>
            <input type="date" id="rk-hasta" class="form-control" style="width:140px" onchange="loadRanking()">
          </div>
          <select id="rk-cliente" class="form-control" style="width:170px" onchange="loadRanking()">
            <option value="">Todos los clientes</option>
          </select>
        </div>
      </div>
      <div id="rk-body" style="padding:8px 0"></div>
    </div>
  `;
  document.getElementById('page-content').appendChild(section);
}

function resetRanking() {
  rankingMode = '';
  ['dia','ayer','rango'].forEach(m => {
    const btn = document.getElementById(`rk-btn-${m}`);
    if (btn) btn.className = 'btn btn-sm btn-secondary';
  });
  document.getElementById('rk-rango-inputs').style.display = 'none';
  loadRanking();
}

function setRankingMode(mode) {
  rankingMode = mode;
  ['dia','ayer','rango'].forEach(m => {
    const btn = document.getElementById(`rk-btn-${m}`);
    if (btn) btn.className = `btn btn-sm ${m === mode ? 'btn-primary' : 'btn-secondary'}`;
  });
  document.getElementById('rk-rango-inputs').style.display = mode === 'rango' ? 'flex' : 'none';
  loadRanking();
}

async function initRanking() {
  try {
    const clientes = await API.get('/clientes');
    const sel = document.getElementById('rk-cliente');
    clientes.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.nombre;
      sel.appendChild(o);
    });
  } catch(e) {}
  loadRanking();
}

async function loadRanking() {
  let desde, hasta;
  if (rankingMode === 'dia') {
    desde = hasta = isoDate(new Date());
  } else if (rankingMode === 'ayer') {
    const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
    desde = hasta = isoDate(ayer);
  } else {
    desde = document.getElementById('rk-desde')?.value || '';
    hasta = document.getElementById('rk-hasta')?.value || '';
  }
  const clienteId = document.getElementById('rk-cliente')?.value || '';
  const params = new URLSearchParams();
  if (desde) params.append('fecha_desde', desde);
  if (hasta) params.append('fecha_hasta', hasta);
  if (clienteId) params.append('cliente_id', clienteId);

  const body = document.getElementById('rk-body');
  if (!body) return;

  try {
    const data = await API.get(`/dashboard/ranking?${params}`);
    if (!data || data.length === 0) {
      body.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🏆</div>
          <div class="empty-state-title">Sin datos en el período seleccionado</div>
          <div class="empty-state-text">Registra operaciones para ver el ranking</div>
        </div>`;
      return;
    }

    const TROFEOS = ['🥇','🥈','🥉'];
    const maxPiezas = data[0].total_piezas || 1;

    body.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:0;padding:4px 8px 8px">
        ${data.map((row, i) => {
          const trofeo   = i < 3 ? TROFEOS[i] : null;
          const pct      = Math.round((row.total_piezas / maxPiezas) * 100);
          const barColor = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : 'var(--accent-cyan)';
          const numColor = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : 'var(--text-muted)';
          return `
            <div style="display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border)">
              <div style="text-align:center;font-size:${trofeo ? '22px' : '13px'};font-family:'IBM Plex Mono',monospace;color:${numColor};font-weight:700">
                ${trofeo || `#${i + 1}`}
              </div>
              <div>
                <div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:5px">${row.operador}</div>
                <div style="height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden">
                  <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px;transition:width .4s ease"></div>
                </div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:3px">${row.total_trackings} tracking${row.total_trackings !== 1 ? 's' : ''}</div>
              </div>
              <div style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;color:${barColor};white-space:nowrap">
                ${formatNum(row.total_piezas)}<span style="font-size:10px;font-weight:400;color:var(--text-muted);margin-left:3px">pzas</span>
              </div>
            </div>`;
        }).join('')}
      </div>`;
  } catch(e) {
    body.innerHTML = `<div class="alert alert-error" style="margin:8px">Error cargando ranking</div>`;
  }
}

// ── SMTP CONFIG (ADMIN only) ──────────────────────────────────────────────────
if (_pageUser?.rol === 'ADMIN') {
  const smtpCard = document.createElement('div');
  smtpCard.className = 'card';
  smtpCard.style.marginTop = '24px';
  smtpCard.innerHTML = `
    <div class="card-header">
      <span class="card-title" style="display:flex;align-items:center;gap:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Configuración de Correo SMTP
      </span>
      <span id="smtp-estado-badge" style="font-size:11px;font-family:'IBM Plex Mono',monospace;padding:3px 8px;border-radius:4px;background:rgba(148,163,184,.15);color:var(--text-muted)">Cargando…</span>
    </div>
    <div style="padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">SMTP Host</label>
        <input id="smtp-host" type="text" class="form-control" placeholder="smtp.gmail.com">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Puerto</label>
        <input id="smtp-port" type="number" class="form-control" placeholder="587" value="587">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Email remitente</label>
        <input id="smtp-user" type="email" class="form-control" placeholder="tu@gmail.com">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Contraseña / App Password</label>
        <div style="position:relative">
          <input id="smtp-pass" type="password" class="form-control" placeholder="Dejar vacío para no cambiar" style="padding-right:40px">
          <button onclick="toggleSmtpPass()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px" title="Mostrar/ocultar">👁</button>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0;grid-column:1/-1">
        <label class="form-label">Nombre del remitente</label>
        <input id="smtp-from-name" type="text" class="form-control" placeholder="Sistema Logístico">
      </div>
    </div>
    <div id="smtp-msg" style="display:none;margin:0 24px 12px;padding:10px 14px;border-radius:6px;font-size:13px"></div>
    <div style="padding:0 24px 20px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="guardarSmtp()">Guardar configuración</button>
      <button class="btn btn-secondary btn-sm" onclick="probarSmtp()">Enviar correo de prueba</button>
    </div>`;

  document.getElementById('page-content').appendChild(smtpCard);
  loadSmtpConfig();
}

async function loadSmtpConfig() {
  try {
    const cfg = await API.get('/config/smtp');
    if (document.getElementById('smtp-host')) document.getElementById('smtp-host').value = cfg.host || '';
    if (document.getElementById('smtp-port')) document.getElementById('smtp-port').value = cfg.port || 587;
    if (document.getElementById('smtp-user')) document.getElementById('smtp-user').value = cfg.user || '';
    if (document.getElementById('smtp-from-name')) document.getElementById('smtp-from-name').value = cfg.from_name || '';
    const badge = document.getElementById('smtp-estado-badge');
    if (badge) {
      badge.textContent = cfg.configured ? '● Configurado' : '○ No configurado';
      badge.style.background = cfg.configured ? 'rgba(39,174,96,.15)' : 'rgba(220,38,38,.1)';
      badge.style.color = cfg.configured ? 'var(--accent-green)' : 'var(--accent-red)';
    }
  } catch(e) {}
}

function toggleSmtpPass() {
  const input = document.getElementById('smtp-pass');
  if (input) input.type = input.type === 'password' ? 'text' : 'password';
}

function showSmtpMsg(msg, type) {
  const el = document.getElementById('smtp-msg');
  if (!el) return;
  el.style.display = 'block';
  el.style.background = type === 'error' ? 'rgba(220,38,38,.08)' : 'rgba(39,174,96,.08)';
  el.style.color = type === 'error' ? 'var(--accent-red)' : 'var(--accent-green)';
  el.style.border = `1px solid ${type === 'error' ? 'rgba(220,38,38,.25)' : 'rgba(39,174,96,.25)'}`;
  el.textContent = msg;
}

async function guardarSmtp() {
  try {
    await API.post('/config/smtp', {
      host:      document.getElementById('smtp-host').value.trim(),
      port:      parseInt(document.getElementById('smtp-port').value) || 587,
      user:      document.getElementById('smtp-user').value.trim(),
      pass:      document.getElementById('smtp-pass').value,
      from_name: document.getElementById('smtp-from-name').value.trim(),
    });
    showSmtpMsg('Configuración guardada correctamente', 'ok');
    loadSmtpConfig();
  } catch(e) {
    showSmtpMsg(e.error || 'Error al guardar', 'error');
  }
}

async function probarSmtp() {
  showSmtpMsg('Enviando correo de prueba…', 'ok');
  try {
    const r = await API.post('/config/smtp/test', {});
    showSmtpMsg(r.mensaje || 'Correo enviado', 'ok');
  } catch(e) {
    showSmtpMsg(e.error || 'Error al enviar', 'error');
  }
}
</script>
</body>
</html>
