<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operación — Sistema Logístico</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .fase-indicator {
      display:flex;gap:0;margin-bottom:24px;
      border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;
    }
    .fase {
      flex:1;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;
      font-weight:700;letter-spacing:0.06em;text-align:center;
      background:var(--bg-elevated);color:var(--text-muted);
      border-right:1px solid var(--border);transition:all .2s;
    }
    .fase:last-child{border-right:none;}
    .fase.active{background:rgba(0,230,118,.1);color:var(--accent-green);}
    .fase.done{background:rgba(0,230,118,.05);color:var(--accent-green-dim);}
    .fase-num{display:block;font-size:9px;color:inherit;opacity:.7;margin-bottom:2px;}

    .sku-list-item{
      background:var(--bg-elevated);border:1px solid var(--border);
      border-radius:var(--radius-sm);padding:12px 14px;
      display:flex;align-items:center;gap:12px;
      animation:slideIn .2s ease;
    }
    @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

    .sku-list-item.has-error{border-color:rgba(255,61,61,.3);}
    .sku-code{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--accent-cyan);}
    .sku-meta{font-size:11px;color:var(--text-muted);}
    .sku-badges{display:flex;gap:4px;flex-wrap:wrap;}

    .foto-modo-btn{
      flex:1;padding:8px 12px;background:var(--bg-elevated);color:var(--text-muted);
      border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;
      border-right:1px solid var(--border);
    }
    .foto-modo-btn:last-child{border-right:none;}
    .foto-modo-btn.active{background:var(--bg-card);color:var(--text-primary);}

    .panel-right{
      background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);
      position:sticky;top:76px;height:fit-content;
    }
    .panel-header{
      padding:14px 16px;border-bottom:1px solid var(--border);
      font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
      letter-spacing:.08em;color:var(--text-secondary);text-transform:uppercase;
    }
    .info-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:8px 16px;border-bottom:1px solid var(--border);
    }
    .info-row:last-child{border-bottom:none;}
    .info-key{font-size:11px;color:var(--text-muted);}
    .info-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--text-primary);}

    /* Chat */
    @keyframes fadeInMsg { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .chat-msg { animation: fadeInMsg .2s ease; }
    .chat-avatar {
      width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;flex-shrink:0;color:#fff;
    }
    .chat-bubble {
      max-width:72%;background:var(--bg-card);border:1px solid var(--border);
      border-radius:var(--radius-sm);padding:8px 12px;
    }
    .chat-bubble.own { background:rgba(0,188,212,.1);border-color:rgba(0,188,212,.3); }
  </style>
</head>
<body>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
const _pageUser = checkAuth(['ADMIN','SUPERVISOR','OPERADOR','CLIENTE']);
const _soloLectura = _pageUser?.rol === 'CLIENTE';
buildShell('Operación', 'OPERACIÓN / INSPECCIÓN', '', _pageUser);

document.getElementById('page-content').innerHTML = `
  <div id="fase-inicio" class="hidden">
    <!-- Fase 1: Inicio de tracking -->
  </div>
  <div id="fase-inspeccion" class="hidden">
    <!-- Fase 2: Inspección SKUs -->
  </div>
  <div id="loading-state" style="text-align:center;padding:80px">
    <div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto"></div>
    <div style="margin-top:16px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;font-size:12px">CARGANDO...</div>
  </div>
`;

// Modal Nota de Crédito
document.body.insertAdjacentHTML('beforeend', `
  <div id="modal-nota-credito" class="modal-overlay">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <span class="modal-title">${t('op.credit_modal_title')}</span>
        <button class="modal-close" onclick="closeModal('modal-nota-credito')">×</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">
          ${t('op.credit_modal_hint')}
        </p>
        <div class="form-group">
          <label class="form-label">${t('op.credit_label')}</label>
          <input type="text" class="form-control" id="nota-credito-input" placeholder="${t('op.credit_placeholder')}"
            onkeydown="if(event.key==='Enter') guardarNotaCredito()">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-nota-credito')">${t('btn.cancel')}</button>
        <button class="btn btn-primary" onclick="guardarNotaCredito()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
          ${t('btn.save')}
        </button>
      </div>
    </div>
  </div>
`);

// Modal Editar Detalle SKU
document.body.insertAdjacentHTML('beforeend', `
  <div id="modal-editar-detalle" class="modal-overlay">
    <div class="modal" style="max-width:540px">
      <div class="modal-header">
        <span class="modal-title">✏️ Editar SKU registrado</span>
        <button class="modal-close" onclick="closeModal('modal-editar-detalle')">×</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:14px">
        <input type="hidden" id="ed-id">
        <input type="hidden" id="ed-tracking-id">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">SKU</label>
            <input class="form-control form-control-mono" id="ed-sku" readonly style="opacity:.6">
          </div>
          <div class="form-group">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control form-control-mono" id="ed-cantidad" min="1" style="width:80px">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Descripción</label>
          <input class="form-control" id="ed-desc" placeholder="Nombre / descripción del producto">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">País de Origen</label>
            <select class="form-control" id="ed-pais-select" onchange="onEdPaisSelect(this.value)">
              ${COUNTRY_OPTIONS}
            </select>
            <input type="text" class="form-control mt-8" id="ed-pais-manual" placeholder="Enter country name..." style="display:none">
          </div>
          <div class="form-group">
            <label class="form-label">Insumos / Composición</label>
            <input class="form-control" id="ed-insumos" placeholder="Ej: 100% Cotton">
          </div>
        </div>
        <div id="ed-calidad-section" class="form-group">
          <label class="form-label">Calidad</label>
          <select class="form-control" id="ed-calidad">
            <option value="Buena">✓ Buena</option>
            <option value="Mala">✕ Mala</option>
          </select>
        </div>
        <!-- Fotos de evidencia (dinámico) -->
        <div id="ed-fotos-section" class="hidden">
          <div class="section-title" style="margin-bottom:8px;font-size:10px">Fotografías de evidencia</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px" id="ed-fotos-grid"></div>
        </div>
        <!-- Retrabajos (dinámico, solo si modulo_retrabajo=1) -->
        <div id="ed-retrabajos-section" class="hidden">
          <div class="section-title" style="margin-bottom:8px;font-size:10px">Retrabajos</div>
          <div id="ed-retrabajos-lista"></div>
          <div id="ed-retrabajos-agregar" style="margin-top:8px"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-editar-detalle')">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarEditarDetalle()">Guardar</button>
      </div>
    </div>
  </div>
`);

// Modal de Error/Evidencia
document.body.insertAdjacentHTML('beforeend', `
  <div id="modal-error" class="modal-overlay" onclick="if(event.target===this)cerrarModalError()">
    <div class="modal" style="max-width:500px">
      <div class="modal-header">
        <span class="modal-title">📸 Registrar Error / Evidencia</span>
        <button class="modal-close" onclick="cerrarModalError()">×</button>
      </div>
      <div class="modal-body">
        <div id="disposicion-danados" class="disposicion-banner">
          <span class="disposicion-icon">📦</span>
          <div>
            <div class="disposicion-text">COLOCAR EN CAJA DE DAÑADOS</div>
            <div class="disposicion-sub">Instrucción mandatoria — separar físicamente la pieza</div>
          </div>
        </div>
        <div id="disposicion-retrabajo" class="disposicion-banner hidden" style="background:rgba(255,171,0,0.08);border-color:#ffab00">
          <span class="disposicion-icon">🔧</span>
          <div>
            <div class="disposicion-text" style="color:#ffab00">ENVIAR A RETRABAJO</div>
            <div class="disposicion-sub">La pieza irá a la cola de corrección antes de continuar.</div>
          </div>
        </div>
        <div id="disposicion-discrepancia" class="disposicion-banner hidden" style="background:rgba(68,138,255,0.08);border-color:var(--accent-blue)">
          <span class="disposicion-icon">📋</span>
          <div>
            <div class="disposicion-text" style="color:var(--accent-blue)">MANTENER EN CAJA — DOCUMENTAR</div>
            <div class="disposicion-sub">La pieza no está dañada. Registrar discrepancia y continuar flujo.</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de Error *</label>
          <select class="form-control" id="error-tipo" onchange="onTipoErrorChange(this.value)">
            <option value="Calidad">Calidad — Pieza dañada / defectuosa</option>
            <option value="Origen">País de Origen — No coincide con catálogo</option>
            <option value="Insumo">Insumos / Material — No coincide con catálogo</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <!-- SECCIÓN RETRABAJOS (solo para clientes con módulo activo) -->
        <div id="seccion-retrabajos-modal" class="hidden">
          <div style="margin-bottom:8px;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase">Retrabajos requeridos</div>
          <div id="rt-botones" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
          <div id="rt-otro-input" class="hidden" style="margin-top:8px">
            <input type="text" class="form-control" id="rt-otro-texto" placeholder="Describe el retrabajo adicional...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Fotografía de Evidencia *</label>

          <!-- Selector de modo -->
          <div style="display:flex;gap:0;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden">
            <button id="btn-modo-local" class="foto-modo-btn active" onclick="setFotoMode('local')">📁 Subir archivo</button>
            <button id="btn-modo-qr" class="foto-modo-btn" onclick="setFotoMode('qr')">📱 Foto con teléfono</button>
          </div>

          <!-- Modo A: archivo local -->
          <div id="foto-modo-local">
            <div class="photo-upload" id="photo-drop-zone">
              <input type="file" id="error-foto" accept="image/*" capture="environment" onchange="previewFoto(this)">
              <div class="photo-upload-icon">📷</div>
              <div class="photo-upload-text">Toca para tomar foto o seleccionar imagen</div>
              <div class="photo-upload-hint">JPG, PNG — requerido para guardar</div>
            </div>
            <img id="foto-preview" class="photo-preview hidden" alt="Vista previa">
          </div>

          <!-- Modo B: QR móvil -->
          <div id="foto-modo-qr" class="hidden">
            <div id="qr-idle" style="text-align:center;padding:16px 0">
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5">
                Genera un QR y escanéalo con tu teléfono para tomar la foto con la cámara del móvil
              </div>
              <button class="btn btn-secondary" onclick="iniciarSesionQR()" style="justify-content:center;max-width:220px;margin:0 auto">
                📱 Generar QR
              </button>
            </div>

            <div id="qr-activo" class="hidden" style="text-align:center">
              <div id="qr-code-div" style="display:inline-block;background:#fff;padding:10px;border-radius:8px;margin-bottom:10px"></div>
              <div style="display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:4px">
                <span style="font-size:11px;color:var(--text-muted)">Expira en</span>
                <span id="qr-countdown" style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--text-secondary)">10:00</span>
              </div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">Esperando foto desde el teléfono…</div>
              <div class="spinner" id="qr-spinner" style="width:16px;height:16px;border-width:2px;margin:0 auto 8px"></div>
              <button class="btn btn-secondary btn-sm hidden" id="btn-nuevo-qr" onclick="iniciarSesionQR()" style="justify-content:center;margin:0 auto;max-width:180px">
                ↻ Generar nuevo QR
              </button>
            </div>

            <div id="qr-recibida" class="hidden" style="text-align:center">
              <div style="color:var(--accent-green);font-weight:700;font-size:13px;margin-bottom:8px">✅ Foto recibida desde el teléfono</div>
              <img id="foto-qr-preview" style="max-width:100%;border-radius:8px;max-height:180px;object-fit:cover;border:1px solid var(--border)" alt="Foto recibida">
              <div style="margin-top:8px">
                <button class="btn btn-secondary btn-sm" onclick="resetQRSesion()" style="justify-content:center;margin:0 auto;max-width:160px">
                  ↩ Cambiar foto
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Descripción del Error *</label>
          <textarea class="form-control" id="error-desc" rows="3" placeholder="Describe detalladamente el defecto o discrepancia encontrada..." style="resize:vertical"></textarea>
        </div>

        <input type="hidden" id="error-detalle-id">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModalError()">Cancelar</button>
        <button class="btn btn-danger" onclick="guardarError()">
          ⚠ Registrar Error
        </button>
      </div>
    </div>
  </div>

  <div id="modal-discrepancia" class="modal-overlay">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <span class="modal-title">⚠ Discrepancia de Inventario</span>
        <button class="modal-close" onclick="closeModal('modal-discrepancia')">×</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-warning">
          La cantidad física no coincide con la declarada en el Tracking. Registra la cantidad real para generar la alerta.
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Cantidad Declarada</label>
            <input type="number" class="form-control form-control-mono" id="disc-original" readonly style="opacity:.6">
          </div>
          <div class="form-group">
            <label class="form-label">Cantidad Real *</label>
            <input type="number" class="form-control form-control-mono" id="disc-corregida" placeholder="0" min="0">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Nota (opcional)</label>
          <input type="text" class="form-control" id="disc-nota" placeholder="Motivo de la discrepancia...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-discrepancia')">Cancelar</button>
        <button class="btn btn-amber" onclick="guardarDiscrepancia()">Registrar Discrepancia</button>
      </div>
    </div>
  </div>

  <div id="modal-cierre" class="modal-overlay">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <span class="modal-title">✓ Cerrar Tracking</span>
        <button class="modal-close" onclick="closeModal('modal-cierre')">×</button>
      </div>
      <div class="modal-body">
        <p style="margin:0 0 16px;color:var(--text-secondary);font-size:14px">
          Ingresa el número de identificación antes de cerrar. Una vez cerrado no se podrán agregar más SKUs.
        </p>
        <div class="form-group">
          <label class="form-label" id="cierre-caja-label">Número de Caja *</label>
          <input type="text" class="form-control form-control-mono" id="cierre-caja-input" placeholder="CAJA-001"
            onkeydown="if(event.key==='Enter') confirmarCierre()">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-cierre')">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmarCierre()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
          Confirmar Cierre
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Mercancía no pertenece a cliente -->
  <div id="modal-mercancia-ajena" class="modal-overlay">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <span class="modal-title">⛔ Mercancía no pertenece a cliente</span>
        <button class="modal-close" onclick="closeModal('modal-mercancia-ajena')">×</button>
      </div>
      <div class="modal-body">
        <div class="disposicion-banner" style="margin-bottom:16px">
          <span class="disposicion-icon">📦</span>
          <div>
            <div class="disposicion-text">COLOCAR EN CAJA DE DAÑADOS</div>
            <div class="disposicion-sub">Esta mercancía no corresponde al cliente — separar físicamente</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Fotografía de Evidencia *</label>

let state = {
  fase: 'inicio', // 'inicio' | 'inspeccion'
  tracking: null,
  cliente: null,
  detalles: [],
  errores: [],
  retrabajos: [],
  g0piezas: [],
  g0ordenitems: [],
  skuActual: null,
  paisCoincide: true,
  insumosCoincide: true,
  calidadActual: 'Buena',
  pendingReset: false, // true mientras el modal de error está abierto tras registrar un SKU
};

// Check URL for existing tracking
const params = new URLSearchParams(window.location.search);
const trackingIdParam = params.get('id');

async function init() {
  if (trackingIdParam) {
    try {
      const tracking = await API.get(`/trackings/${trackingIdParam}`);
      state.tracking = tracking;
      state.cliente = tracking;
      const grado = parseInt(tracking.grado_confianza);
      const [detalles, errores, retrabajos, g0piezas, g0ordenitems] = await Promise.all([
        grado !== 0 ? API.get(`/trackings/${trackingIdParam}/detalles`) : Promise.resolve([]),
        grado !== 0 ? API.get(`/trackings/${trackingIdParam}/errores`) : Promise.resolve([]),
        grado !== 0 ? API.get(`/trackings/${trackingIdParam}/retrabajos`) : Promise.resolve([]),
        grado === 0 ? API.get(`/trackings/${trackingIdParam}/g0-piezas`) : Promise.resolve([]),
        grado === 0 ? API.get(`/ordenes/items-por-tracking?tracking_number=${encodeURIComponent(tracking.tracking_number)}&cliente_id=${encodeURIComponent(tracking.cliente_id)}`) : Promise.resolve([]),
      ]);
      state.detalles = detalles;
      state.errores = errores;
      state.retrabajos = retrabajos;
      state.g0piezas = g0piezas;
      state.g0ordenitems = g0ordenitems;
      state.fase = 'inspeccion';
      renderInspeccion();
    } catch(e) {
      renderInicio();
    }
  } else {
    if (_soloLectura) { window.location.href = 'trackings.html'; return; }
    renderInicio();
  }
}

async function irUltimaOperacion() {
  const btn = document.getElementById('btn-ultima-op');
  if (btn) { btn.disabled = true; btn.textContent = 'Buscando...'; }
  try {
    const trackings = await API.get('/trackings');
    const userEmail = _pageUser?.email || '';
    const abiertos = trackings
      .filter(t => t.estatus === 'abierto' && t.operador === userEmail)
      .sort((a, b) => b.created_at?.localeCompare(a.created_at || '') || 0);
    if (abiertos.length === 0) {
      toast('No tienes operaciones abiertas', 'warning');
      return;
    }
    window.location.href = `operacion.html?id=${abiertos[0].id}`;
  } catch(e) {
    toast('Error al buscar operaciones', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg> Última operación abierta'; }
  }
}

function onClienteChange(sel) {
  const opt = sel.selectedOptions[0];
  const preview = document.getElementById('cliente-config-preview');
  const badges = document.getElementById('cliente-badges');

  const secOrden = document.getElementById('seccion-numero-orden');
  const secRetorno = document.getElementById('seccion-tipo-retorno');
  const secRazon = document.getElementById('seccion-razon-retorno');

  if (!opt.value) {
    preview.classList.add('hidden');
    secOrden?.classList.add('hidden');
    secRetorno?.classList.add('hidden');
    secRazon?.classList.add('hidden');
    return;
  }

  const grado = parseInt(opt.dataset.grado);
  const gradeClasses = { 1: 'grado-1', 2: 'grado-2', 3: 'grado-3' };
  const calidad = opt.dataset.calidad === '1';
  const retrabajo = opt.dataset.retrabajo === '1';
  const pct = opt.dataset.pct;
  const almacenamiento = opt.dataset.almacenamiento || 'caja';
  const esPallet = almacenamiento === 'pallet';
  const requiereOrden = opt.dataset.requiereOrden === '1';
  const requiereTipoRetorno = opt.dataset.requiereTipoRetorno === '1';

  badges.innerHTML = `
    <span class="grado-badge ${gradeClasses[grado]}">${t('grade.' + grado)}</span>
    ${calidad ? '<span class="badge badge-blue">✓ Calidad</span>' : ''}
    ${retrabajo ? '<span class="badge badge-amber">✓ Retrabajos</span>' : ''}
    ${grado === 2 ? `<span class="badge badge-muted">Muestreo ${pct}%</span>` : ''}
    <span class="badge badge-muted">${esPallet ? '⬛ Pallet' : '📦 Caja'}</span>
    ${requiereOrden ? '<span class="badge badge-green"># Orden</span>' : ''}
    ${requiereTipoRetorno ? '<span class="badge badge-amber">RMA/RTS</span>' : ''}
  `;
  preview.classList.remove('hidden');

  if (secOrden) secOrden.classList.toggle('hidden', !requiereOrden);
  if (secRetorno) {
    secRetorno.classList.toggle('hidden', !requiereTipoRetorno);
    if (!requiereTipoRetorno && secRazon) secRazon.classList.add('hidden');
    // Reset radio on client change
    if (requiereTipoRetorno) {
      document.querySelectorAll('input[name="ini-tipo-retorno"]').forEach(r => r.checked = false);
      onTipoRetornoChange(null);
    }
  }
}

function onTipoRetornoChange(tipo) {
  const secRazon = document.getElementById('seccion-razon-retorno');
  const btnRma = document.getElementById('btn-tipo-rma');
  const btnRts = document.getElementById('btn-tipo-rts');
  const esRts = tipo === 'RTS';
  const esRma = tipo === 'RMA';

  if (btnRma) btnRma.style.cssText = `display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;border:${esRma ? '2px solid var(--accent-green);background:rgba(0,230,118,0.08)' : '1px solid var(--border);background:var(--bg-elevated)'}`;
  if (btnRts) btnRts.style.cssText = `display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;border:${esRts ? '2px solid var(--accent-green);background:rgba(0,230,118,0.08)' : '1px solid var(--border);background:var(--bg-elevated)'}`;
  if (secRazon) secRazon.classList.toggle('hidden', !esRts);
  if (!esRts && document.getElementById('ini-razon-retorno')) {
    document.getElementById('ini-razon-retorno').value = '';
  }
}

async function iniciarTracking() {
  const clienteId = document.getElementById('ini-cliente').value;
  const trackingNum = document.getElementById('ini-tracking').value.trim().toUpperCase();
  const cantidadRaw = document.getElementById('ini-cantidad').value;
  const cantidad = cantidadRaw !== '' ? parseInt(cantidadRaw) : 0;
  const alertEl = document.getElementById('alert-inicio');

  if (!clienteId || !trackingNum) {
    alertEl.innerHTML = '<div class="alert alert-error">Todos los campos marcados con * son requeridos</div>';
    return;
  }

  const opt = document.getElementById('ini-cliente').selectedOptions[0];
  const requiereOrden = opt?.dataset.requiereOrden === '1';
  const requiereTipoRetorno = opt?.dataset.requiereTipoRetorno === '1';

  const numeroOrden = document.getElementById('ini-numero-orden')?.value.trim().toUpperCase() || null;
  const tipoRetorno = document.querySelector('input[name="ini-tipo-retorno"]:checked')?.value || null;
  const razonRetorno = document.getElementById('ini-razon-retorno')?.value.trim() || null;

  if (requiereOrden && !numeroOrden) {
    alertEl.innerHTML = '<div class="alert alert-error">El Número de Orden es requerido para este cliente</div>';
    return;
  }
  if (requiereTipoRetorno && !tipoRetorno) {
    alertEl.innerHTML = '<div class="alert alert-error">Debes seleccionar el Tipo de Retorno (RMA o RTS)</div>';
    return;
  }
  if (requiereTipoRetorno && tipoRetorno === 'RTS' && !razonRetorno) {
    alertEl.innerHTML = '<div class="alert alert-error">La Razón de Retorno es requerida para RTS</div>';
    return;
  }

  try {
    alertEl.innerHTML = '';
    const res = await API.post('/trackings', {
      tracking_number: trackingNum,
      cliente_id: clienteId,
      cantidad_declarada: cantidad,
      numero_orden: requiereOrden ? numeroOrden : null,
      tipo_retorno: requiereTipoRetorno ? tipoRetorno : null,
      razon_retorno: requiereTipoRetorno && tipoRetorno === 'RTS' ? razonRetorno : null,
    });

    state.tracking = await API.get(`/trackings/${res.id}`);
    state.cliente = state.tracking;
    state.detalles = [];
    state.errores = [];
    state.g0piezas = [];
    state.fase = 'inspeccion';

    const grado = parseInt(state.tracking.grado_confianza);
    if (grado === 0 && state.tracking.tracking_number) {
      state.g0ordenitems = await API.get(`/ordenes/items-por-tracking?tracking_number=${encodeURIComponent(state.tracking.tracking_number)}&cliente_id=${encodeURIComponent(state.tracking.cliente_id)}`).catch(() => []);
    } else {
      state.g0ordenitems = [];
    }

    // Update URL
    window.history.pushState({}, '', `?id=${res.id}`);

    toast('Tracking iniciado correctamente');
    renderInspeccion();
  } catch(e) {
    alertEl.innerHTML = `<div class="alert alert-error">${e.error || 'Error al crear tracking'}</div>`;
  }
}

function renderG0Manifiesto() {
  const scanCountByBarcode = {};
  const scanCountBySku = {};
  for (const p of state.g0piezas) {
    if (p.barcode) scanCountByBarcode[p.barcode] = (scanCountByBarcode[p.barcode] || 0) + 1;
    if (p.sku)     scanCountBySku[p.sku]         = (scanCountBySku[p.sku]         || 0) + 1;
  }

  const ordenBarcodes = new Set(state.g0ordenitems.map(i => i.barcode).filter(Boolean));
  const ordenSkus     = new Set(state.g0ordenitems.map(i => i.sku).filter(Boolean));

  const rows = state.g0ordenitems.map(item => {
    const esperado = item.quantity || 1;
    const cnt = item.barcode ? (scanCountByBarcode[item.barcode] || 0)
                             : (scanCountBySku[item.sku] || 0);
    let status = 'pending'; // none scanned
    if (cnt >= esperado) status = 'done';
    else if (cnt > 0)    status = 'partial';
    const sobrante = cnt > esperado ? cnt - esperado : 0;
    return { item, cnt, esperado, status, sobrante };
  });

  // Extra pieces not in this order
  const extras = state.g0piezas.filter(p =>
    !(p.barcode && ordenBarcodes.has(p.barcode)) &&
    !(p.sku     && ordenSkus.has(p.sku))
  );

  const completados = rows.filter(r => r.status === 'done').length;
  const total = rows.length;
  const hayProblemas = rows.some(r => r.status !== 'done' || r.sobrante > 0) || extras.length > 0;

  const statusIcon = {
    done:    { icon: '✓', bg: 'rgba(0,200,100,.15)', color: 'var(--accent-green)', border: 'var(--accent-green)' },
    partial: { icon: '½', bg: 'rgba(255,170,0,.12)',  color: 'var(--accent-amber)', border: 'var(--accent-amber)' },
    pending: { icon: '○', bg: 'rgba(255,255,255,.06)', color: 'var(--text-muted)',  border: 'var(--border)' },
  };

  return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <span class="card-title">Contenido de la Orden</span>
        <span class="badge ${!hayProblemas ? 'badge-green' : completados > 0 ? 'badge-amber' : 'badge-red'}" style="font-family:'IBM Plex Mono',monospace">${completados}/${total}</span>
      </div>
      <div style="padding:0 16px 12px">
        ${rows.map(({ item, cnt, esperado, status, sobrante }) => {
          const s = statusIcon[status];
          const textStyle = status === 'done' ? 'text-decoration:line-through;opacity:.6' : '';
          return `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-subtle)">
            <div style="width:18px;height:18px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
              background:${s.bg};color:${s.color};border:1px solid ${s.border}">
              ${s.icon}
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:${status === 'done' ? 'var(--text-muted)' : 'var(--accent-cyan)'};${textStyle}">${escHTML(item.sku)}</div>
              <div style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHTML(item.product_title || '')}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:700;color:${status === 'done' ? 'var(--accent-green)' : status === 'partial' ? 'var(--accent-amber)' : 'var(--text-muted)'}">
                ${cnt}/${esperado}
              </div>
              ${sobrante > 0 ? `<div style="font-size:10px;color:#f87171;font-weight:600">+${sobrante} de más</div>` : ''}
              <div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--text-muted)">${escHTML(item.barcode || '')}</div>
            </div>
          </div>`;
        }).join('')}
        ${extras.length > 0 ? `
          <div style="margin-top:8px;padding:8px 10px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:var(--radius-sm)">
            <div style="font-size:10px;font-weight:700;color:#f87171;margin-bottom:4px">⚠ PIEZAS NO ESPERADAS (${extras.length})</div>
            ${extras.map(p => `
              <div style="font-size:11px;color:#f87171;font-family:'IBM Plex Mono',monospace">${escHTML(p.sku || p.barcode || '—')}</div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function renderG0Inspeccion() {

    </div>

    <div style="display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start">

        <div class="flex justify-between items-center mb-24">

            <div style="padding:16px">

      <!-- PANEL DERECHO -->
      <div class="panel-right">
        <div class="panel-header">${t('op.panel_title')}</div>

        </div>
        <div class="info-row">
          <span class="info-key">${t('op.lbl_box')}</span>
          <span class="info-val font-mono">${escHTML(tk.caja_id)}</span>
        </div>
        <div class="info-row">
          <span class="info-key">${t('op.lbl_declared')}</span>
          <span class="info-val">${formatNum(tk.cantidad_declarada)}</span>
        </div>
        <div class="info-row">
          <span class="info-key">${t('op.g0_processed')}</span>
          <span class="info-val" style="color:var(--accent-cyan)">${state.g0piezas.length}</span>
        </div>
        ${(() => {
          const totalEsperado = state.g0ordenitems.reduce((s, i) => s + (i.quantity || 1), 0);
          if (totalEsperado === 0) return '';

          // Per-item scan count (by barcode match, then sku fallback)
          const scanCountByBarcode = {};
          const scanCountBySku = {};
          for (const p of state.g0piezas) {
            if (p.barcode) scanCountByBarcode[p.barcode] = (scanCountByBarcode[p.barcode] || 0) + 1;
            if (p.sku)     scanCountBySku[p.sku]         = (scanCountBySku[p.sku]         || 0) + 1;
          }
          const scannedOrdenBarcodes = new Set(state.g0ordenitems.map(i => i.barcode).filter(Boolean));
          const scannedOrdenSkus     = new Set(state.g0ordenitems.map(i => i.sku).filter(Boolean));

          let totalEscaneoEnOrden = 0;
          for (const item of state.g0ordenitems) {
            const cnt = item.barcode ? (scanCountByBarcode[item.barcode] || 0)
                                     : (scanCountBySku[item.sku] || 0);
            totalEscaneoEnOrden += cnt;
          }

          // Extra = piezas escaneadas que NO pertenecen a la orden de este tracking
          const extrasNoEnOrden = state.g0piezas.filter(p =>
            !(p.barcode && scannedOrdenBarcodes.has(p.barcode)) &&
            !(p.sku     && scannedOrdenSkus.has(p.sku))
          ).length;

          // Per-item: faltantes (expected > scanned) y sobrantes (scanned > expected)
          let piezasFaltantes = 0;
          let piezasSobrantes = 0;
          for (const item of state.g0ordenitems) {
            const esperado = item.quantity || 1;
            const cnt = item.barcode ? (scanCountByBarcode[item.barcode] || 0)
                                     : (scanCountBySku[item.sku] || 0);
            if (cnt < esperado) piezasFaltantes += esperado - cnt;
            if (cnt > esperado) piezasSobrantes += cnt - esperado;
          }
          piezasSobrantes += extrasNoEnOrden;

          const totalScaneado = state.g0piezas.length;
          const pct = Math.min(100, Math.round(totalEscaneoEnOrden / totalEsperado * 100));
          const exacto = piezasFaltantes === 0 && piezasSobrantes === 0;
          const barColor = exacto ? 'var(--accent-green)' : pct > 0 ? 'var(--accent-cyan)' : 'var(--border)';

          return `
            <div style="padding:10px 16px;border-top:1px solid var(--border-subtle)">
              <div style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;margin-bottom:8px">BALANCE DE ORDEN</div>
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
                <span style="color:var(--text-muted)">Esperado</span>
                <span style="font-family:'IBM Plex Mono',monospace;color:var(--text-primary)">${totalEsperado}</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
                <span style="color:var(--text-muted)">Escaneado</span>
                <span style="font-family:'IBM Plex Mono',monospace;color:var(--accent-cyan)">${totalScaneado}</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
                <span style="color:var(--text-muted)">Faltante</span>
                <span style="font-family:'IBM Plex Mono',monospace;color:${piezasFaltantes > 0 ? 'var(--accent-amber)' : 'var(--accent-green)'}">
                  ${piezasFaltantes > 0 ? '-' : ''}${piezasFaltantes}
                </span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">
                <span style="color:var(--text-muted)">De más</span>
                <span style="font-family:'IBM Plex Mono',monospace;color:${piezasSobrantes > 0 ? '#f87171' : 'var(--accent-green)'}">
                  ${piezasSobrantes > 0 ? '+' : ''}${piezasSobrantes}
                </span>
              </div>
              <div style="height:6px;background:var(--bg-elevated);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px;transition:width .3s"></div>
              </div>
              <div style="text-align:right;font-size:10px;color:var(--text-muted);margin-top:3px">${pct}%</div>
              ${piezasSobrantes > 0 ? `<div style="margin-top:6px;font-size:10px;color:#f87171;font-weight:600">⚠ ${piezasSobrantes} pieza(s) fuera de orden</div>` : ''}
              ${exacto ? `<div style="margin-top:6px;font-size:10px;color:var(--accent-green);font-weight:600">✓ Orden completa</div>` : ''}
            </div>
          `;
        })()}
        <div class="info-row">
          <span class="info-key">${t('op.lbl_state')}</span>
          <span>
            <span class="badge ${tk.estatus === 'cerrado' ? 'badge-green' : tk.estatus === 'refunded' ? 'badge-blue' : 'badge-amber'}">
              ${tk.estatus === 'cerrado' ? t('status.closed') : tk.estatus === 'refunded' ? t('status.refunded') : t('status.open')}
            </span>
          </span>
        </div>
        <div style="padding:12px 16px;display:flex;flex-direction:column;gap:8px">
          ${!isClosed ? `
            <button class="btn btn-primary w-full" onclick="cerrarTracking()" style="justify-content:center">
              ${t('op.btn_close_tracking')}
            </button>
            <button class="btn btn-secondary w-full" onclick="abrirDiscrepancia()" style="justify-content:center">
              ${t('op.btn_discrepancy')}
            </button>
          ` : `
            <button class="btn btn-secondary w-full" onclick="window.location='reportes.html?tracking=${tk.id}'" style="justify-content:center">
              ${t('op.btn_manifest_short')}
            </button>
          `}
          <button class="btn btn-ghost w-full mt-8" onclick="window.location='trackings.html'" style="justify-content:center">
            ${t('op.btn_back')}
          </button>
        </div>
      </div>
    </div>
  `;

  el.classList.remove('hidden');
  setTimeout(() => document.getElementById('g0-scan-input')?.focus(), 100);
  if (state.tracking?.id) initChat(state.tracking.id);
}

let _g0TrackingItems = [];

function seleccionarG0Item(idx) {
  const item = _g0TrackingItems[idx];
  if (!item) return;
  _g0CurrentItem = item;
  _g0Condicion = 'Buena';
  _g0PaisCoincide = true; _g0PaisReal = '';
  _g0InsumosCoincide = true; _g0InsumosReal = '';
  const resultEl = document.getElementById('g0-item-result');
  resultEl.innerHTML = renderG0SingleItem(item);
}

async function buscarG0Item() {
  const input = document.getElementById('g0-scan-input');
  const codigo = input?.value.trim();
  if (!codigo) return;

  const resultEl = document.getElementById('g0-item-result');
  resultEl.innerHTML = '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Buscando...</div>';

  try {
    const result = await API.get(`/ordenes/buscar-tracking?codigo=${encodeURIComponent(codigo)}&cliente_id=${state.tracking.cliente_id}`);

    if (!result) {
      resultEl.innerHTML = `<div class="alert alert-error" style="margin:0">⚠ ${t('op.g0_not_found')}</div>`;
      _g0CurrentItem = null;
      _g0TrackingItems = [];
      return;
    }

    if (result.type === 'single') {
      _g0CurrentItem = result.item;
      _g0TrackingItems = [];
      _g0Condicion = 'Buena';
      _g0PaisCoincide = true; _g0PaisReal = '';
      _g0InsumosCoincide = true; _g0InsumosReal = '';
      resultEl.innerHTML = renderG0SingleItem(result.item);
    } else {
      _g0TrackingItems = result.items;
      _g0CurrentItem = null;
      resultEl.innerHTML = renderG0TrackingItems(result.items);
    }

    input.value = '';
    input.focus();
  } catch(e) {
    resultEl.innerHTML = `<div class="alert alert-error" style="margin:0">Error: ${e.error || 'No se pudo buscar'}</div>`;
    _g0CurrentItem = null;
    _g0TrackingItems = [];
  }
}

function setG0Condicion(val) {
  _g0Condicion = val;
  const map = { 'Buena': 'g0-cond-buena', 'Dañada': 'g0-cond-danada', 'Sin caja': 'g0-cond-sin-caja' };
  Object.entries(map).forEach(([k, id]) => {
    const btn = document.getElementById(id);
    if (btn) btn.className = k === val ? 'btn btn-secondary btn-sm' : 'btn btn-ghost btn-sm';
  });
}

async function registrarG0Pieza() {
  if (!_g0CurrentItem) return;
  const needsCondicion = parseInt(state.tracking.validacion_condicion) === 1;
  // Collect pais real from manual input if applicable
  const paisReal = needsCondicion && !_g0PaisCoincide
    ? (document.getElementById('g0-pais-real-manual')?.style.display !== 'none'
        ? document.getElementById('g0-pais-real-manual')?.value.trim()
        : document.getElementById('g0-pais-real-select')?.value || '')
    : '';
  const insumosReal = needsCondicion && !_g0InsumosCoincide
    ? (document.getElementById('g0-insumos-real')?.value.trim() || '')
    : '';
  try {
    await API.post(`/trackings/${state.tracking.id}/g0-piezas`, {
      orden_item_id: _g0CurrentItem.id,
      sku: _g0CurrentItem.sku,
      product_title: _g0CurrentItem.product_title,
      order_number: _g0CurrentItem.order_number,
      barcode: _g0CurrentItem.barcode,
      condicion: _g0Condicion,
      pais_coincide: !needsCondicion || _g0PaisCoincide,
      pais_real: paisReal || null,
      insumos_coincide: !needsCondicion || _g0InsumosCoincide,
      insumos_real: insumosReal || null,
    });
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    state.g0piezas = await API.get(`/trackings/${state.tracking.id}/g0-piezas`);
    _g0CurrentItem = null;
    toast('Pieza registrada ✓');
    renderG0Inspeccion();
  } catch(e) {
    toast(e.error || 'Error al registrar', 'error');
  }
}

async function eliminarG0Pieza(id) {
  const ok = await confirm('¿Eliminar esta pieza del registro?', 'Confirmar');
  if (!ok) return;
  try {
    await API.del(`/trackings/${state.tracking.id}/g0-piezas/${id}`);
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    state.g0piezas = await API.get(`/trackings/${state.tracking.id}/g0-piezas`);
    renderG0Inspeccion();
  } catch(e) {
    toast(e.error || 'Error al eliminar', 'error');
  }
}

  const isRefunded = tk.estatus === 'refunded';
  const isClosed = tk.estatus === 'cerrado' || isRefunded;

  let muestreoTarget = 0;
  if (grado === 2) {
    muestreoTarget = Math.ceil(tk.cantidad_declarada * (tk.porcentaje_muestreo / 100));
  } else if (grado === 3) {

  const totalInspeccionado = state.detalles.reduce((s, d) => s + (d.cantidad || 1), 0);

            <button class="btn btn-primary btn-sm" onclick="sendComentario()" style="flex-shrink:0;gap:6px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Enviar
            </button>
          </div>
          ` : ''}
          ${['ADMIN','SUPERVISOR'].includes(_pageUser?.rol) ? `
          <div style="padding:6px 16px 10px;border-top:1px solid var(--border)">
            <button id="historial-correos-link" onclick="toggleHistorialCorreos()" style="background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;padding:0;font-family:'IBM Plex Mono',monospace">▾ Ver historial de correos enviados (0)</button>
            <div id="historial-correos-section" style="display:none;margin-top:8px"></div>
          </div>
          ` : ''}
        </div>
      </div>

      <!-- PANEL DERECHO -->
      <div class="panel-right">
        <div class="panel-header">${t('op.panel_title')}</div>

        <div class="info-row">
          <span class="info-key">Tracking #</span>
          <span class="info-val" style="color:var(--accent-cyan)">${tk.tracking_number}</span>
        </div>
        <div class="info-row">
          <span class="info-key">${t('op.lbl_box')}</span>
          <span class="info-val">
            ${tk.caja_id

        </div>
        <div class="info-row">
          <span class="info-key">${t('label.grade')}</span>
          <span>${gradoBadge(grado)}</span>
        </div>
        <div class="info-row">
          <span class="info-key">${t('op.lbl_declared')}</span>

        <div class="info-row">
          <span class="info-key">${t('op.lbl_counted')}</span>
          <span class="info-val" style="color:${discrepancia?'var(--accent-amber)':'var(--accent-green)'}">${formatNum(tk.cantidad_final)}</span>
        </div>

        ${grado > 1 ? `
          <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
            <div class="info-key" style="margin-bottom:6px">${t('op.lbl_progress')}</div>
            <div class="flex justify-between" style="margin-bottom:4px">
              <span class="font-mono" style="font-size:11px">${formatNum(totalInspeccionado)} / ${grado===3?formatNum(tk.cantidad_declarada):'~'+formatNum(muestreoTarget)}</span>
              <span class="font-mono" style="font-size:11px;color:var(--accent-green)">${pctAvance}%</span>

            <div class="progress-bar">
              <div class="progress-fill" style="width:${pctAvance}%"></div>

        <div class="info-row">
          <span class="info-key">${t('op.lbl_skus')}</span>
          <span class="info-val">${state.detalles.length}</span>
        </div>
        <div class="info-row">
          <span class="info-key">${t('op.lbl_errors')}</span>
          <span class="info-val" style="color:${erroresCount>0?'var(--accent-red)':'inherit'}">${erroresCount}</span>
        </div>
        <div class="info-row">
          <span class="info-key">${t('op.lbl_type')}</span>
          <span class="badge ${tipoBadgeClass}" style="font-size:10px;font-family:'IBM Plex Mono',monospace">${tipoContenido}</span>

        ${isRefunded && tk.nota_credito ? `
        <div class="info-row">
          <span class="info-key">${t('op.lbl_credit_note')}</span>
          <span class="info-val" style="color:var(--accent-cyan);font-size:11px">${tk.nota_credito}</span>

        ${!isClosed ? `
          <div style="padding:12px 16px">
            <button class="btn btn-primary w-full" onclick="cerrarTracking()" style="justify-content:center">
              ${t('op.btn_close_tracking')}
            </button>
            <button class="btn btn-secondary w-full mt-8" onclick="abrirDiscrepancia()" style="justify-content:center">
              ${t('op.btn_discrepancy')}
            </button>
          </div>
        ` : `
          <div style="padding:12px 16px;display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-secondary w-full" onclick="window.location='reportes.html?tracking=${tk.id}'" style="justify-content:center">
              ${t('op.btn_manifest_short')}
            </button>
            ${_soloLectura && !isRefunded ? `
              <button class="btn btn-primary w-full" onclick="marcarRefunded()" style="justify-content:center;background:var(--accent-blue,#2563eb);border-color:var(--accent-blue,#2563eb)">
                ${t('op.btn_refunded')}
              </button>

            ${_soloLectura && isRefunded && parseInt(tk.requiere_nota_credito) && !tk.nota_credito ? `
              <button class="btn btn-secondary w-full" onclick="capturarNotaCredito()" style="justify-content:center">
                ${t('op.btn_credit_note')}
              </button>
            ` : ''}
          </div>
        `}
      </div>
    </div>

  el.classList.remove('hidden');

  // Auto focus scan input
  setTimeout(() => document.getElementById('scan-input')?.focus(), 100);

  // Iniciar chat solo la primera vez o cuando cambia el tracking
  if (state.tracking?.id) initChat(state.tracking.id);
}

function renderErroresGenerales() {
  const generales = state.errores.filter(e => !e.detalle_sku_id && e.path_fotografia);
  if (!generales.length) return '';

  window._fotoGrupos = window._fotoGrupos || {};
  window._fotoGrupos['_err_gral'] = generales.map(e => ({
    src: e.path_fotografia,
    titulo: `${e.tipo_error}${e.comentarios ? ' — ' + e.comentarios : ''}`
  }));

  return `
    <div style="margin-top:16px">
      <div class="section-title">Evidencia — Errores Generales</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
        ${generales.map(e => `
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:76px">
            <img src="${e.path_fotografia}" class="foto-thumb"
              title="${e.tipo_error}${e.comentarios ? ' — ' + e.comentarios : ''} — clic para ampliar"
              onclick="verFoto('${e.path_fotografia}','','_err_gral')"
              style="height:64px;width:76px;object-fit:cover;border-radius:6px;border:1.5px solid rgba(220,38,38,.5);display:block">
            <div style="font-size:10px;color:var(--accent-red);font-weight:700;font-family:'IBM Plex Mono',monospace;text-align:center;line-height:1.2;width:100%;word-break:break-word">
              ${e.tipo_error}
            </div>
            ${e.comentarios ? `<div style="font-size:9px;color:var(--text-muted);text-align:center;line-height:1.3;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${e.comentarios}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderSKUList() {
  if (state.detalles.length === 0) return `
    <div class="empty-state" style="padding:32px">
      <div class="empty-state-icon">🔍</div>
      <div class="empty-state-title">Sin SKUs registrados aún</div>
      <div class="empty-state-text">Escanea el primer producto para comenzar la inspección</div>
    </div>
  `;

  window._fotoGrupos = window._fotoGrupos || {};

  return state.detalles.map(d => {
    const errD = state.errores.filter(e => e.detalle_sku_id === d.id);
    const hasError = errD.length > 0;
    const isMalo = d.calidad === 'Mala';
    const paisDiff = !d.pais_coincide;
    const insDiff = !d.insumos_coincide;
    const tieneRetrabajo = state.retrabajos.some(r => r.detalle_sku_id === d.id);

    // Build photo group for this detalle (for lightbox navigation)
    const grupo = [];
    if (d.foto_etiqueta) grupo.push({ src: d.foto_etiqueta, titulo: 'Etiqueta del producto' });
    if (d.foto_insumos)  grupo.push({ src: d.foto_insumos,  titulo: 'Insumos / País de origen' });
    if (d.foto_pieza)    grupo.push({ src: d.foto_pieza,    titulo: 'Pieza completa' });
    [1,2,3,4].forEach(n => { if (d[`foto_adicional_${n}`]) grupo.push({ src: d[`foto_adicional_${n}`], titulo: `Foto adicional ${n}` }); });
    errD.forEach(err => {
      if (err.path_fotografia) grupo.push({ src: err.path_fotografia, titulo: `⚠ ${err.tipo_error}${err.comentarios ? ' — ' + err.comentarios : ''}` });
    });
    if (grupo.length) window._fotoGrupos[d.id] = grupo;

    const thumbStyle = 'height:40px;width:40px;object-fit:cover;border-radius:4px;border:1px solid var(--border)';
    const thumbAdicStyle = 'height:40px;width:40px;object-fit:cover;border-radius:4px;border:1px solid rgba(68,138,255,.4)';

    return `
      <div class="sku-list-item ${hasError ? 'has-error' : ''}">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span class="sku-code">${d.sku_code}</span>
            <span class="sku-meta">${d.descripcion || ''}</span>
          </div>
          <div class="sku-badges">
            <span class="badge badge-muted">×${d.cantidad}</span>
            ${tieneRetrabajo ? `<span class="badge badge-amber" style="font-weight:700">🔧 Retrabajada</span>` : ''}
            ${d.es_nuevo ? `<span class="badge badge-amber" style="font-weight:700;letter-spacing:.04em">NUEVO</span>` : ''}
            ${d.foto_etiqueta ? `<span class="badge badge-blue">📷 Evidencia (3 fotos)</span>` : ''}
            ${d.foto_adicional_1 ? `<span class="badge badge-blue">📷 +${[1,2,3,4].filter(n=>d[`foto_adicional_${n}`]).length} adicional(es)</span>` : ''}
            ${d.pais_origen_real ? `<span class="badge ${paisDiff?'badge-amber':'badge-muted'}">🌍 ${d.pais_origen_real}${paisDiff?' ⚠':''}</span>` : ''}
            ${d.calidad ? `<span class="badge ${isMalo?'badge-red':'badge-green'}">${isMalo?'✕ Mala':'✓ Buena'}</span>` : ''}
            ${paisDiff ? `<span class="badge badge-amber">País no coincide</span>` : ''}
            ${insDiff ? `<span class="badge badge-amber">Insumos no coinciden</span>` : ''}
            ${hasError ? `<span class="badge badge-red">⚠ ${errD.length} error(es)</span>` : ''}
          </div>
          ${d.foto_etiqueta ? `
            <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
              <img src="${d.foto_etiqueta}" title="Etiqueta — clic para ampliar" class="foto-thumb" onclick="verFoto('${d.foto_etiqueta}','Etiqueta del producto','${d.id}')" style="${thumbStyle}">
              <img src="${d.foto_insumos}"  title="Insumos/Origen — clic para ampliar" class="foto-thumb" onclick="verFoto('${d.foto_insumos}','Insumos / País de origen','${d.id}')" style="${thumbStyle}">
              <img src="${d.foto_pieza}"    title="Pieza completa — clic para ampliar" class="foto-thumb" onclick="verFoto('${d.foto_pieza}','Pieza completa','${d.id}')" style="${thumbStyle}">

async function buscarSKU(code) {
  if (!code.trim()) return;
  state.skuActual = null;
  state.skuNoRegistrado = false;

  const clienteId = state.tracking.cliente_id;
  try {
    const sku = await API.get(`/skus/buscar/${encodeURIComponent(code.trim().toUpperCase())}?cliente_id=${clienteId}`);
    state.skuActual = sku;
    state.skuNoRegistrado = !sku;

    document.getElementById('f-sku-code').value = sku ? sku.sku_code : code.trim().toUpperCase();
    document.getElementById('f-sku-desc').value = sku?.descripcion || '';
    const elPais = document.getElementById('f-pais-catalogo');
    if (elPais) elPais.textContent = sku?.pais_origen || '—';
    const elInsumos = document.getElementById('f-insumos-catalogo');
    if (elInsumos) elInsumos.textContent = sku?.insumos || '—';
    document.getElementById('f-cantidad').value = 1;

    // Reset verificaciones
    if (document.getElementById('btn-pais-ok')) setPaisCoincide(true);
    if (document.getElementById('btn-insumos-ok')) setInsumosCoincide(true);
    if (document.getElementById('btn-calidad-good')) setCalidad('Buena');

    // Mostrar sección correcta según si el SKU está registrado o no
    const secVerif = document.getElementById('seccion-verificacion');
    const secNR = document.getElementById('seccion-no-registrado');
    const filaDatos = document.getElementById('fila-datos-sku');
    if (filaDatos) filaDatos.classList.toggle('hidden', !sku);
    if (secVerif) secVerif.classList.toggle('hidden', !sku);
    if (secNR) {
      secNR.classList.toggle('hidden', !!sku);
      if (!sku) {
        // Pre-llenar UPC con el código escaneado, limpiar SKU para entrada manual
        const nrUpc = document.getElementById('nr-upc');
        const nrSku = document.getElementById('nr-sku');
        if (nrUpc) nrUpc.value = code.trim();
        if (nrSku) { nrSku.value = ''; setTimeout(() => nrSku.focus(), 50); }
        document.getElementById('nr-desc').value = '';
        document.getElementById('nr-pais-select').value = '';
        document.getElementById('nr-insumos').value = '';
        const manual = document.getElementById('nr-pais-manual');
        if (manual) { manual.value = ''; manual.style.display = 'none'; }
        // Limpiar previews y estado QR de fotos de evidencia
        limpiarTodasFotosEvidenciaQR();
        ['prev-etiqueta','prev-insumos','prev-pieza'].forEach(id => {
          const img = document.getElementById(id);
          if (img) { img.src = ''; img.classList.add('hidden'); }
        });
        ['foto-etiqueta-req','foto-insumos-req','foto-pieza-req'].forEach(id => {
          const inp = document.getElementById(id);
          if (inp) inp.value = '';
        });
        // Resetear botones de modo a "local"
        ['etiqueta','insumos','pieza'].forEach(slot => {
          document.getElementById(`fev-btn-local-${slot}`)?.classList.add('active');
          document.getElementById(`fev-btn-qr-${slot}`)?.classList.remove('active');
          document.getElementById(`fev-local-${slot}`)?.classList.remove('hidden');
          document.getElementById(`fev-qr-${slot}`)?.classList.add('hidden');
        });
      }
    }

    document.getElementById('sku-form').classList.remove('hidden');
    document.getElementById('f-sku-code').focus();
  } catch(e) {
    toast('Error buscando SKU', 'error');
  }
}

function cancelarSKU() {
  state.skuNoRegistrado = false;

  limpiarTodasFotosAdicionalesQR();

  document.getElementById('sku-form').classList.add('hidden');

}

let fotosAdicionalesQR = {}; // { [idx]: { mode, token, url, url_foto, pollInterval, countdownInterval, expiresMs } }

function setFotoAdicionalMode(idx, mode) {
  if (!fotosAdicionalesQR[idx]) fotosAdicionalesQR[idx] = {};
  fotosAdicionalesQR[idx].mode = mode;
  document.getElementById(`fa-btn-local-${idx}`)?.classList.toggle('active', mode === 'local');
  document.getElementById(`fa-btn-qr-${idx}`)?.classList.toggle('active', mode === 'qr');
  document.getElementById(`fa-local-${idx}`)?.classList.toggle('hidden', mode !== 'local');
  document.getElementById(`fa-qr-${idx}`)?.classList.toggle('hidden', mode !== 'qr');
  if (mode === 'local') limpiarQRFotoAdicional(idx);
}

async function iniciarQRFotoAdicional(idx) {
  limpiarQRFotoAdicional(idx);
  if (!fotosAdicionalesQR[idx]) fotosAdicionalesQR[idx] = {};

  document.getElementById(`fa-qr-idle-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-qr-activo-${idx}`)?.classList.remove('hidden');
  document.getElementById(`fa-qr-recibida-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-btn-nuevo-qr-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-qr-spinner-${idx}`)?.classList.remove('hidden');

  const qrDiv = document.getElementById(`fa-qr-div-${idx}`);
  if (qrDiv) qrDiv.innerHTML = '';

  try {
    const sesion = await API.post('/foto-sesion', {
      tracking_id: state.tracking?.id || null,
      contexto: `foto-adicional-${idx}`,
    });
    const s = fotosAdicionalesQR[idx];
    s.token = sesion.token;
    s.url = sesion.url;

    if (qrDiv) {
      const qr = new QRCode(qrDiv, {
        text: sesion.url,
        width: 160,
        height: 160,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
      // Make QR responsive inside narrow card
      setTimeout(() => {
        const c = qrDiv.querySelector('canvas');
        if (c) { c.style.width = '100%'; c.style.height = 'auto'; }
        const img = qrDiv.querySelector('img');
        if (img) { img.style.width = '100%'; img.style.height = 'auto'; }
      }, 50);
    }

    s.expiresMs = Date.now() + 10 * 60 * 1000;
    tickCountdownFA(idx);
    s.countdownInterval = setInterval(() => tickCountdownFA(idx), 1000);
    s.pollInterval = setInterval(() => pollQRFA(idx), 2000);
  } catch(e) {
    if (qrDiv) qrDiv.innerHTML = '<div style="color:var(--accent-red);font-size:10px;padding:8px">Error al generar</div>';
    document.getElementById(`fa-btn-nuevo-qr-${idx}`)?.classList.remove('hidden');
    document.getElementById(`fa-qr-spinner-${idx}`)?.classList.add('hidden');
  }
}

function tickCountdownFA(idx) {
  const s = fotosAdicionalesQR[idx];
  if (!s) return;
  const remaining = Math.max(0, s.expiresMs - Date.now());
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  const el = document.getElementById(`fa-qr-cd-${idx}`);
  if (el) {
    el.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
    el.style.color = remaining < 120000 ? 'var(--accent-red)' : '';
  }
  if (remaining === 0) {
    clearInterval(s.countdownInterval);
    clearInterval(s.pollInterval);
    document.getElementById(`fa-qr-spinner-${idx}`)?.classList.add('hidden');
    document.getElementById(`fa-btn-nuevo-qr-${idx}`)?.classList.remove('hidden');
  }
}

async function pollQRFA(idx) {
  const s = fotosAdicionalesQR[idx];
  if (!s?.token) return;
  try {
    const data = await API.get(`/foto-sesion/${s.token}`);
    if (data.estatus === 'completada' && data.url_foto) {
      clearInterval(s.pollInterval);
      clearInterval(s.countdownInterval);
      s.url_foto = data.url_foto;
      document.getElementById(`fa-qr-activo-${idx}`)?.classList.add('hidden');
      document.getElementById(`fa-qr-recibida-${idx}`)?.classList.remove('hidden');
      const img = document.getElementById(`fa-qr-preview-${idx}`);
      if (img) img.src = data.url_foto;
    }
  } catch(e) {}
}

function limpiarQRFotoAdicional(idx) {
  const s = fotosAdicionalesQR[idx];
  if (!s) return;
  clearInterval(s.pollInterval);
  clearInterval(s.countdownInterval);
  s.pollInterval = null;
  s.countdownInterval = null;
}

function resetQRFotoAdicional(idx) {
  limpiarQRFotoAdicional(idx);
  if (fotosAdicionalesQR[idx]) {
    fotosAdicionalesQR[idx].token = null;
    fotosAdicionalesQR[idx].url_foto = null;
  }
  document.getElementById(`fa-qr-activo-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-qr-recibida-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-qr-idle-${idx}`)?.classList.remove('hidden');
}

function limpiarTodasFotosAdicionalesQR() {
  Object.keys(fotosAdicionalesQR).forEach(idx => limpiarQRFotoAdicional(Number(idx)));
  fotosAdicionalesQR = {};
}
