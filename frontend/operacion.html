<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operación — Sistema Logístico</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .fase-indicator {
      display:flex;gap:0;margin-bottom:24px;
      border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;
    }
    .fase {
      flex:1;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;
      font-weight:700;letter-spacing:0.06em;text-align:center;
      background:var(--bg-elevated);color:var(--text-muted);
      border-right:1px solid var(--border);transition:all .2s;
    }
    .fase:last-child{border-right:none;}
    .fase.active{background:rgba(0,230,118,.1);color:var(--accent-green);}
    .fase.done{background:rgba(0,230,118,.05);color:var(--accent-green-dim);}
    .fase-num{display:block;font-size:9px;color:inherit;opacity:.7;margin-bottom:2px;}

    .sku-list-item{
      background:var(--bg-elevated);border:1px solid var(--border);
      border-radius:var(--radius-sm);padding:12px 14px;
      display:flex;align-items:center;gap:12px;
      animation:slideIn .2s ease;
    }
    @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

    .sku-list-item.has-error{border-color:rgba(255,61,61,.3);}
    .sku-code{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--accent-cyan);}
    .sku-meta{font-size:11px;color:var(--text-muted);}
    .sku-badges{display:flex;gap:4px;flex-wrap:wrap;}

    .foto-modo-btn{
      flex:1;padding:8px 12px;background:var(--bg-elevated);color:var(--text-muted);
      border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;
      border-right:1px solid var(--border);
    }
    .foto-modo-btn:last-child{border-right:none;}
    .foto-modo-btn.active{background:var(--bg-card);color:var(--text-primary);}

    .panel-right{
      background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);
      position:sticky;top:76px;height:fit-content;
    }
    .panel-header{
      padding:14px 16px;border-bottom:1px solid var(--border);
      font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
      letter-spacing:.08em;color:var(--text-secondary);text-transform:uppercase;
    }
    .info-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:8px 16px;border-bottom:1px solid var(--border);
    }
    .info-row:last-child{border-bottom:none;}
    .info-key{font-size:11px;color:var(--text-muted);}
    .info-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--text-primary);}
  </style>
</head>
<body>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>

document.getElementById('page-content').innerHTML = `
  <div id="fase-inicio" class="hidden">
    <!-- Fase 1: Inicio de tracking -->
  </div>
  <div id="fase-inspeccion" class="hidden">
    <!-- Fase 2: Inspección SKUs -->
  </div>
  <div id="loading-state" style="text-align:center;padding:80px">
    <div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto"></div>
    <div style="margin-top:16px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;font-size:12px">CARGANDO...</div>

// Modal Editar Detalle SKU
document.body.insertAdjacentHTML('beforeend', `
  <div id="modal-editar-detalle" class="modal-overlay">
    <div class="modal" style="max-width:540px">
      <div class="modal-header">
        <span class="modal-title">✏️ Editar SKU registrado</span>
        <button class="modal-close" onclick="closeModal('modal-editar-detalle')">×</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:14px">
        <input type="hidden" id="ed-id">
        <input type="hidden" id="ed-tracking-id">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">SKU</label>
            <input class="form-control form-control-mono" id="ed-sku" readonly style="opacity:.6">
          </div>
          <div class="form-group">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control form-control-mono" id="ed-cantidad" min="1" style="width:80px">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Descripción</label>
          <input class="form-control" id="ed-desc" placeholder="Nombre / descripción del producto">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">País de Origen</label>
            <select class="form-control" id="ed-pais-select" onchange="onEdPaisSelect(this.value)">
              ${COUNTRY_OPTIONS}
            </select>
            <input type="text" class="form-control mt-8" id="ed-pais-manual" placeholder="Enter country name..." style="display:none">
          </div>
          <div class="form-group">
            <label class="form-label">Insumos / Composición</label>
            <input class="form-control" id="ed-insumos" placeholder="Ej: 100% Cotton">
          </div>
        </div>
        <div id="ed-calidad-section" class="form-group">
          <label class="form-label">Calidad</label>
          <select class="form-control" id="ed-calidad">
            <option value="Buena">✓ Buena</option>
            <option value="Mala">✕ Mala</option>
          </select>
        </div>
        <!-- Fotos de evidencia (dinámico) -->
        <div id="ed-fotos-section" class="hidden">
          <div class="section-title" style="margin-bottom:8px;font-size:10px">Fotografías de evidencia</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px" id="ed-fotos-grid"></div>
        </div>
        <!-- Retrabajos (dinámico, solo si modulo_retrabajo=1) -->
        <div id="ed-retrabajos-section" class="hidden">
          <div class="section-title" style="margin-bottom:8px;font-size:10px">Retrabajos</div>
          <div id="ed-retrabajos-lista"></div>
          <div id="ed-retrabajos-agregar" style="margin-top:8px"></div>

// Modal de Error/Evidencia
document.body.insertAdjacentHTML('beforeend', `
  <div id="modal-error" class="modal-overlay" onclick="if(event.target===this)cerrarModalError()">
    <div class="modal" style="max-width:500px">
      <div class="modal-header">
        <span class="modal-title">📸 Registrar Error / Evidencia</span>
        <button class="modal-close" onclick="cerrarModalError()">×</button>
      </div>
      <div class="modal-body">
        <div id="disposicion-danados" class="disposicion-banner">
          <span class="disposicion-icon">📦</span>
          <div>
            <div class="disposicion-text">COLOCAR EN CAJA DE DAÑADOS</div>
            <div class="disposicion-sub">Instrucción mandatoria — separar físicamente la pieza</div>
          </div>
        </div>
        <div id="disposicion-retrabajo" class="disposicion-banner hidden" style="background:rgba(255,171,0,0.08);border-color:#ffab00">
          <span class="disposicion-icon">🔧</span>
          <div>
            <div class="disposicion-text" style="color:#ffab00">ENVIAR A RETRABAJO</div>
            <div class="disposicion-sub">La pieza irá a la cola de corrección antes de continuar.</div>
          </div>
        </div>
        <div id="disposicion-discrepancia" class="disposicion-banner hidden" style="background:rgba(68,138,255,0.08);border-color:var(--accent-blue)">
          <span class="disposicion-icon">📋</span>
          <div>
            <div class="disposicion-text" style="color:var(--accent-blue)">MANTENER EN CAJA — DOCUMENTAR</div>
            <div class="disposicion-sub">La pieza no está dañada. Registrar discrepancia y continuar flujo.</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de Error *</label>
          <select class="form-control" id="error-tipo" onchange="onTipoErrorChange(this.value)">
            <option value="Calidad">Calidad — Pieza dañada / defectuosa</option>
            <option value="Origen">País de Origen — No coincide con catálogo</option>
            <option value="Insumo">Insumos / Material — No coincide con catálogo</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <!-- SECCIÓN RETRABAJOS (solo para clientes con módulo activo) -->
        <div id="seccion-retrabajos-modal" class="hidden">
          <div style="margin-bottom:8px;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase">Retrabajos requeridos</div>
          <div id="rt-botones" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
          <div id="rt-otro-input" class="hidden" style="margin-top:8px">
            <input type="text" class="form-control" id="rt-otro-texto" placeholder="Describe el retrabajo adicional...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Fotografía de Evidencia *</label>

          <!-- Selector de modo -->
          <div style="display:flex;gap:0;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden">
            <button id="btn-modo-local" class="foto-modo-btn active" onclick="setFotoMode('local')">📁 Subir archivo</button>
            <button id="btn-modo-qr" class="foto-modo-btn" onclick="setFotoMode('qr')">📱 Foto con teléfono</button>
          </div>

          <!-- Modo A: archivo local -->
          <div id="foto-modo-local">
            <div class="photo-upload" id="photo-drop-zone">
              <input type="file" id="error-foto" accept="image/*" capture="environment" onchange="previewFoto(this)">
              <div class="photo-upload-icon">📷</div>
              <div class="photo-upload-text">Toca para tomar foto o seleccionar imagen</div>
              <div class="photo-upload-hint">JPG, PNG — requerido para guardar</div>
            </div>
            <img id="foto-preview" class="photo-preview hidden" alt="Vista previa">
          </div>

          <!-- Modo B: QR móvil -->
          <div id="foto-modo-qr" class="hidden">
            <div id="qr-idle" style="text-align:center;padding:16px 0">
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5">
                Genera un QR y escanéalo con tu teléfono para tomar la foto con la cámara del móvil
              </div>
              <button class="btn btn-secondary" onclick="iniciarSesionQR()" style="justify-content:center;max-width:220px;margin:0 auto">
                📱 Generar QR
              </button>
            </div>

            <div id="qr-activo" class="hidden" style="text-align:center">
              <div id="qr-code-div" style="display:inline-block;background:#fff;padding:10px;border-radius:8px;margin-bottom:10px"></div>
              <div style="display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:4px">
                <span style="font-size:11px;color:var(--text-muted)">Expira en</span>
                <span id="qr-countdown" style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--text-secondary)">10:00</span>
              </div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">Esperando foto desde el teléfono…</div>
              <div class="spinner" id="qr-spinner" style="width:16px;height:16px;border-width:2px;margin:0 auto 8px"></div>
              <button class="btn btn-secondary btn-sm hidden" id="btn-nuevo-qr" onclick="iniciarSesionQR()" style="justify-content:center;margin:0 auto;max-width:180px">
                ↻ Generar nuevo QR
              </button>
            </div>

            <div id="qr-recibida" class="hidden" style="text-align:center">
              <div style="color:var(--accent-green);font-weight:700;font-size:13px;margin-bottom:8px">✅ Foto recibida desde el teléfono</div>
              <img id="foto-qr-preview" style="max-width:100%;border-radius:8px;max-height:180px;object-fit:cover;border:1px solid var(--border)" alt="Foto recibida">
              <div style="margin-top:8px">
                <button class="btn btn-secondary btn-sm" onclick="resetQRSesion()" style="justify-content:center;margin:0 auto;max-width:160px">
                  ↩ Cambiar foto
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Descripción del Error *</label>
          <textarea class="form-control" id="error-desc" rows="3" placeholder="Describe detalladamente el defecto o discrepancia encontrada..." style="resize:vertical"></textarea>
        </div>

        <input type="hidden" id="error-detalle-id">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModalError()">Cancelar</button>
        <button class="btn btn-danger" onclick="guardarError()">
          ⚠ Registrar Error
        </button>
      </div>
    </div>
  </div>

  <div id="modal-discrepancia" class="modal-overlay">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <span class="modal-title">⚠ Discrepancia de Inventario</span>
        <button class="modal-close" onclick="closeModal('modal-discrepancia')">×</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-warning">
          La cantidad física no coincide con la declarada en el Tracking. Registra la cantidad real para generar la alerta.
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Cantidad Declarada</label>
            <input type="number" class="form-control form-control-mono" id="disc-original" readonly style="opacity:.6">
          </div>
          <div class="form-group">
            <label class="form-label">Cantidad Real *</label>
            <input type="number" class="form-control form-control-mono" id="disc-corregida" placeholder="0" min="0">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Nota (opcional)</label>
          <input type="text" class="form-control" id="disc-nota" placeholder="Motivo de la discrepancia...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-discrepancia')">Cancelar</button>
        <button class="btn btn-amber" onclick="guardarDiscrepancia()">Registrar Discrepancia</button>
      </div>
    </div>
  </div>

  <div id="modal-cierre" class="modal-overlay">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <span class="modal-title">✓ Cerrar Tracking</span>
        <button class="modal-close" onclick="closeModal('modal-cierre')">×</button>
      </div>
      <div class="modal-body">
        <p style="margin:0 0 16px;color:var(--text-secondary);font-size:14px">
          Ingresa el número de identificación antes de cerrar. Una vez cerrado no se podrán agregar más SKUs.
        </p>
        <div class="form-group">
          <label class="form-label" id="cierre-caja-label">Número de Caja *</label>
          <input type="text" class="form-control form-control-mono" id="cierre-caja-input" placeholder="CAJA-001"
            onkeydown="if(event.key==='Enter') confirmarCierre()">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-cierre')">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmarCierre()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
          Confirmar Cierre
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Mercancía no pertenece a cliente -->
  <div id="modal-mercancia-ajena" class="modal-overlay">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <span class="modal-title">⛔ Mercancía no pertenece a cliente</span>
        <button class="modal-close" onclick="closeModal('modal-mercancia-ajena')">×</button>
      </div>
      <div class="modal-body">
        <div class="disposicion-banner" style="margin-bottom:16px">
          <span class="disposicion-icon">📦</span>
          <div>
            <div class="disposicion-text">COLOCAR EN CAJA DE DAÑADOS</div>
            <div class="disposicion-sub">Esta mercancía no corresponde al cliente — separar físicamente</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Fotografía de Evidencia *</label>

          <!-- Selector de modo -->
          <div style="display:flex;gap:0;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden">
            <button id="ma-btn-modo-local" class="foto-modo-btn active" onclick="setMaFotoMode('local')">📁 Subir archivo</button>
            <button id="ma-btn-modo-qr" class="foto-modo-btn" onclick="setMaFotoMode('qr')">📱 Foto con teléfono</button>
          </div>

          <!-- Modo A: archivo local -->
          <div id="ma-foto-modo-local">
            <div class="photo-upload">
              <input type="file" id="ma-foto" accept="image/*" capture="environment" onchange="previewMaFoto(this)">
              <div class="photo-upload-icon">📷</div>
              <div class="photo-upload-text">Toca para tomar foto de la mercancía</div>
              <div class="photo-upload-hint">JPG, PNG — requerida para continuar</div>
            </div>
            <img id="ma-foto-preview" class="photo-preview hidden" alt="Vista previa">
          </div>

          <!-- Modo B: QR móvil -->
          <div id="ma-foto-modo-qr" class="hidden">
            <div id="ma-qr-idle" style="text-align:center;padding:16px 0">
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5">
                Genera un QR y escanéalo con tu teléfono para tomar la foto con la cámara del móvil
              </div>
              <button class="btn btn-secondary" onclick="iniciarSesionQRMA()" style="justify-content:center;max-width:220px;margin:0 auto">
                📱 Generar QR
              </button>
            </div>

            <div id="ma-qr-activo" class="hidden" style="text-align:center">
              <div id="ma-qr-code-div" style="display:inline-block;background:#fff;padding:10px;border-radius:8px;margin-bottom:10px"></div>
              <div style="display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:4px">
                <span style="font-size:11px;color:var(--text-muted)">Expira en</span>
                <span id="ma-qr-countdown" style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--text-secondary)">10:00</span>
              </div>

let state = {

  tracking: null,
  cliente: null,
  detalles: [],
  errores: [],
  retrabajos: [],
  skuActual: null,
  paisCoincide: true,

  calidadActual: 'Buena',
  pendingReset: false, // true mientras el modal de error está abierto tras registrar un SKU
};

// Check URL for existing tracking
const params = new URLSearchParams(window.location.search);
const trackingIdParam = params.get('id');

async function init() {
  if (trackingIdParam) {
    try {
      const tracking = await API.get(`/trackings/${trackingIdParam}`);
      state.tracking = tracking;
      state.cliente = tracking;
      const [detalles, errores, retrabajos] = await Promise.all([
        API.get(`/trackings/${trackingIdParam}/detalles`),
        API.get(`/trackings/${trackingIdParam}/errores`),
        API.get(`/trackings/${trackingIdParam}/retrabajos`)
      ]);
      state.detalles = detalles;
      state.errores = errores;
      state.retrabajos = retrabajos;
      state.fase = 'inspeccion';
      renderInspeccion();
    } catch(e) {
      renderInicio();
    }
  } else {
    renderInicio();
  }
}

function onClienteChange(sel) {
  const opt = sel.selectedOptions[0];
  const preview = document.getElementById('cliente-config-preview');
  const badges = document.getElementById('cliente-badges');

  const secOrden = document.getElementById('seccion-numero-orden');
  const secRetorno = document.getElementById('seccion-tipo-retorno');
  const secRazon = document.getElementById('seccion-razon-retorno');

  if (!opt.value) {
    preview.classList.add('hidden');
    secOrden?.classList.add('hidden');
    secRetorno?.classList.add('hidden');
    secRazon?.classList.add('hidden');
    return;
  }

  const grado = parseInt(opt.dataset.grado);
  const info = GRADO_INFO[grado];
  const calidad = opt.dataset.calidad === '1';
  const retrabajo = opt.dataset.retrabajo === '1';
  const pct = opt.dataset.pct;
  const almacenamiento = opt.dataset.almacenamiento || 'caja';
  const esPallet = almacenamiento === 'pallet';
  const requiereOrden = opt.dataset.requiereOrden === '1';
  const requiereTipoRetorno = opt.dataset.requiereTipoRetorno === '1';

  badges.innerHTML = `
    <span class="grado-badge ${info.class}">${info.label}</span>
    ${calidad ? '<span class="badge badge-blue">✓ Calidad</span>' : ''}
    ${retrabajo ? '<span class="badge badge-amber">✓ Retrabajos</span>' : ''}
    ${grado === 2 ? `<span class="badge badge-muted">Muestreo ${pct}%</span>` : ''}
    <span class="badge badge-muted">${esPallet ? '⬛ Pallet' : '📦 Caja'}</span>
    ${requiereOrden ? '<span class="badge badge-green"># Orden</span>' : ''}
    ${requiereTipoRetorno ? '<span class="badge badge-amber">RMA/RTS</span>' : ''}
  `;
  preview.classList.remove('hidden');

  if (secOrden) secOrden.classList.toggle('hidden', !requiereOrden);
  if (secRetorno) {
    secRetorno.classList.toggle('hidden', !requiereTipoRetorno);
    if (!requiereTipoRetorno && secRazon) secRazon.classList.add('hidden');
    // Reset radio on client change
    if (requiereTipoRetorno) {
      document.querySelectorAll('input[name="ini-tipo-retorno"]').forEach(r => r.checked = false);
      onTipoRetornoChange(null);
    }
  }
}

function onTipoRetornoChange(tipo) {
  const secRazon = document.getElementById('seccion-razon-retorno');
  const btnRma = document.getElementById('btn-tipo-rma');
  const btnRts = document.getElementById('btn-tipo-rts');
  const esRts = tipo === 'RTS';
  const esRma = tipo === 'RMA';

  if (btnRma) btnRma.style.cssText = `display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;border:${esRma ? '2px solid var(--accent-green);background:rgba(0,230,118,0.08)' : '1px solid var(--border);background:var(--bg-elevated)'}`;
  if (btnRts) btnRts.style.cssText = `display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;border:${esRts ? '2px solid var(--accent-green);background:rgba(0,230,118,0.08)' : '1px solid var(--border);background:var(--bg-elevated)'}`;
  if (secRazon) secRazon.classList.toggle('hidden', !esRts);
  if (!esRts && document.getElementById('ini-razon-retorno')) {
    document.getElementById('ini-razon-retorno').value = '';
  }
}

async function iniciarTracking() {
  const clienteId = document.getElementById('ini-cliente').value;
  const trackingNum = document.getElementById('ini-tracking').value.trim().toUpperCase();
  const cantidadRaw = document.getElementById('ini-cantidad').value;
  const cantidad = cantidadRaw !== '' ? parseInt(cantidadRaw) : 0;
  const operador = document.getElementById('ini-operador').value.trim() || 'Operador';
  const alertEl = document.getElementById('alert-inicio');

  if (!clienteId || !trackingNum) {
    alertEl.innerHTML = '<div class="alert alert-error">Todos los campos marcados con * son requeridos</div>';
    return;
  }

  const opt = document.getElementById('ini-cliente').selectedOptions[0];
  const requiereOrden = opt?.dataset.requiereOrden === '1';
  const requiereTipoRetorno = opt?.dataset.requiereTipoRetorno === '1';

  const numeroOrden = document.getElementById('ini-numero-orden')?.value.trim().toUpperCase() || null;
  const tipoRetorno = document.querySelector('input[name="ini-tipo-retorno"]:checked')?.value || null;
  const razonRetorno = document.getElementById('ini-razon-retorno')?.value.trim() || null;

  if (requiereOrden && !numeroOrden) {
    alertEl.innerHTML = '<div class="alert alert-error">El Número de Orden es requerido para este cliente</div>';
    return;
  }
  if (requiereTipoRetorno && !tipoRetorno) {
    alertEl.innerHTML = '<div class="alert alert-error">Debes seleccionar el Tipo de Retorno (RMA o RTS)</div>';
    return;
  }
  if (requiereTipoRetorno && tipoRetorno === 'RTS' && !razonRetorno) {
    alertEl.innerHTML = '<div class="alert alert-error">La Razón de Retorno es requerida para RTS</div>';
    return;
  }

  try {
    alertEl.innerHTML = '';
    const res = await API.post('/trackings', {
      tracking_number: trackingNum,
      cliente_id: clienteId,
      operador,
      cantidad_declarada: cantidad,
      numero_orden: requiereOrden ? numeroOrden : null,
      tipo_retorno: requiereTipoRetorno ? tipoRetorno : null,
      razon_retorno: requiereTipoRetorno && tipoRetorno === 'RTS' ? razonRetorno : null,
    });

    state.tracking = await API.get(`/trackings/${res.id}`);
    state.cliente = state.tracking;
    state.detalles = [];
    state.errores = [];
    state.fase = 'inspeccion';

    // Update URL
    window.history.pushState({}, '', `?id=${res.id}`);

    toast('Tracking iniciado correctamente');
    renderInspeccion();
  } catch(e) {
    alertEl.innerHTML = `<div class="alert alert-error">${e.error || 'Error al crear tracking'}</div>`;
  }
}

function renderInspeccion() {

  const grado = parseInt(t.grado_confianza);
  const modCalidad = parseInt(t.modulo_calidad) === 1;
  const isClosed = t.estatus === 'cerrado';

  let muestreoTarget = 0;
  if (grado === 2) {
    muestreoTarget = Math.ceil(t.cantidad_declarada * (t.porcentaje_muestreo / 100));
  } else if (grado === 3) {
    muestreoTarget = t.cantidad_declarada;
  }

  const totalInspeccionado = state.detalles.reduce((s, d) => s + (d.cantidad || 1), 0);
  const pctAvance = muestreoTarget > 0 ? Math.min(Math.round(totalInspeccionado / muestreoTarget * 100), 100) : 100;
  const erroresCount = state.errores.length;
  const discrepancia = t.cantidad_final !== t.cantidad_declarada && t.cantidad_declarada > 0;

function renderErroresGenerales() {
  const generales = state.errores.filter(e => !e.detalle_sku_id && e.path_fotografia);
  if (!generales.length) return '';

  window._fotoGrupos = window._fotoGrupos || {};
  window._fotoGrupos['_err_gral'] = generales.map(e => ({
    src: e.path_fotografia,
    titulo: `${e.tipo_error}${e.comentarios ? ' — ' + e.comentarios : ''}`
  }));

  return `
    <div style="margin-top:16px">
      <div class="section-title">Evidencia — Errores Generales</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
        ${generales.map(e => `
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:76px">
            <img src="${e.path_fotografia}" class="foto-thumb"
              title="${e.tipo_error}${e.comentarios ? ' — ' + e.comentarios : ''} — clic para ampliar"
              onclick="verFoto('${e.path_fotografia}','','_err_gral')"
              style="height:64px;width:76px;object-fit:cover;border-radius:6px;border:1.5px solid rgba(220,38,38,.5);display:block">
            <div style="font-size:10px;color:var(--accent-red);font-weight:700;font-family:'IBM Plex Mono',monospace;text-align:center;line-height:1.2;width:100%;word-break:break-word">
              ${e.tipo_error}
            </div>
            ${e.comentarios ? `<div style="font-size:9px;color:var(--text-muted);text-align:center;line-height:1.3;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${e.comentarios}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderSKUList() {
  if (state.detalles.length === 0) return `
    <div class="empty-state" style="padding:32px">
      <div class="empty-state-icon">🔍</div>
      <div class="empty-state-title">Sin SKUs registrados aún</div>
      <div class="empty-state-text">Escanea el primer producto para comenzar la inspección</div>
    </div>
  `;

  window._fotoGrupos = window._fotoGrupos || {};

  return state.detalles.map(d => {
    const errD = state.errores.filter(e => e.detalle_sku_id === d.id);
    const hasError = errD.length > 0;
    const isMalo = d.calidad === 'Mala';
    const paisDiff = !d.pais_coincide;
    const insDiff = !d.insumos_coincide;
    const tieneRetrabajo = state.retrabajos.some(r => r.detalle_sku_id === d.id);

    // Build photo group for this detalle (for lightbox navigation)
    const grupo = [];
    if (d.foto_etiqueta) grupo.push({ src: d.foto_etiqueta, titulo: 'Etiqueta del producto' });
    if (d.foto_insumos)  grupo.push({ src: d.foto_insumos,  titulo: 'Insumos / País de origen' });
    if (d.foto_pieza)    grupo.push({ src: d.foto_pieza,    titulo: 'Pieza completa' });
    [1,2,3,4].forEach(n => { if (d[`foto_adicional_${n}`]) grupo.push({ src: d[`foto_adicional_${n}`], titulo: `Foto adicional ${n}` }); });
    errD.forEach(err => {
      if (err.path_fotografia) grupo.push({ src: err.path_fotografia, titulo: `⚠ ${err.tipo_error}${err.comentarios ? ' — ' + err.comentarios : ''}` });
    });
    if (grupo.length) window._fotoGrupos[d.id] = grupo;

    const thumbStyle = 'height:40px;width:40px;object-fit:cover;border-radius:4px;border:1px solid var(--border)';

async function buscarSKU(code) {
  if (!code.trim()) return;
  state.skuActual = null;
  state.skuNoRegistrado = false;

  const clienteId = state.tracking.cliente_id;
  try {
    const sku = await API.get(`/skus/buscar/${encodeURIComponent(code.trim().toUpperCase())}?cliente_id=${clienteId}`);
    state.skuActual = sku;
    state.skuNoRegistrado = !sku;

    document.getElementById('f-sku-code').value = sku ? sku.sku_code : code.trim().toUpperCase();
    document.getElementById('f-sku-desc').value = sku?.descripcion || '';
    const elPais = document.getElementById('f-pais-catalogo');
    if (elPais) elPais.textContent = sku?.pais_origen || '—';
    const elInsumos = document.getElementById('f-insumos-catalogo');
    if (elInsumos) elInsumos.textContent = sku?.insumos || '—';
    document.getElementById('f-cantidad').value = 1;

    // Reset verificaciones
    if (document.getElementById('btn-pais-ok')) setPaisCoincide(true);
    if (document.getElementById('btn-insumos-ok')) setInsumosCoincide(true);
    if (document.getElementById('btn-calidad-good')) setCalidad('Buena');

    // Mostrar sección correcta según si el SKU está registrado o no
    const secVerif = document.getElementById('seccion-verificacion');
    const secNR = document.getElementById('seccion-no-registrado');
    const filaDatos = document.getElementById('fila-datos-sku');
    if (filaDatos) filaDatos.classList.toggle('hidden', !sku);
    if (secVerif) secVerif.classList.toggle('hidden', !sku);
    if (secNR) {
      secNR.classList.toggle('hidden', !!sku);
      if (!sku) {
        // Pre-llenar UPC con el código escaneado, limpiar SKU para entrada manual
        const nrUpc = document.getElementById('nr-upc');
        const nrSku = document.getElementById('nr-sku');
        if (nrUpc) nrUpc.value = code.trim();
        if (nrSku) { nrSku.value = ''; setTimeout(() => nrSku.focus(), 50); }
        document.getElementById('nr-desc').value = '';
        document.getElementById('nr-pais-select').value = '';
        document.getElementById('nr-insumos').value = '';
        const manual = document.getElementById('nr-pais-manual');
        if (manual) { manual.value = ''; manual.style.display = 'none'; }
        // Limpiar previews y estado QR de fotos de evidencia
        limpiarTodasFotosEvidenciaQR();
        ['prev-etiqueta','prev-insumos','prev-pieza'].forEach(id => {
          const img = document.getElementById(id);
          if (img) { img.src = ''; img.classList.add('hidden'); }
        });
        ['foto-etiqueta-req','foto-insumos-req','foto-pieza-req'].forEach(id => {
          const inp = document.getElementById(id);
          if (inp) inp.value = '';
        });
        // Resetear botones de modo a "local"
        ['etiqueta','insumos','pieza'].forEach(slot => {
          document.getElementById(`fev-btn-local-${slot}`)?.classList.add('active');
          document.getElementById(`fev-btn-qr-${slot}`)?.classList.remove('active');
          document.getElementById(`fev-local-${slot}`)?.classList.remove('hidden');
          document.getElementById(`fev-qr-${slot}`)?.classList.add('hidden');
        });
      }
    }

    document.getElementById('sku-form').classList.remove('hidden');
    document.getElementById('f-sku-code').focus();
  } catch(e) {
    toast('Error buscando SKU', 'error');
  }
}

function cancelarSKU() {
  state.skuNoRegistrado = false;
  state.skuActual = null;
  limpiarTodasFotosAdicionalesQR();

  document.getElementById('sku-form').classList.add('hidden');

let fotosAdicionalesQR = {}; // { [idx]: { mode, token, url, url_foto, pollInterval, countdownInterval, expiresMs } }

function setFotoAdicionalMode(idx, mode) {
  if (!fotosAdicionalesQR[idx]) fotosAdicionalesQR[idx] = {};
  fotosAdicionalesQR[idx].mode = mode;
  document.getElementById(`fa-btn-local-${idx}`)?.classList.toggle('active', mode === 'local');
  document.getElementById(`fa-btn-qr-${idx}`)?.classList.toggle('active', mode === 'qr');
  document.getElementById(`fa-local-${idx}`)?.classList.toggle('hidden', mode !== 'local');
  document.getElementById(`fa-qr-${idx}`)?.classList.toggle('hidden', mode !== 'qr');
  if (mode === 'local') limpiarQRFotoAdicional(idx);
}

async function iniciarQRFotoAdicional(idx) {
  limpiarQRFotoAdicional(idx);
  if (!fotosAdicionalesQR[idx]) fotosAdicionalesQR[idx] = {};

  document.getElementById(`fa-qr-idle-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-qr-activo-${idx}`)?.classList.remove('hidden');
  document.getElementById(`fa-qr-recibida-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-btn-nuevo-qr-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-qr-spinner-${idx}`)?.classList.remove('hidden');

  const qrDiv = document.getElementById(`fa-qr-div-${idx}`);
  if (qrDiv) qrDiv.innerHTML = '';

  try {
    const sesion = await API.post('/foto-sesion', {
      tracking_id: state.tracking?.id || null,
      contexto: `foto-adicional-${idx}`,
    });
    const s = fotosAdicionalesQR[idx];
    s.token = sesion.token;
    s.url = sesion.url;

    if (qrDiv) {
      const qr = new QRCode(qrDiv, {
        text: sesion.url,
        width: 160,
        height: 160,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
      // Make QR responsive inside narrow card
      setTimeout(() => {
        const c = qrDiv.querySelector('canvas');
        if (c) { c.style.width = '100%'; c.style.height = 'auto'; }
        const img = qrDiv.querySelector('img');
        if (img) { img.style.width = '100%'; img.style.height = 'auto'; }
      }, 50);
    }

    s.expiresMs = Date.now() + 10 * 60 * 1000;
    tickCountdownFA(idx);
    s.countdownInterval = setInterval(() => tickCountdownFA(idx), 1000);
    s.pollInterval = setInterval(() => pollQRFA(idx), 2000);
  } catch(e) {
    if (qrDiv) qrDiv.innerHTML = '<div style="color:var(--accent-red);font-size:10px;padding:8px">Error al generar</div>';
    document.getElementById(`fa-btn-nuevo-qr-${idx}`)?.classList.remove('hidden');
    document.getElementById(`fa-qr-spinner-${idx}`)?.classList.add('hidden');
  }
}

function tickCountdownFA(idx) {
  const s = fotosAdicionalesQR[idx];
  if (!s) return;
  const remaining = Math.max(0, s.expiresMs - Date.now());
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  const el = document.getElementById(`fa-qr-cd-${idx}`);
  if (el) {
    el.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
    el.style.color = remaining < 120000 ? 'var(--accent-red)' : '';
  }
  if (remaining === 0) {
    clearInterval(s.countdownInterval);
    clearInterval(s.pollInterval);
    document.getElementById(`fa-qr-spinner-${idx}`)?.classList.add('hidden');
    document.getElementById(`fa-btn-nuevo-qr-${idx}`)?.classList.remove('hidden');
  }
}

async function pollQRFA(idx) {
  const s = fotosAdicionalesQR[idx];
  if (!s?.token) return;
  try {
    const data = await API.get(`/foto-sesion/${s.token}`);
    if (data.estatus === 'completada' && data.url_foto) {
      clearInterval(s.pollInterval);
      clearInterval(s.countdownInterval);
      s.url_foto = data.url_foto;
      document.getElementById(`fa-qr-activo-${idx}`)?.classList.add('hidden');
      document.getElementById(`fa-qr-recibida-${idx}`)?.classList.remove('hidden');
      const img = document.getElementById(`fa-qr-preview-${idx}`);
      if (img) img.src = data.url_foto;
    }
  } catch(e) {}
}

function limpiarQRFotoAdicional(idx) {
  const s = fotosAdicionalesQR[idx];
  if (!s) return;
  clearInterval(s.pollInterval);
  clearInterval(s.countdownInterval);
  s.pollInterval = null;
  s.countdownInterval = null;
}

function resetQRFotoAdicional(idx) {
  limpiarQRFotoAdicional(idx);
  if (fotosAdicionalesQR[idx]) {
    fotosAdicionalesQR[idx].token = null;
    fotosAdicionalesQR[idx].url_foto = null;
  }
  document.getElementById(`fa-qr-activo-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-qr-recibida-${idx}`)?.classList.add('hidden');
  document.getElementById(`fa-qr-idle-${idx}`)?.classList.remove('hidden');
}

function limpiarTodasFotosAdicionalesQR() {
  Object.keys(fotosAdicionalesQR).forEach(idx => limpiarQRFotoAdicional(Number(idx)));
  fotosAdicionalesQR = {};
}

    paisReal = getNrPais();
    insReal  = document.getElementById('nr-insumos').value.trim();
    paisCatalogo = '';
    insCatalogo  = '';

    if (!skuCode) { toast('El número de parte (SKU) es requerido', 'error'); return; }
    if (!paisReal) { toast('El país de origen es requerido', 'error'); return; }
    if (!insReal)  { toast('Los insumos / composición son requeridos', 'error'); return; }

    const slotInputIds = { etiqueta: 'foto-etiqueta-req', insumos: 'foto-insumos-req', pieza: 'foto-pieza-req' };
    for (const [slot, inputId] of Object.entries(slotInputIds)) {
      const mode = fotosEvidenciaQR[slot]?.mode || 'local';
      if (mode === 'qr') {
        if (!fotosEvidenciaQR[slot]?.url_foto) {
          toast(`Espera a que el teléfono envíe la foto de evidencia (${slot})`, 'error');
          return;
        }
      } else {
        if (!document.getElementById(inputId)?.files[0]) {
          toast('Se requieren las 3 fotografías de evidencia (etiqueta, insumos/origen, pieza completa)', 'error');
          return;
        }
      }
    }
  } else {
    // Leer desde campos normales
    skuCode = document.getElementById('f-sku-code').value.trim().toUpperCase();
    desc    = document.getElementById('f-sku-desc').value.trim();
    // Para G1 los campos de verificación no están en el DOM → usar datos del catálogo directamente
    paisCatalogo = document.getElementById('f-pais-catalogo')?.textContent || state.skuActual?.pais_origen || '';
    insCatalogo  = document.getElementById('f-insumos-catalogo')?.textContent || state.skuActual?.insumos || '';
    paisReal     = state.paisCoincide !== false ? paisCatalogo : (getPaisReal() || paisCatalogo);
    insReal      = state.insumosCoincide !== false ? insCatalogo : (document.getElementById('f-insumos-real')?.value.trim() || insCatalogo);
    upcCode = state.skuActual?.upc_code || '';

    if (!skuCode) { toast('Código SKU requerido', 'error'); return; }
  }

  // Validar fotos adicionales (solo G3) — acepta modo local o QR
  const fotosReq = parseInt(state.tracking.grado_confianza) === 3 ? (parseInt(state.tracking.fotos_adicionales) || 0) : 0;
  if (fotosReq > 0) {
    for (let i = 1; i <= fotosReq; i++) {
      const modeFA = fotosAdicionalesQR[i]?.mode || 'local';
      if (modeFA === 'qr') {
        if (!fotosAdicionalesQR[i]?.url_foto) {
          toast(`Espera a que el teléfono envíe la foto adicional ${i} de ${fotosReq}`, 'error');
          return;
        }
      } else {
        if (!document.getElementById(`foto-adicional-${i}`)?.files[0]) {
          toast(`Se requiere la foto adicional ${i} de ${fotosReq}`, 'error');
          return;
        }
      }
    }
  }

  let _detalleGuardadoId = null; // para saber si el detalle ya fue creado en caso de error parcial
  const _eraNuevo = state.skuNoRegistrado;

  try {
    const res = await API.post(`/trackings/${state.tracking.id}/detalles`, {
      sku_code: skuCode,
      descripcion: desc,
      cantidad,
      pais_origen_catalogo: _eraNuevo ? paisReal : paisCatalogo,
      pais_origen_real: paisReal,
      pais_coincide: _eraNuevo ? true : (state.paisCoincide ?? true),
      insumos_catalogo: _eraNuevo ? insReal : insCatalogo,
      insumos_real: insReal,
      insumos_coincide: _eraNuevo ? true : (state.insumosCoincide ?? true),
      calidad: state.calidadActual,
      es_nuevo: _eraNuevo,
      upc_code: _eraNuevo ? upcCode : (state.skuActual?.upc_code || ''),
    });
    _detalleGuardadoId = res.id;

    // Subir fotos de evidencia si el SKU no estaba en catálogo (soporta local + QR mixto)
    if (_eraNuevo) {
      const fdEv = new FormData();
      const urlEv = {};
      let hasLocalEv = false;
      let hasQREv = false;
      const slotInputIds2 = { etiqueta: 'foto-etiqueta-req', insumos: 'foto-insumos-req', pieza: 'foto-pieza-req' };
      for (const [slot, inputId] of Object.entries(slotInputIds2)) {
        const mode = fotosEvidenciaQR[slot]?.mode || 'local';
        if (mode === 'qr') {
          urlEv[`url_${slot}`] = fotosEvidenciaQR[slot].url_foto;
          hasQREv = true;
        } else {
          fdEv.append(slot, document.getElementById(inputId).files[0]);
          hasLocalEv = true;
        }
      }
      if (hasLocalEv) await API.postForm(`/detalles/${res.id}/fotos-evidencia`, fdEv);
      if (hasQREv)   await API.post(`/detalles/${res.id}/fotos-evidencia-url`, urlEv);
      limpiarTodasFotosEvidenciaQR();

      // Agregar al catálogo (idempotente — no crea duplicado si ya existe)
      await API.post('/skus', {
        cliente_id: state.tracking.cliente_id,
        sku_code:   skuCode,
        upc_code:   upcCode || null,
        descripcion: desc || null,
        pais_origen: paisReal,
        insumos:     insReal,
      });
    }

    // Subir fotos adicionales (G3) — modo local vía multipart, modo QR vía URL
    if (fotosReq > 0) {
      const fdA = new FormData();
      const urlBody = {};
      let hasLocal = false;
      let hasQR = false;
      for (let i = 1; i <= fotosReq; i++) {
        const modeFA = fotosAdicionalesQR[i]?.mode || 'local';
        if (modeFA === 'qr') {
          urlBody[`url${i}`] = fotosAdicionalesQR[i].url_foto;
          hasQR = true;
        } else {
          fdA.append(`foto${i}`, document.getElementById(`foto-adicional-${i}`).files[0]);
          hasLocal = true;
        }
      }
      if (hasLocal) await API.postForm(`/detalles/${res.id}/fotos-adicionales`, fdA);
      if (hasQR) await API.post(`/detalles/${res.id}/fotos-adicionales-url`, urlBody);
      limpiarTodasFotosAdicionalesQR();
    }

    // Reload
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    state.detalles = await API.get(`/trackings/${state.tracking.id}/detalles`);
    state.errores = await API.get(`/trackings/${state.tracking.id}/errores`);
    state.retrabajos = await API.get(`/trackings/${state.tracking.id}/retrabajos`);

    toast(`SKU ${skuCode} registrado${_eraNuevo ? ' — NUEVO en catálogo' : ''}${fotosReq > 0 ? ` + ${fotosReq} foto(s) adicional(es)` : ''}`);

    // Si hay problemas → abrir modal de error y diferir el reset del formulario
    const hayProblema = (state.paisCoincide === false) || (state.insumosCoincide === false) || state.calidadActual === 'Mala';
    if (hayProblema) {
      document.getElementById('error-detalle-id').value = res.id;

      let tipoSugerido = 'Calidad';
      if (state.paisCoincide === false) tipoSugerido = 'Origen';
      else if (state.insumosCoincide === false) tipoSugerido = 'Insumo';
      document.getElementById('error-tipo').value = tipoSugerido;

      // Reset retrabajos
      retrabajosSel.clear();
      const otroTexto = document.getElementById('rt-otro-texto');
      if (otroTexto) otroTexto.value = '';

      onTipoErrorChange(tipoSugerido);
      renderRetrabajoBotones();
      limpiarQR();
      setFotoMode('local');
      // Marcar reset pendiente: cancelarSKU + renderInspeccion se ejecutan al cerrar el modal
      state.pendingReset = true;
      // Actualizar solo la lista de SKUs (sin reconstruir todo el panel ni cerrar el formulario)
      const listaEl = document.getElementById('lista-skus');
      if (listaEl) listaEl.innerHTML = renderSKUList();
      openModal('modal-error');
    } else {
      cancelarSKU();
      document.getElementById('lista-skus').innerHTML = renderSKUList();
      renderInspeccion();
    }
  } catch(e) {
    if (_detalleGuardadoId) {
      // El detalle ya fue guardado — resetear formulario y avisar
      cancelarSKU();
      state.detalles = await API.get(`/trackings/${state.tracking.id}/detalles`).catch(() => state.detalles);
      document.getElementById('lista-skus').innerHTML = renderSKUList();
      renderInspeccion();
      toast('SKU guardado. Error subiendo fotos — agrégalas desde SKUs Nuevos en Catálogo.', 'warning');
    } else {
      toast(e.error || 'Error al registrar SKU', 'error');
    }
  }
}

async function eliminarDetalle(id) {
  const ok = await confirm('¿Eliminar este SKU del registro?', 'Eliminar SKU');
  if (!ok) return;
  try {
    await API.del(`/trackings/${state.tracking.id}/detalles/${id}`);
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    state.detalles = await API.get(`/trackings/${state.tracking.id}/detalles`);
    renderInspeccion();
    toast('SKU eliminado');
  } catch(e) { toast(e.error || 'Error', 'error'); }
}

function onEdPaisSelect(val) {
  const manual = document.getElementById('ed-pais-manual');
  if (manual) manual.style.display = val === '__other__' ? 'block' : 'none';
}

function getEdPais() {
  const sel = document.getElementById('ed-pais-select');
  if (!sel) return '';
  if (sel.value === '__other__') return document.getElementById('ed-pais-manual')?.value.trim() || '';
  return sel.value;
}

// Edit modal state
let editDetalleId = null;
let editDetalleFotoFiles = { etiqueta: null, insumos: null, pieza: null };
let editNuevosRTSel = new Set();

function renderEdFotosGrid(d) {
  const slots = [
    { key: 'etiqueta', label: '① Etiqueta', url: d.foto_etiqueta },
    { key: 'insumos',  label: '② Insumos/Origen', url: d.foto_insumos },
    { key: 'pieza',    label: '③ Pieza completa', url: d.foto_pieza },
  ];
  return slots.map(s => `
    <div style="display:flex;flex-direction:column;gap:5px" id="ed-foto-slot-${s.key}">
      <div style="font-size:10px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace">${s.label}</div>
      ${s.url
        ? `<img id="ed-foto-img-${s.key}" src="${s.url}" style="width:100%;max-height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer"
             onclick="verFoto('${s.url}','${s.label}','')" title="Clic para ampliar">`
        : `<div id="ed-foto-img-${s.key}" style="width:100%;height:60px;border:1px dashed var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center">
             <span style="font-size:10px;color:var(--text-muted)">Sin foto</span>
           </div>`}
      <label class="btn btn-secondary btn-sm" style="justify-content:center;cursor:pointer;font-size:11px;padding:4px 8px;margin:0">
        ${s.url ? '↑ Cambiar' : '📷 Subir'}
        <input type="file" accept="image/*" capture="environment" style="display:none"
          onchange="edFotoChange(this,'${s.key}')">
      </label>
      <div id="ed-foto-nueva-${s.key}" class="hidden" style="font-size:10px;color:var(--accent-green);text-align:center;font-weight:700">✓ Nueva foto lista</div>
    </div>
  `).join('');
}

function edFotoChange(input, slot) {
  const file = input.files[0];
  if (!file) return;
  editDetalleFotoFiles[slot] = file;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById(`ed-foto-img-${slot}`);
    if (img) {
      img.src = e.target.result;
      img.style.cssText = 'width:100%;max-height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--accent-green);cursor:pointer';
      img.onclick = null;
    }
    document.getElementById(`ed-foto-nueva-${slot}`)?.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function renderEdRetrabajos(detalleId) {
  const lista   = document.getElementById('ed-retrabajos-lista');
  const agregar = document.getElementById('ed-retrabajos-agregar');

  const rts = state.retrabajos.filter(r => r.detalle_sku_id === detalleId);
  lista.innerHTML = rts.length === 0
    ? `<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-bottom:8px">Sin retrabajos asignados</div>`
    : rts.map(r => {
        let tipos;
        try { tipos = JSON.parse(r.retrabajos_seleccionados || '[]'); } catch { tipos = []; }
        if (r.retrabajo_otro) tipos.push(r.retrabajo_otro);
        return `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:8px;background:rgba(255,171,0,.07);border:1px solid rgba(255,171,0,.2);border-radius:4px">
            <span style="flex:1;font-size:12px">🔧 ${tipos.join(' · ') || 'Retrabajo'}</span>
            <button class="btn btn-sm" style="padding:3px 8px;font-size:11px;border:1px solid rgba(255,61,61,.4);color:var(--accent-red);background:transparent;cursor:pointer;border-radius:4px"
              onclick="eliminarEdRetrabajo('${r.id}')">✕</button>
          </div>`;
      }).join('');

  const tipo   = (state.tracking?.tipo_mercancia || 'textil').toLowerCase();
  const opciones = CATALOGO_RT[tipo] || CATALOGO_RT.textil;
  const btnSt  = sel => `display:inline-block;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s;border:1px solid ${sel?'#ffab00':'var(--border)'};background:${sel?'rgba(255,171,0,.15)':'var(--bg-elevated)'};color:${sel?'#ffab00':'var(--text-secondary)'};font-weight:${sel?'700':'400'}`;

  agregar.innerHTML = `
    <div style="font-size:10px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase">Agregar retrabajo</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px" id="ed-rt-botones">
      ${opciones.map(op => `<span style="${btnSt(editNuevosRTSel.has(op))}" onclick="toggleEdRT('${op.replace(/'/g, "\\'")}')">${op}</span>`).join('')}
    </div>`;
}

function toggleEdRT(tipo) {
  if (editNuevosRTSel.has(tipo)) { editNuevosRTSel.delete(tipo); }
  else { editNuevosRTSel.add(tipo); }
  const t    = (state.tracking?.tipo_mercancia || 'textil').toLowerCase();
  const opts = CATALOGO_RT[t] || CATALOGO_RT.textil;
  const btnSt = sel => `display:inline-block;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s;border:1px solid ${sel?'#ffab00':'var(--border)'};background:${sel?'rgba(255,171,0,.15)':'var(--bg-elevated)'};color:${sel?'#ffab00':'var(--text-secondary)'};font-weight:${sel?'700':'400'}`;
  const cont = document.getElementById('ed-rt-botones');
  if (cont) cont.innerHTML = opts.map(op => `<span style="${btnSt(editNuevosRTSel.has(op))}" onclick="toggleEdRT('${op.replace(/'/g, "\\'")}')">${op}</span>`).join('');
}

async function eliminarEdRetrabajo(id) {
  try {
    await API.del(`/retrabajos/${id}`);
    state.retrabajos = state.retrabajos.filter(r => r.id !== id);
    renderEdRetrabajos(editDetalleId);
    toast('Retrabajo eliminado');
  } catch(e) { toast(e.error || 'Error', 'error'); }
}

function abrirEditarDetalle(id) {
  const d = state.detalles.find(x => x.id === id);
  if (!d) return;

  editDetalleId = id;
  editDetalleFotoFiles = { etiqueta: null, insumos: null, pieza: null };
  editNuevosRTSel = new Set();

  document.getElementById('ed-id').value          = d.id;
  document.getElementById('ed-tracking-id').value = state.tracking.id;
  document.getElementById('ed-sku').value         = d.sku_code;
  document.getElementById('ed-cantidad').value    = d.cantidad || 1;
  document.getElementById('ed-desc').value        = d.descripcion || '';
  document.getElementById('ed-insumos').value     = d.insumos_real || '';
  document.getElementById('ed-calidad').value     = d.calidad || 'Buena';

  // Country dropdown
  const paisActual = d.pais_origen_real || '';
  const sel = document.getElementById('ed-pais-select');
  const opts = Array.from(sel.options).map(o => o.value);
  if (!paisActual) {
    sel.value = '';
    onEdPaisSelect('');
  } else if (opts.includes(paisActual)) {
    sel.value = paisActual;
    onEdPaisSelect(paisActual);
  } else {
    sel.value = '__other__';
    document.getElementById('ed-pais-manual').value = paisActual;
    onEdPaisSelect('__other__');
  }

  // Photos section — always visible
  const fotosSection = document.getElementById('ed-fotos-section');
  const fotosGrid    = document.getElementById('ed-fotos-grid');
  fotosSection.classList.remove('hidden');
  fotosGrid.innerHTML = renderEdFotosGrid(d);

  // Retrabajos section — only when client has the module
  const rtSection = document.getElementById('ed-retrabajos-section');
  if (parseInt(state.tracking.modulo_retrabajo) === 1) {
    rtSection.classList.remove('hidden');
    renderEdRetrabajos(id);
  } else {
    rtSection.classList.add('hidden');
  }

  openModal('modal-editar-detalle');
}

async function guardarEditarDetalle() {
  const id  = document.getElementById('ed-id').value;
  const tid = document.getElementById('ed-tracking-id').value;

  // Capture old calidad before saving to detect changes
  const oldCalidad = state.detalles.find(d => d.id === id)?.calidad || 'Buena';

  const body = {
    descripcion:      document.getElementById('ed-desc').value.trim()    || null,
    cantidad:         parseInt(document.getElementById('ed-cantidad').value) || 1,
    pais_origen_real: getEdPais() || null,
    insumos_real:     document.getElementById('ed-insumos').value.trim() || null,
    calidad:          document.getElementById('ed-calidad').value,
  };
  try {
    await API.put(`/trackings/${tid}/detalles/${id}`, body);

    // Upload any changed/new evidence photos
    const hasNewPhotos = Object.values(editDetalleFotoFiles).some(f => f);
    if (hasNewPhotos) {
      const fd = new FormData();
      if (editDetalleFotoFiles.etiqueta) fd.append('etiqueta', editDetalleFotoFiles.etiqueta);
      if (editDetalleFotoFiles.insumos)  fd.append('insumos',  editDetalleFotoFiles.insumos);
      if (editDetalleFotoFiles.pieza)    fd.append('pieza',    editDetalleFotoFiles.pieza);
      await API.postForm(`/detalles/${id}/fotos-evidencia`, fd);
    }

    // Save newly selected retrabajos
    if (editNuevosRTSel.size > 0) {
      const detalle = state.detalles.find(d => d.id === id);
      await API.post(`/trackings/${tid}/retrabajos`, {
        detalle_sku_id:          id,
        sku_code:                detalle?.sku_code     || '',
        descripcion_sku:         detalle?.descripcion  || '',
        retrabajos_seleccionados: [...editNuevosRTSel],
        retrabajo_otro:          null,
      });
    }

    closeModal('modal-editar-detalle');
    state.tracking  = await API.get(`/trackings/${tid}`);
    state.detalles  = await API.get(`/trackings/${tid}/detalles`);
    state.retrabajos = await API.get(`/trackings/${tid}/retrabajos`);
    document.getElementById('lista-skus').innerHTML = renderSKUList();
    renderInspeccion();
    toast('SKU actualizado ✓');

    // If calidad changed, prompt to reassign box
    if (body.calidad !== oldCalidad) {
      await manejarCambioCalidad();
    }
  } catch(e) { toast(e.error || 'Error al guardar', 'error'); }
}

function calcularTipoRequerido() {
  const tieneDanado   = state.errores.some(e => e.tipo_error === 'Calidad' || e.tipo_error === 'Otro')
                     || state.detalles.some(d => d.calidad === 'Mala');
  const tieneNoMarca  = state.errores.some(e => e.tipo_error === 'Mercancía ajena');
  const tieneRetrabajos = state.retrabajos.length > 0;
  if (tieneDanado && !tieneRetrabajos) return 'Damage';
  if (tieneNoMarca) return 'Non-brand merchandise';
  return 'Good Condition';
}

async function manejarCambioCalidad() {
  const tipo = calcularTipoRequerido();
  const labels = {
    'Damage':                'Dañado (Damage)',
    'Good Condition':        'Buen Estado (Good Condition)',
    'Non-brand merchandise': 'Sin Marca (Non-brand)',
  };

  if (state.tracking.caja_pallet_id) {
    // Tracking ya tiene caja asignada — ofrecer reasignación
    await abrirReasignarCaja(tipo);
  } else {
    // Tracking aún sin caja — aviso informativo
    toast(`Calidad actualizada. Al cerrar, usa una caja de tipo "${labels[tipo]}".`, 'warning');
  }
}

async function abrirReasignarCaja(tipo) {
  const labels = {
    'Damage':                'Dañado (Damage)',
    'Good Condition':        'Buen Estado (Good Condition)',
    'Non-brand merchandise': 'Sin Marca (Non-brand)',
  };
  const t = state.tracking;

  const infoEl = document.getElementById('reasignar-info');
  if (infoEl) infoEl.textContent = `La calidad del SKU cambió — tipo de caja requerido: ${labels[tipo] || tipo}.`;

  const sel = document.getElementById('reasignar-caja-select');
  sel.innerHTML = '<option value="">— Cargando... —</option>';

  try {
    const cajas = await API.get(`/cajas?cliente_id=${t.cliente_id}&estatus=Abierta&tipo=${encodeURIComponent(tipo)}`);
    const tipoBadge = { 'Damage': 'DMG', 'Good Condition': 'GDC', 'Non-brand merchandise': 'NBM' };
    if (cajas.length === 0) {
      sel.innerHTML = `<option value="">— Sin cajas "${tipoBadge[tipo] || tipo}" abiertas —</option>`;
    } else {
      sel.innerHTML = '<option value="">— Seleccionar caja —</option>'
        + cajas.map(c => `<option value="${c.id}">[${tipoBadge[c.tipo] || c.tipo}] ${c.nombre}${c.id === t.caja_pallet_id ? ' (actual)' : ''}</option>`).join('');
    }
  } catch(e) {
    sel.innerHTML = '<option value="">— Error al cargar —</option>';
  }

  openModal('modal-reasignar-caja');
}

async function confirmarReasignarCaja() {
  const cajaPalletId = document.getElementById('reasignar-caja-select').value;
  if (!cajaPalletId) { toast('Selecciona una caja', 'error'); return; }
  try {
    await API.put(`/trackings/${state.tracking.id}/caja`, { caja_pallet_id: cajaPalletId });
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    closeModal('modal-reasignar-caja');
    renderInspeccion();
    toast(`Caja reasignada a ${state.tracking.caja_id} ✓`);
  } catch(e) { toast(e.error || 'Error al reasignar', 'error'); }
}

// --- QR Foto Sesion ---
let fotoMode = 'local';
let qrSesion = null;
let qrPollInterval = null;
let qrCountdownInterval = null;
let qrExpiresMs = 0;

function setFotoMode(mode) {
  fotoMode = mode;
  document.getElementById('btn-modo-local')?.classList.toggle('active', mode === 'local');
  document.getElementById('btn-modo-qr')?.classList.toggle('active', mode === 'qr');
  document.getElementById('foto-modo-local')?.classList.toggle('hidden', mode !== 'local');
  document.getElementById('foto-modo-qr')?.classList.toggle('hidden', mode !== 'qr');
  if (mode === 'local') limpiarQR();
}

async function iniciarSesionQR() {
  limpiarQR();

  document.getElementById('qr-idle').classList.add('hidden');
  document.getElementById('qr-activo').classList.remove('hidden');
  document.getElementById('qr-recibida').classList.add('hidden');
  document.getElementById('btn-nuevo-qr').classList.add('hidden');
  document.getElementById('qr-spinner').classList.remove('hidden');

  const qrDiv = document.getElementById('qr-code-div');
  qrDiv.innerHTML = '<div class="spinner" style="width:22px;height:22px;border-width:2px;margin:24px auto"></div>';

  try {
    const sesion = await API.post('/foto-sesion', {
      tracking_id: state.tracking?.id || null,
      detalle_sku_id: document.getElementById('error-detalle-id')?.value || null,
      contexto: 'error-evidencia',
    });
    qrSesion = sesion;

    qrDiv.innerHTML = '';
    new QRCode(qrDiv, {
      text: sesion.url,
      width: 220,
      height: 220,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });

    qrExpiresMs = Date.now() + 10 * 60 * 1000;
    tickCountdown();
    qrCountdownInterval = setInterval(tickCountdown, 1000);
    qrPollInterval = setInterval(pollQR, 2000);
  } catch(e) {
    qrDiv.innerHTML = '<div style="color:var(--accent-red);padding:16px;font-size:12px">Error al generar QR. Intenta de nuevo.</div>';
    document.getElementById('btn-nuevo-qr').classList.remove('hidden');
    document.getElementById('qr-spinner').classList.add('hidden');
  }
}

function tickCountdown() {
  const remaining = Math.max(0, qrExpiresMs - Date.now());
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  const el = document.getElementById('qr-countdown');
  if (el) {
    el.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
    el.style.color = remaining < 120000 ? 'var(--accent-red)' : 'var(--text-secondary)';
  }
  if (remaining === 0) {
    clearInterval(qrCountdownInterval);
    clearInterval(qrPollInterval);
    document.getElementById('qr-spinner')?.classList.add('hidden');
    document.getElementById('btn-nuevo-qr')?.classList.remove('hidden');
  }
}

async function pollQR() {
  if (!qrSesion?.token) return;
  try {
    const data = await API.get(`/foto-sesion/${qrSesion.token}`);
    if (data.estatus === 'completada' && data.url_foto) {
      clearInterval(qrPollInterval);
      clearInterval(qrCountdownInterval);
      qrSesion.url_foto = data.url_foto;
      document.getElementById('qr-activo').classList.add('hidden');
      document.getElementById('qr-recibida').classList.remove('hidden');
      document.getElementById('foto-qr-preview').src = data.url_foto;
    }
  } catch(e) {}
}

function limpiarQR() {
  clearInterval(qrPollInterval);
  clearInterval(qrCountdownInterval);
  qrPollInterval = null;
  qrCountdownInterval = null;
}

function resetQRSesion() {
  limpiarQR();
  qrSesion = null;
  document.getElementById('qr-activo').classList.add('hidden');
  document.getElementById('qr-recibida').classList.add('hidden');
  document.getElementById('qr-idle').classList.remove('hidden');
}

function cerrarModalError() {
  limpiarQR();
  setFotoMode('local');
  closeModal('modal-error');
  if (state.pendingReset) {
    state.pendingReset = false;
    cancelarSKU();
    renderInspeccion();
  }
}

function previewFoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById('foto-preview');
    prev.src = e.target.result;
    prev.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function previewFotoReq(input, previewId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById(previewId);
    if (img) { img.src = e.target.result; img.classList.remove('hidden'); }
  };
  reader.readAsDataURL(file);
}

// Catálogo de retrabajos por tipo de mercancía (espejo del backend)
const CATALOGO_RT = {
  calzado:    ['Cambio de caja', 'Limpieza', 'Reparación de caja', 'Impresión de etiqueta'],
  textil:     ['Cambio de etiqueta', 'Limpieza', 'Reparación de costura', 'Planchado', 'Re-empaque'],
  traje_bano: ['Cambio de etiqueta', 'Limpieza', 'Re-empaque', 'Revisión de elástico'],
  sombreros:  ['Cambio de etiqueta', 'Limpieza', 'Reparación de forma', 'Re-empaque'],
};

let retrabajosSel = new Set(); // retrabajos actualmente seleccionados

function renderRetrabajoBotones() {
  const tipo = (state.tracking?.tipo_mercancia || 'textil').toLowerCase();
  const opciones = CATALOGO_RT[tipo] || CATALOGO_RT.textil;
  const contenedor = document.getElementById('rt-botones');
  if (!contenedor) return;

  const btnStyle = (sel) =>
    `display:inline-block;padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer;transition:all .15s;border:1px solid ${sel ? '#ffab00' : 'var(--border)'};background:${sel ? 'rgba(255,171,0,.15)' : 'var(--bg-elevated)'};color:${sel ? '#ffab00' : 'var(--text-secondary)'};font-weight:${sel ? '700' : '400'}`;

  const botonesHtml = opciones.map(op => {
    const sel = retrabajosSel.has(op);
    return `<span style="${btnStyle(sel)}" onclick="toggleRetrabajo('${op.replace(/'/g, "\\'")}')">${op}</span>`;
  }).join('');

  const selOtro = retrabajosSel.has('__otro__');
  const otroBtn = `<span style="${btnStyle(selOtro)}" onclick="toggleRetrabajo('__otro__')">+ Otro</span>`;

  contenedor.innerHTML = botonesHtml + otroBtn;

  // Mostrar/ocultar input de "otro"
  const otroInput = document.getElementById('rt-otro-input');
  if (otroInput) otroInput.classList.toggle('hidden', !selOtro);
}

function toggleRetrabajo(tipo) {
  if (retrabajosSel.has(tipo)) {
    retrabajosSel.delete(tipo);
  } else {
    retrabajosSel.add(tipo);
  }
  renderRetrabajoBotones();
  actualizarBannerRetrabajo();
}

function actualizarBannerRetrabajo() {
  const tipoError = document.getElementById('error-tipo')?.value || 'Calidad';
  const esDanado = tipoError === 'Calidad' || tipoError === 'Otro';
  const hayRetrabajo = retrabajosSel.size > 0;
  const tieneModulo = parseInt(state.tracking?.modulo_retrabajo) === 1;

  if (esDanado && tieneModulo) {
    document.getElementById('disposicion-danados').classList.toggle('hidden', hayRetrabajo);
    document.getElementById('disposicion-retrabajo').classList.toggle('hidden', !hayRetrabajo);
  }
}

function onTipoErrorChange(tipo) {
  const esDanado = tipo === 'Calidad' || tipo === 'Otro';
  const tieneRetrabajo = parseInt(state.tracking?.modulo_retrabajo) === 1;

  // Banners
  document.getElementById('disposicion-discrepancia').classList.toggle('hidden', esDanado);
  if (esDanado && tieneRetrabajo) {
    const hayRetrabajo = retrabajosSel.size > 0;
    document.getElementById('disposicion-danados').classList.toggle('hidden', hayRetrabajo);
    document.getElementById('disposicion-retrabajo').classList.toggle('hidden', !hayRetrabajo);
  } else if (esDanado) {
    document.getElementById('disposicion-danados').classList.remove('hidden');
    document.getElementById('disposicion-retrabajo').classList.add('hidden');
  } else {
    document.getElementById('disposicion-danados').classList.add('hidden');
    document.getElementById('disposicion-retrabajo').classList.add('hidden');
  }

  // Sección de retrabajos
  const seccion = document.getElementById('seccion-retrabajos-modal');
  if (seccion) {
    seccion.classList.toggle('hidden', !(esDanado && tieneRetrabajo));
    if (!esDanado) {
      retrabajosSel.clear();
      renderRetrabajoBotones();
    }
  }
}

async function guardarError() {
  const tipo = document.getElementById('error-tipo').value;
  const desc = document.getElementById('error-desc').value.trim();
  const fotoInput = document.getElementById('error-foto');
  const detalleId = document.getElementById('error-detalle-id').value;
  const tieneRetrabajo = parseInt(state.tracking?.modulo_retrabajo) === 1;
  const esDanado = tipo === 'Calidad' || tipo === 'Otro';
  const hayRetrabajos = tieneRetrabajo && esDanado && retrabajosSel.size > 0;

  if (!desc) { toast('La descripción es requerida', 'error'); return; }

  if (fotoMode === 'qr') {
    if (!qrSesion?.url_foto) { toast('Espera a que el teléfono envíe la foto antes de guardar', 'error'); return; }
  } else {
    if (!fotoInput.files[0]) { toast('La fotografía de evidencia es requerida', 'error'); return; }
  }

  try {
    if (fotoMode === 'qr') {
      await API.post(`/trackings/${state.tracking.id}/errores-url`, {
        tipo_error: tipo,
        comentarios: desc,
        detalle_sku_id: detalleId,
        path_fotografia: qrSesion.url_foto,
      });
    } else {
      const fd = new FormData();
      fd.append('tipo_error', tipo);
      fd.append('comentarios', desc);
      fd.append('detalle_sku_id', detalleId);
      fd.append('foto', fotoInput.files[0]);
      await API.postForm(`/trackings/${state.tracking.id}/errores`, fd);
    }

    if (hayRetrabajos) {
      const detalle = state.detalles.find(d => d.id === detalleId);
      const rtSeleccionados = [...retrabajosSel].filter(r => r !== '__otro__');
      const rtOtroTexto = retrabajosSel.has('__otro__')
        ? (document.getElementById('rt-otro-texto')?.value.trim() || '')
        : '';

      await API.post(`/trackings/${state.tracking.id}/retrabajos`, {
        detalle_sku_id: detalleId,
        sku_code: detalle?.sku_code || '',
        descripcion_sku: detalle?.descripcion || '',
        retrabajos_seleccionados: rtSeleccionados,
        retrabajo_otro: rtOtroTexto || null,
      });
    }

    state.errores = await API.get(`/trackings/${state.tracking.id}/errores`);
    state.retrabajos = await API.get(`/trackings/${state.tracking.id}/retrabajos`);

    limpiarQR();
    setFotoMode('local');
    closeModal('modal-error');

    // Reset modal
    document.getElementById('error-desc').value = '';
    document.getElementById('error-foto').value = '';
    document.getElementById('foto-preview').classList.add('hidden');
    retrabajosSel.clear();

    // Si el modal se abrió tras registrar un SKU con discrepancia, limpiar el formulario ahora
    if (state.pendingReset) {
      state.pendingReset = false;
      cancelarSKU();
    }

    toast(hayRetrabajos ? 'Error registrado — pieza enviada a retrabajo ✓' : 'Error registrado con evidencia');
    renderInspeccion();
  } catch(e) {
    toast(e.error || 'Error al guardar', 'error');
  }
}

function abrirDiscrepancia() {

  openModal('modal-discrepancia');

async function guardarDiscrepancia() {
  const original = parseInt(document.getElementById('disc-original').value);
  const corregida = parseInt(document.getElementById('disc-corregida').value);

  if (!corregida && corregida !== 0) { toast('Ingresa la cantidad real', 'error'); return; }

  try {
    await API.post(`/trackings/${state.tracking.id}/discrepancia`, {
      cantidad_original: original,
      cantidad_corregida: corregida
    });
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    closeModal('modal-discrepancia');
    toast('Discrepancia registrada');
    renderInspeccion();
  } catch(e) {
    toast(e.error || 'Error', 'error');
  }
}

// ========================
// CERRAR TRACKING
// ========================
async function cerrarTracking() {
  const tieneMercanciaAjena = state.errores.some(e => e.tipo_error === 'Mercancía ajena');
  if (state.detalles.length === 0 && !tieneMercanciaAjena) {
    toast('No se puede cerrar: registra al menos un SKU o marca el producto como "No corresponde al cliente"', 'error');
    return;
  }

  const erroresSinFoto = state.errores.filter(e => !e.path_fotografia);
  if (erroresSinFoto.length > 0) {
    toast(`Hay ${erroresSinFoto.length} error(es) sin fotografía de evidencia`, 'error');
    return;
  }

  const t = state.tracking;
  const modalBody = document.querySelector('#modal-cierre .modal-body');

  const tieneDanado  = state.errores.some(e => e.tipo_error === 'Calidad' || e.tipo_error === 'Otro');
  const tieneNoMarca = state.errores.some(e => e.tipo_error === 'Mercancía ajena');

  let tieneRetrabajos = false;
  if (tieneDanado) {
    try {
      const rts = await API.get(`/trackings/${t.id}/retrabajos`);
      tieneRetrabajos = rts.length > 0;
    } catch(e) {}
  }

  // Piezas dañadas con retrabajo asignado se corrigen → Good Condition
  const tipoCajaReq = (tieneDanado && !tieneRetrabajos) ? 'Damage'
    : tieneNoMarca ? 'Non-brand merchandise'
    : 'Good Condition';

  const tipoCajaLabel = { 'Damage': 'Dañado (Damage)', 'Good Condition': 'Buen Estado (Good Condition)', 'Non-brand merchandise': 'Sin Marca (Non-brand)' }[tipoCajaReq];
  const tipoCajaHint = (tieneDanado && tieneRetrabajos)
    ? 'Piezas con retrabajo asignado — se clasifican como buen estado tras corrección'
    : '';

  const tipoBadgeText = { 'Damage': 'DMG', 'Good Condition': 'GDC', 'Non-brand merchandise': 'NBM' };
  let optionsHtml = '<option value="">— Cargando... —</option>';
  try {
    const cajas = await API.get(`/cajas?cliente_id=${t.cliente_id}&estatus=Abierta&tipo=${encodeURIComponent(tipoCajaReq)}`);
    if (cajas.length === 0) {
      optionsHtml = `<option value="">— Sin cajas "${tipoBadgeText[tipoCajaReq]}" abiertas —</option>`;
    } else {
      optionsHtml = '<option value="">— Seleccionar caja —</option>' +
        cajas.map(c => `<option value="${c.id}">[${tipoBadgeText[c.tipo]||c.tipo}] ${c.nombre}</option>`).join('');
    }
  } catch(e) {
    optionsHtml = '<option value="">— Error al cargar —</option>';
  }

  modalBody.innerHTML = `
    <p style="margin:0 0 12px;color:var(--text-secondary);font-size:14px">
      Selecciona la caja/pallet donde se guardará esta inspección. Una vez cerrado no se podrán agregar más SKUs.
    </p>
    <div style="padding:8px 12px;background:rgba(0,230,118,.07);border:1px solid rgba(0,230,118,.2);border-radius:var(--radius-sm);margin-bottom:14px;font-size:12px;color:var(--text-secondary)">
      Tipo requerido: <strong style="color:var(--text-primary)">${tipoCajaLabel}</strong>
      ${tipoCajaHint ? `<div style="margin-top:4px;color:var(--accent-amber)">${tipoCajaHint}</div>` : ''}
    </div>
    <div class="form-group">
      <label class="form-label">Caja / Pallet *</label>
      <select class="form-control form-control-mono" id="cierre-caja-select">
        ${optionsHtml}
      </select>
      <div class="form-hint"><a href="cajas.html" target="_blank" style="color:var(--accent-cyan)">Administrar cajas →</a></div>
    </div>`;

  openModal('modal-cierre');
}

async function confirmarCierre() {
  try {
    const selectEl = document.getElementById('cierre-caja-select');
    const cajaPalletId = selectEl?.value || '';
    if (!cajaPalletId) { toast('Selecciona una caja/pallet para cerrar', 'error'); return; }
    await API.post(`/trackings/${state.tracking.id}/cerrar`, { caja_pallet_id: cajaPalletId });
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    closeModal('modal-cierre');
    toast('Tracking cerrado exitosamente ✓');
    renderInspeccion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e) {
    toast(e.error || 'Error al cerrar', 'error');
  }
}
