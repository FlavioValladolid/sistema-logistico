async function registrarSKU() {
  const cantidad = parseInt(document.getElementById('f-cantidad').value) || 1;

  let skuCode, desc, paisCatalogo, paisReal, insCatalogo, insReal, upcCode;

  if (state.skuNoRegistrado) {
    // Leer desde campos de no-registrado
    skuCode = document.getElementById('nr-sku').value.trim().toUpperCase();
    upcCode = document.getElementById('nr-upc').value.trim();
    desc    = document.getElementById('nr-desc').value.trim();
    paisReal = getNrPais();
    insReal  = document.getElementById('nr-insumos').value.trim();
    paisCatalogo = '';
    insCatalogo  = '';

    if (!skuCode) { toast('El número de parte (SKU) es requerido', 'error'); return; }
    if (!paisReal) { toast('El país de origen es requerido', 'error'); return; }
    if (!insReal)  { toast('Los insumos / composición son requeridos', 'error'); return; }

    const slotInputIds = { etiqueta: 'foto-etiqueta-req', insumos: 'foto-insumos-req', pieza: 'foto-pieza-req' };
    for (const [slot, inputId] of Object.entries(slotInputIds)) {
      const mode = fotosEvidenciaQR[slot]?.mode || 'local';
      if (mode === 'qr') {
        if (!fotosEvidenciaQR[slot]?.url_foto) {
          toast(`Espera a que el teléfono envíe la foto de evidencia (${slot})`, 'error');
          return;
        }
      } else {
        if (!document.getElementById(inputId)?.files[0]) {
          toast('Se requieren las 3 fotografías de evidencia (etiqueta, insumos/origen, pieza completa)', 'error');
          return;
        }
      }
    }
  } else {
    // Leer desde campos normales
    skuCode = document.getElementById('f-sku-code').value.trim().toUpperCase();
    desc    = document.getElementById('f-sku-desc').value.trim();
    // Para G1 los campos de verificación no están en el DOM → usar datos del catálogo directamente
    paisCatalogo = document.getElementById('f-pais-catalogo')?.textContent || state.skuActual?.pais_origen || '';
    insCatalogo  = document.getElementById('f-insumos-catalogo')?.textContent || state.skuActual?.insumos || '';
    paisReal     = state.paisCoincide !== false ? paisCatalogo : (getPaisReal() || paisCatalogo);
    insReal      = state.insumosCoincide !== false ? insCatalogo : (document.getElementById('f-insumos-real')?.value.trim() || insCatalogo);
    upcCode = state.skuActual?.upc_code || '';

    if (!skuCode) { toast('Código SKU requerido', 'error'); return; }
  }

  // Validar fotos adicionales (solo G3) — acepta modo local o QR
  const fotosReq = parseInt(state.tracking.grado_confianza) === 3 ? (parseInt(state.tracking.fotos_adicionales) || 0) : 0;
  if (fotosReq > 0) {
    for (let i = 1; i <= fotosReq; i++) {
      const modeFA = fotosAdicionalesQR[i]?.mode || 'local';
      if (modeFA === 'qr') {
        if (!fotosAdicionalesQR[i]?.url_foto) {
          toast(`Espera a que el teléfono envíe la foto adicional ${i} de ${fotosReq}`, 'error');
          return;
        }
      } else {
        if (!document.getElementById(`foto-adicional-${i}`)?.files[0]) {
          toast(`Se requiere la foto adicional ${i} de ${fotosReq}`, 'error');
          return;
        }
      }
    }
  }

  let _detalleGuardadoId = null; // para saber si el detalle ya fue creado en caso de error parcial
  const _eraNuevo = state.skuNoRegistrado;

  try {
    const res = await API.post(`/trackings/${state.tracking.id}/detalles`, {
      sku_code: skuCode,
      descripcion: desc,
      cantidad,
      pais_origen_catalogo: _eraNuevo ? paisReal : paisCatalogo,
      pais_origen_real: paisReal,
      pais_coincide: _eraNuevo ? true : (state.paisCoincide ?? true),
      insumos_catalogo: _eraNuevo ? insReal : insCatalogo,
      insumos_real: insReal,
      insumos_coincide: _eraNuevo ? true : (state.insumosCoincide ?? true),
      calidad: state.calidadActual,
      es_nuevo: _eraNuevo,
      upc_code: _eraNuevo ? upcCode : (state.skuActual?.upc_code || ''),
    });
    _detalleGuardadoId = res.id;

    // Subir fotos de evidencia si el SKU no estaba en catálogo (soporta local + QR mixto)
    if (_eraNuevo) {
      const fdEv = new FormData();
      const urlEv = {};
      let hasLocalEv = false;
      let hasQREv = false;
      const slotInputIds2 = { etiqueta: 'foto-etiqueta-req', insumos: 'foto-insumos-req', pieza: 'foto-pieza-req' };
      for (const [slot, inputId] of Object.entries(slotInputIds2)) {
        const mode = fotosEvidenciaQR[slot]?.mode || 'local';
        if (mode === 'qr') {
          urlEv[`url_${slot}`] = fotosEvidenciaQR[slot].url_foto;
          hasQREv = true;
        } else {
          fdEv.append(slot, document.getElementById(inputId).files[0]);
          hasLocalEv = true;
        }
      }
      if (hasLocalEv) await API.postForm(`/detalles/${res.id}/fotos-evidencia`, fdEv);
      if (hasQREv)   await API.post(`/detalles/${res.id}/fotos-evidencia-url`, urlEv);
      limpiarTodasFotosEvidenciaQR();

      // Agregar al catálogo (idempotente — no crea duplicado si ya existe)
      await API.post('/skus', {
        cliente_id: state.tracking.cliente_id,
        sku_code:   skuCode,
        upc_code:   upcCode || null,
        descripcion: desc || null,
        pais_origen: paisReal,
        insumos:     insReal,
      });
    }

    // Subir fotos adicionales (G3) — modo local vía multipart, modo QR vía URL
    if (fotosReq > 0) {
      const fdA = new FormData();
      const urlBody = {};
      let hasLocal = false;
      let hasQR = false;
      for (let i = 1; i <= fotosReq; i++) {
        const modeFA = fotosAdicionalesQR[i]?.mode || 'local';
        if (modeFA === 'qr') {
          urlBody[`url${i}`] = fotosAdicionalesQR[i].url_foto;
          hasQR = true;
        } else {
          fdA.append(`foto${i}`, document.getElementById(`foto-adicional-${i}`).files[0]);
          hasLocal = true;
        }
      }
      if (hasLocal) await API.postForm(`/detalles/${res.id}/fotos-adicionales`, fdA);
      if (hasQR) await API.post(`/detalles/${res.id}/fotos-adicionales-url`, urlBody);
      limpiarTodasFotosAdicionalesQR();
    }

    // Reload
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    state.detalles = await API.get(`/trackings/${state.tracking.id}/detalles`);
    state.errores = await API.get(`/trackings/${state.tracking.id}/errores`);
    state.retrabajos = await API.get(`/trackings/${state.tracking.id}/retrabajos`);

    toast(`SKU ${skuCode} registrado${_eraNuevo ? ' — NUEVO en catálogo' : ''}${fotosReq > 0 ? ` + ${fotosReq} foto(s) adicional(es)` : ''}`);

    // Si hay problemas → abrir modal de error y diferir el reset del formulario
    const hayProblema = (state.paisCoincide === false) || (state.insumosCoincide === false) || state.calidadActual === 'Mala';
    if (hayProblema) {
      document.getElementById('error-detalle-id').value = res.id;

      let tipoSugerido = 'Calidad';
      if (state.paisCoincide === false) tipoSugerido = 'Origen';
      else if (state.insumosCoincide === false) tipoSugerido = 'Insumo';
      document.getElementById('error-tipo').value = tipoSugerido;

      // Reset retrabajos
      retrabajosSel.clear();
      const otroTexto = document.getElementById('rt-otro-texto');
      if (otroTexto) otroTexto.value = '';

      onTipoErrorChange(tipoSugerido);
      renderRetrabajoBotones();
      limpiarQR();
      setFotoMode('local');
      // Marcar reset pendiente: cancelarSKU + renderInspeccion se ejecutan al cerrar el modal
      state.pendingReset = true;
      // Actualizar solo la lista de SKUs (sin reconstruir todo el panel ni cerrar el formulario)
      const listaEl = document.getElementById('lista-skus');
      if (listaEl) listaEl.innerHTML = renderSKUList();
      openModal('modal-error');
    } else {
      cancelarSKU();
      document.getElementById('lista-skus').innerHTML = renderSKUList();
      renderInspeccion();
    }
  } catch(e) {
    if (_detalleGuardadoId) {
      // El detalle ya fue guardado — resetear formulario y avisar
      cancelarSKU();
      state.detalles = await API.get(`/trackings/${state.tracking.id}/detalles`).catch(() => state.detalles);
      document.getElementById('lista-skus').innerHTML = renderSKUList();
      renderInspeccion();
      toast('SKU guardado. Error subiendo fotos — agrégalas desde SKUs Nuevos en Catálogo.', 'warning');
    } else {
      toast(e.error || 'Error al registrar SKU', 'error');
    }
  }
}

async function eliminarDetalle(id) {
  const ok = await confirm('¿Eliminar este SKU del registro?', 'Eliminar SKU');
  if (!ok) return;
  try {
    await API.del(`/trackings/${state.tracking.id}/detalles/${id}`);
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    state.detalles = await API.get(`/trackings/${state.tracking.id}/detalles`);
    renderInspeccion();
    toast('SKU eliminado');
  } catch(e) { toast(e.error || 'Error', 'error'); }
}

function onEdPaisSelect(val) {
  const manual = document.getElementById('ed-pais-manual');
  if (manual) manual.style.display = val === '__other__' ? 'block' : 'none';
}

function getEdPais() {
  const sel = document.getElementById('ed-pais-select');
  if (!sel) return '';
  if (sel.value === '__other__') return document.getElementById('ed-pais-manual')?.value.trim() || '';
  return sel.value;
}

// Edit modal state
let editDetalleId = null;
let editDetalleFotoFiles = { etiqueta: null, insumos: null, pieza: null };
let editNuevosRTSel = new Set();

function renderEdFotosGrid(d) {
  const slots = [
    { key: 'etiqueta', label: '① Etiqueta', url: d.foto_etiqueta },
    { key: 'insumos',  label: '② Insumos/Origen', url: d.foto_insumos },
    { key: 'pieza',    label: '③ Pieza completa', url: d.foto_pieza },
  ];
  return slots.map(s => `
    <div style="display:flex;flex-direction:column;gap:5px" id="ed-foto-slot-${s.key}">
      <div style="font-size:10px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace">${s.label}</div>
      ${s.url
        ? `<img id="ed-foto-img-${s.key}" src="${s.url}" style="width:100%;max-height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer"
             onclick="verFoto('${s.url}','${s.label}','')" title="Clic para ampliar">`
        : `<div id="ed-foto-img-${s.key}" style="width:100%;height:60px;border:1px dashed var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center">
             <span style="font-size:10px;color:var(--text-muted)">Sin foto</span>
           </div>`}
      <label class="btn btn-secondary btn-sm" style="justify-content:center;cursor:pointer;font-size:11px;padding:4px 8px;margin:0">
        ${s.url ? '↑ Cambiar' : '📷 Subir'}
        <input type="file" accept="image/*" capture="environment" style="display:none"
          onchange="edFotoChange(this,'${s.key}')">
      </label>
      <div id="ed-foto-nueva-${s.key}" class="hidden" style="font-size:10px;color:var(--accent-green);text-align:center;font-weight:700">✓ Nueva foto lista</div>
    </div>
  `).join('');
}

function edFotoChange(input, slot) {
  const file = input.files[0];
  if (!file) return;
  editDetalleFotoFiles[slot] = file;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById(`ed-foto-img-${slot}`);
    if (img) {
      img.src = e.target.result;
      img.style.cssText = 'width:100%;max-height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--accent-green);cursor:pointer';
      img.onclick = null;
    }
    document.getElementById(`ed-foto-nueva-${slot}`)?.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function renderEdRetrabajos(detalleId) {
  const lista   = document.getElementById('ed-retrabajos-lista');
  const agregar = document.getElementById('ed-retrabajos-agregar');

  const rts = state.retrabajos.filter(r => r.detalle_sku_id === detalleId);
  lista.innerHTML = rts.length === 0
    ? `<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-bottom:8px">Sin retrabajos asignados</div>`
    : rts.map(r => {
        let tipos;
        try { tipos = JSON.parse(r.retrabajos_seleccionados || '[]'); } catch { tipos = []; }
        if (r.retrabajo_otro) tipos.push(r.retrabajo_otro);
        return `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:8px;background:rgba(255,171,0,.07);border:1px solid rgba(255,171,0,.2);border-radius:4px">
            <span style="flex:1;font-size:12px">🔧 ${tipos.join(' · ') || 'Retrabajo'}</span>
            <button class="btn btn-sm" style="padding:3px 8px;font-size:11px;border:1px solid rgba(255,61,61,.4);color:var(--accent-red);background:transparent;cursor:pointer;border-radius:4px"
              onclick="eliminarEdRetrabajo('${r.id}')">✕</button>
          </div>`;
      }).join('');

  const tipo   = (state.tracking?.tipo_mercancia || 'textil').toLowerCase();
  const opciones = CATALOGO_RT[tipo] || CATALOGO_RT.textil;
  const btnSt  = sel => `display:inline-block;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s;border:1px solid ${sel?'#ffab00':'var(--border)'};background:${sel?'rgba(255,171,0,.15)':'var(--bg-elevated)'};color:${sel?'#ffab00':'var(--text-secondary)'};font-weight:${sel?'700':'400'}`;

  agregar.innerHTML = `
    <div style="font-size:10px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase">Agregar retrabajo</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px" id="ed-rt-botones">
      ${opciones.map(op => `<span style="${btnSt(editNuevosRTSel.has(op))}" onclick="toggleEdRT('${op.replace(/'/g, "\\'")}')">${op}</span>`).join('')}
    </div>`;
}

function toggleEdRT(tipo) {
  if (editNuevosRTSel.has(tipo)) { editNuevosRTSel.delete(tipo); }
  else { editNuevosRTSel.add(tipo); }
  const t    = (state.tracking?.tipo_mercancia || 'textil').toLowerCase();
  const opts = CATALOGO_RT[t] || CATALOGO_RT.textil;
  const btnSt = sel => `display:inline-block;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s;border:1px solid ${sel?'#ffab00':'var(--border)'};background:${sel?'rgba(255,171,0,.15)':'var(--bg-elevated)'};color:${sel?'#ffab00':'var(--text-secondary)'};font-weight:${sel?'700':'400'}`;
  const cont = document.getElementById('ed-rt-botones');
  if (cont) cont.innerHTML = opts.map(op => `<span style="${btnSt(editNuevosRTSel.has(op))}" onclick="toggleEdRT('${op.replace(/'/g, "\\'")}')">${op}</span>`).join('');
}

async function eliminarEdRetrabajo(id) {
  try {
    await API.del(`/retrabajos/${id}`);
    state.retrabajos = state.retrabajos.filter(r => r.id !== id);
    renderEdRetrabajos(editDetalleId);
    toast('Retrabajo eliminado');
  } catch(e) { toast(e.error || 'Error', 'error'); }
}

function abrirEditarDetalle(id) {
  const d = state.detalles.find(x => x.id === id);
  if (!d) return;

  editDetalleId = id;
  editDetalleFotoFiles = { etiqueta: null, insumos: null, pieza: null };
  editNuevosRTSel = new Set();

  document.getElementById('ed-id').value          = d.id;
  document.getElementById('ed-tracking-id').value = state.tracking.id;
  document.getElementById('ed-sku').value         = d.sku_code;
  document.getElementById('ed-cantidad').value    = d.cantidad || 1;
  document.getElementById('ed-desc').value        = d.descripcion || '';
  document.getElementById('ed-insumos').value     = d.insumos_real || '';
  document.getElementById('ed-calidad').value     = d.calidad || 'Buena';

  // Country dropdown
  const paisActual = d.pais_origen_real || '';
  const sel = document.getElementById('ed-pais-select');
  const opts = Array.from(sel.options).map(o => o.value);
  if (!paisActual) {
    sel.value = '';
    onEdPaisSelect('');
  } else if (opts.includes(paisActual)) {
    sel.value = paisActual;
    onEdPaisSelect(paisActual);
  } else {
    sel.value = '__other__';
    document.getElementById('ed-pais-manual').value = paisActual;
    onEdPaisSelect('__other__');
  }

  // Photos section — always visible
  const fotosSection = document.getElementById('ed-fotos-section');
  const fotosGrid    = document.getElementById('ed-fotos-grid');
  fotosSection.classList.remove('hidden');
  fotosGrid.innerHTML = renderEdFotosGrid(d);

  // Retrabajos section — only when client has the module
  const rtSection = document.getElementById('ed-retrabajos-section');
  if (parseInt(state.tracking.modulo_retrabajo) === 1) {
    rtSection.classList.remove('hidden');
    renderEdRetrabajos(id);
  } else {
    rtSection.classList.add('hidden');
  }

  openModal('modal-editar-detalle');
}

async function guardarEditarDetalle() {
  const id  = document.getElementById('ed-id').value;
  const tid = document.getElementById('ed-tracking-id').value;

  // Capture old calidad before saving to detect changes
  const oldCalidad = state.detalles.find(d => d.id === id)?.calidad || 'Buena';

  const body = {
    descripcion:      document.getElementById('ed-desc').value.trim()    || null,
    cantidad:         parseInt(document.getElementById('ed-cantidad').value) || 1,
    pais_origen_real: getEdPais() || null,
    insumos_real:     document.getElementById('ed-insumos').value.trim() || null,
    calidad:          document.getElementById('ed-calidad').value,
  };
  try {
    await API.put(`/trackings/${tid}/detalles/${id}`, body);

    // Upload any changed/new evidence photos
    const hasNewPhotos = Object.values(editDetalleFotoFiles).some(f => f);
    if (hasNewPhotos) {
      const fd = new FormData();
      if (editDetalleFotoFiles.etiqueta) fd.append('etiqueta', editDetalleFotoFiles.etiqueta);
      if (editDetalleFotoFiles.insumos)  fd.append('insumos',  editDetalleFotoFiles.insumos);
      if (editDetalleFotoFiles.pieza)    fd.append('pieza',    editDetalleFotoFiles.pieza);
      await API.postForm(`/detalles/${id}/fotos-evidencia`, fd);
    }

    // Save newly selected retrabajos
    if (editNuevosRTSel.size > 0) {
      const detalle = state.detalles.find(d => d.id === id);
      await API.post(`/trackings/${tid}/retrabajos`, {
        detalle_sku_id:          id,
        sku_code:                detalle?.sku_code     || '',
        descripcion_sku:         detalle?.descripcion  || '',
        retrabajos_seleccionados: [...editNuevosRTSel],
        retrabajo_otro:          null,
      });
    }

    closeModal('modal-editar-detalle');
    state.tracking  = await API.get(`/trackings/${tid}`);
    state.detalles  = await API.get(`/trackings/${tid}/detalles`);
    state.retrabajos = await API.get(`/trackings/${tid}/retrabajos`);
    document.getElementById('lista-skus').innerHTML = renderSKUList();
    renderInspeccion();
    toast('SKU actualizado ✓');

    // If calidad changed, prompt to reassign box
    if (body.calidad !== oldCalidad) {
      await manejarCambioCalidad();
    }
  } catch(e) { toast(e.error || 'Error al guardar', 'error'); }
}

function calcularTipoRequerido() {
  const tieneDanado   = state.errores.some(e => e.tipo_error === 'Calidad' || e.tipo_error === 'Otro')
                     || state.detalles.some(d => d.calidad === 'Mala');
  const tieneNoMarca  = state.errores.some(e => e.tipo_error === 'Mercancía ajena');
  const tieneRetrabajos = state.retrabajos.length > 0;
  if (tieneDanado && !tieneRetrabajos) return 'Damage';
  if (tieneNoMarca) return 'Non-brand merchandise';
  return 'Good Condition';
}

async function manejarCambioCalidad() {
  const tipo = calcularTipoRequerido();
  const labels = {
    'Damage':                'Dañado (Damage)',
    'Good Condition':        'Buen Estado (Good Condition)',
    'Non-brand merchandise': 'Sin Marca (Non-brand)',
  };

  if (state.tracking.caja_pallet_id) {
    // Tracking ya tiene caja asignada — ofrecer reasignación
    await abrirReasignarCaja(tipo);
  } else {
    // Tracking aún sin caja — aviso informativo
    toast(`Calidad actualizada. Al cerrar, usa una caja de tipo "${labels[tipo]}".`, 'warning');
  }
}

async function abrirReasignarCaja(tipo) {
  const labels = {
    'Damage':                'Dañado (Damage)',
    'Good Condition':        'Buen Estado (Good Condition)',
    'Non-brand merchandise': 'Sin Marca (Non-brand)',
  };
  const tk = state.tracking;

  const infoEl = document.getElementById('reasignar-info');
  if (infoEl) infoEl.textContent = `La calidad del SKU cambió — tipo de caja requerido: ${labels[tipo] || tipo}.`;

  const sel = document.getElementById('reasignar-caja-select');
  sel.innerHTML = '<option value="">— Cargando... —</option>';

  try {
    const cajas = await API.get(`/cajas?cliente_id=${tk.cliente_id}&estatus=Abierta&tipo=${encodeURIComponent(tipo)}`);
    const tipoBadge = { 'Damage': 'DMG', 'Good Condition': 'GDC', 'Non-brand merchandise': 'NBM' };
    if (cajas.length === 0) {
      sel.innerHTML = `<option value="">— Sin cajas "${tipoBadge[tipo] || tipo}" abiertas —</option>`;
    } else {
      sel.innerHTML = '<option value="">— Seleccionar caja —</option>'
        + cajas.map(c => `<option value="${c.id}">[${tipoBadge[c.tipo] || c.tipo}] ${c.nombre}${c.id === tk.caja_pallet_id ? ' (actual)' : ''}</option>`).join('');
    }
  } catch(e) {
    sel.innerHTML = '<option value="">— Error al cargar —</option>';
  }

  openModal('modal-reasignar-caja');
}

async function confirmarReasignarCaja() {
  const cajaPalletId = document.getElementById('reasignar-caja-select').value;
  if (!cajaPalletId) { toast('Selecciona una caja', 'error'); return; }
  try {
    await API.put(`/trackings/${state.tracking.id}/caja`, { caja_pallet_id: cajaPalletId });
    state.tracking = await API.get(`/trackings/${state.tracking.id}`);
    closeModal('modal-reasignar-caja');
    renderInspeccion();
    toast(`Caja reasignada a ${state.tracking.caja_id} ✓`);
  } catch(e) { toast(e.error || 'Error al reasignar', 'error'); }
}

// --- QR Foto Sesion ---
let fotoMode = 'local';
let qrSesion = null;
let qrPollInterval = null;
let qrCountdownInterval = null;
let qrExpiresMs = 0;

function setFotoMode(mode) {
  fotoMode = mode;
  document.getElementById('btn-modo-local')?.classList.toggle('active', mode === 'local');
  document.getElementById('btn-modo-qr')?.classList.toggle('active', mode === 'qr');
  document.getElementById('foto-modo-local')?.classList.toggle('hidden', mode !== 'local');
  document.getElementById('foto-modo-qr')?.classList.toggle('hidden', mode !== 'qr');
  if (mode === 'local') limpiarQR();
}

async function iniciarSesionQR() {
  limpiarQR();

  document.getElementById('qr-idle').classList.add('hidden');
  document.getElementById('qr-activo').classList.remove('hidden');
  document.getElementById('qr-recibida').classList.add('hidden');
  document.getElementById('btn-nuevo-qr').classList.add('hidden');
  document.getElementById('qr-spinner').classList.remove('hidden');

  const qrDiv = document.getElementById('qr-code-div');
  qrDiv.innerHTML = '<div class="spinner" style="width:22px;height:22px;border-width:2px;margin:24px auto"></div>';

  try {
    const sesion = await API.post('/foto-sesion', {
      tracking_id: state.tracking?.id || null,
      detalle_sku_id: document.getElementById('error-detalle-id')?.value || null,
      contexto: 'error-evidencia',
    });
    qrSesion = sesion;

    qrDiv.innerHTML = '';
    new QRCode(qrDiv, {
      text: sesion.url,
      width: 220,
      height: 220,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });

    qrExpiresMs = Date.now() + 10 * 60 * 1000;
    tickCountdown();
    qrCountdownInterval = setInterval(tickCountdown, 1000);
    qrPollInterval = setInterval(pollQR, 2000);
  } catch(e) {
    qrDiv.innerHTML = '<div style="color:var(--accent-red);padding:16px;font-size:12px">Error al generar QR. Intenta de nuevo.</div>';
    document.getElementById('btn-nuevo-qr').classList.remove('hidden');
    document.getElementById('qr-spinner').classList.add('hidden');
  }
}

function tickCountdown() {
  const remaining = Math.max(0, qrExpiresMs - Date.now());
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  const el = document.getElementById('qr-countdown');
  if (el) {
    el.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
    el.style.color = remaining < 120000 ? 'var(--accent-red)' : 'var(--text-secondary)';
  }
  if (remaining === 0) {
    clearInterval(qrCountdownInterval);
    clearInterval(qrPollInterval);
    document.getElementById('qr-spinner')?.classList.add('hidden');
    document.getElementById('btn-nuevo-qr')?.classList.remove('hidden');

      document.getElementById('qr-recibida').classList.remove('hidden');

// Catálogo de retrabajos por tipo de mercancía (espejo del backend)
const CATALOGO_RT = {
  calzado:    ['Cambio de caja', 'Limpieza', 'Reparación de caja', 'Impresión de etiqueta'],
  textil:     ['Cambio de etiqueta', 'Limpieza', 'Reparación de costura', 'Planchado', 'Re-empaque'],
  traje_bano: ['Cambio de etiqueta', 'Limpieza', 'Re-empaque', 'Revisión de elástico'],
  sombreros:  ['Cambio de etiqueta', 'Limpieza', 'Reparación de forma', 'Re-empaque'],
};

let retrabajosSel = new Set(); // retrabajos actualmente seleccionados

function renderRetrabajoBotones() {
  const tipo = (state.tracking?.tipo_mercancia || 'textil').toLowerCase();
  const opciones = CATALOGO_RT[tipo] || CATALOGO_RT.textil;
  const contenedor = document.getElementById('rt-botones');
  if (!contenedor) return;

  const btnStyle = (sel) =>
    `display:inline-block;padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer;transition:all .15s;border:1px solid ${sel ? '#ffab00' : 'var(--border)'};background:${sel ? 'rgba(255,171,0,.15)' : 'var(--bg-elevated)'};color:${sel ? '#ffab00' : 'var(--text-secondary)'};font-weight:${sel ? '700' : '400'}`;

  const botonesHtml = opciones.map(op => {
    const sel = retrabajosSel.has(op);
    return `<span style="${btnStyle(sel)}" onclick="toggleRetrabajo('${op.replace(/'/g, "\\'")}')">${op}</span>`;
  }).join('');

  const selOtro = retrabajosSel.has('__otro__');
  const otroBtn = `<span style="${btnStyle(selOtro)}" onclick="toggleRetrabajo('__otro__')">+ Otro</span>`;

  contenedor.innerHTML = botonesHtml + otroBtn;

  // Mostrar/ocultar input de "otro"
  const otroInput = document.getElementById('rt-otro-input');
  if (otroInput) otroInput.classList.toggle('hidden', !selOtro);
}

function toggleRetrabajo(tipo) {
  if (retrabajosSel.has(tipo)) {
    retrabajosSel.delete(tipo);
  } else {
    retrabajosSel.add(tipo);
  }
  renderRetrabajoBotones();
  actualizarBannerRetrabajo();
}

function actualizarBannerRetrabajo() {
  const tipoError = document.getElementById('error-tipo')?.value || 'Calidad';
  const esDanado = tipoError === 'Calidad' || tipoError === 'Otro';
  const hayRetrabajo = retrabajosSel.size > 0;
  const tieneModulo = parseInt(state.tracking?.modulo_retrabajo) === 1;

  if (esDanado && tieneModulo) {
    document.getElementById('disposicion-danados').classList.toggle('hidden', hayRetrabajo);
    document.getElementById('disposicion-retrabajo').classList.toggle('hidden', !hayRetrabajo);
  }
}

function onTipoErrorChange(tipo) {
  const esDanado = tipo === 'Calidad' || tipo === 'Otro';
  const tieneRetrabajo = parseInt(state.tracking?.modulo_retrabajo) === 1;

  // Banners
  document.getElementById('disposicion-discrepancia').classList.toggle('hidden', esDanado);
  if (esDanado && tieneRetrabajo) {
    const hayRetrabajo = retrabajosSel.size > 0;
    document.getElementById('disposicion-danados').classList.toggle('hidden', hayRetrabajo);
    document.getElementById('disposicion-retrabajo').classList.toggle('hidden', !hayRetrabajo);
  } else if (esDanado) {
    document.getElementById('disposicion-danados').classList.remove('hidden');
    document.getElementById('disposicion-retrabajo').classList.add('hidden');
  } else {
    document.getElementById('disposicion-danados').classList.add('hidden');
    document.getElementById('disposicion-retrabajo').classList.add('hidden');
  }

  // Sección de retrabajos
  const seccion = document.getElementById('seccion-retrabajos-modal');
  if (seccion) {
    seccion.classList.toggle('hidden', !(esDanado && tieneRetrabajo));
    if (!esDanado) {
      retrabajosSel.clear();
      renderRetrabajoBotones();
    }
  }
}

async function guardarError() {
  const tipo = document.getElementById('error-tipo').value;
  const desc = document.getElementById('error-desc').value.trim();
  const fotoInput = document.getElementById('error-foto');
  const detalleId = document.getElementById('error-detalle-id').value;
  const tieneRetrabajo = parseInt(state.tracking?.modulo_retrabajo) === 1;
  const esDanado = tipo === 'Calidad' || tipo === 'Otro';
  const hayRetrabajos = tieneRetrabajo && esDanado && retrabajosSel.size > 0;

  if (!desc) { toast('La descripción es requerida', 'error'); return; }

  if (fotoMode === 'qr') {
    if (!qrSesion?.url_foto) { toast('Espera a que el teléfono envíe la foto antes de guardar', 'error'); return; }
  } else {
    if (!fotoInput.files[0]) { toast('La fotografía de evidencia es requerida', 'error'); return; }
  }

  try {
    if (fotoMode === 'qr') {
      await API.post(`/trackings/${state.tracking.id}/errores-url`, {
        tipo_error: tipo,
        comentarios: desc,
        detalle_sku_id: detalleId,
        path_fotografia: qrSesion.url_foto,
      });
    } else {
      const fd = new FormData();
      fd.append('tipo_error', tipo);
      fd.append('comentarios', desc);
      fd.append('detalle_sku_id', detalleId);
      fd.append('foto', fotoInput.files[0]);
      await API.postForm(`/trackings/${state.tracking.id}/errores`, fd);
    }

    if (hayRetrabajos) {
      const detalle = state.detalles.find(d => d.id === detalleId);
      const rtSeleccionados = [...retrabajosSel].filter(r => r !== '__otro__');
      const rtOtroTexto = retrabajosSel.has('__otro__')
        ? (document.getElementById('rt-otro-texto')?.value.trim() || '')
        : '';

      await API.post(`/trackings/${state.tracking.id}/retrabajos`, {
        detalle_sku_id: detalleId,
        sku_code: detalle?.sku_code || '',
        descripcion_sku: detalle?.descripcion || '',
        retrabajos_seleccionados: rtSeleccionados,
        retrabajo_otro: rtOtroTexto || null,
      });
    }

    state.errores = await API.get(`/trackings/${state.tracking.id}/errores`);
    state.retrabajos = await API.get(`/trackings/${state.tracking.id}/retrabajos`);

    limpiarQR();
    setFotoMode('local');
    closeModal('modal-error');

    // Reset modal
    document.getElementById('error-desc').value = '';
    document.getElementById('error-foto').value = '';
    document.getElementById('foto-preview').classList.add('hidden');
    retrabajosSel.clear();

    // Si el modal se abrió tras registrar un SKU con discrepancia, limpiar el formulario ahora
    if (state.pendingReset) {
      state.pendingReset = false;
      cancelarSKU();
    }

    toast(hayRetrabajos ? 'Error registrado — pieza enviada a retrabajo ✓' : 'Error registrado con evidencia');
    renderInspeccion();
  } catch(e) {
    toast(e.error || 'Error al guardar', 'error');
  }
}

let maFotoMode = 'local';
let maSesionQR = null;
let maPollInterval = null;
let maCountdownInterval = null;
let maExpiresMs = 0;

function setMaFotoMode(mode) {
  maFotoMode = mode;
  document.getElementById('ma-btn-modo-local')?.classList.toggle('active', mode === 'local');
  document.getElementById('ma-btn-modo-qr')?.classList.toggle('active', mode === 'qr');
  document.getElementById('ma-foto-modo-local')?.classList.toggle('hidden', mode !== 'local');
  document.getElementById('ma-foto-modo-qr')?.classList.toggle('hidden', mode !== 'qr');
  if (mode === 'local') limpiarQRMA();
}

async function iniciarSesionQRMA() {
  limpiarQRMA();
  document.getElementById('ma-qr-idle').classList.add('hidden');
  document.getElementById('ma-qr-activo').classList.remove('hidden');
  document.getElementById('ma-qr-recibida').classList.add('hidden');
  document.getElementById('ma-btn-nuevo-qr').classList.add('hidden');
  document.getElementById('ma-qr-spinner').classList.remove('hidden');

  const qrDiv = document.getElementById('ma-qr-code-div');
  qrDiv.innerHTML = '<div class="spinner" style="width:22px;height:22px;border-width:2px;margin:24px auto"></div>';

  try {
    const sesion = await API.post('/foto-sesion', {
      tracking_id: state.tracking?.id || null,
      contexto: 'mercancia-ajena',
    });
    maSesionQR = sesion;

    qrDiv.innerHTML = '';
    new QRCode(qrDiv, {
      text: sesion.url,
      width: 220, height: 220,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });

    maExpiresMs = Date.now() + 10 * 60 * 1000;
    tickCountdownMA();
    maCountdownInterval = setInterval(tickCountdownMA, 1000);
    maPollInterval = setInterval(pollQRMA, 2000);
  } catch(e) {
    qrDiv.innerHTML = '<div style="color:var(--accent-red);padding:16px;font-size:12px">Error al generar QR. Intenta de nuevo.</div>';
    document.getElementById('ma-btn-nuevo-qr').classList.remove('hidden');
    document.getElementById('ma-qr-spinner').classList.add('hidden');
  }
}

function tickCountdownMA() {
  const remaining = Math.max(0, maExpiresMs - Date.now());
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  const el = document.getElementById('ma-qr-countdown');
  if (el) {
    el.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
    el.style.color = remaining < 120000 ? 'var(--accent-red)' : 'var(--text-secondary)';
  }
  if (remaining === 0) {
    clearInterval(maCountdownInterval);
    clearInterval(maPollInterval);
    document.getElementById('ma-qr-spinner')?.classList.add('hidden');
    document.getElementById('ma-btn-nuevo-qr')?.classList.remove('hidden');
  }
}

async function pollQRMA() {
  if (!maSesionQR?.token) return;
  try {
    const data = await API.get(`/foto-sesion/${maSesionQR.token}`);
    if (data.estatus === 'completada' && data.url_foto) {
      clearInterval(maPollInterval);
      clearInterval(maCountdownInterval);
      maSesionQR.url_foto = data.url_foto;
      document.getElementById('ma-qr-activo').classList.add('hidden');
      document.getElementById('ma-qr-recibida').classList.remove('hidden');
      document.getElementById('ma-foto-qr-preview').src = data.url_foto;
    }
  } catch(e) {}
}

function limpiarQRMA() {
  clearInterval(maPollInterval);
  clearInterval(maCountdownInterval);
  maPollInterval = null;
  maCountdownInterval = null;
}

function resetQRSesionMA() {
  limpiarQRMA();
  maSesionQR = null;
  document.getElementById('ma-qr-activo').classList.add('hidden');
  document.getElementById('ma-qr-recibida').classList.add('hidden');
  document.getElementById('ma-qr-idle').classList.remove('hidden');
}

// ========================
async function cerrarTracking() {
  const esG0 = parseInt(state.tracking?.grado_confianza) === 0;
  const tieneMercanciaAjena = state.errores.some(e => e.tipo_error === 'Mercancía ajena');
  if (!esG0 && state.detalles.length === 0 && !tieneMercanciaAjena) {
    toast('No se puede cerrar: registra al menos un SKU o marca el producto como "No corresponde al cliente"', 'error');
    return;
  }

  const erroresSinFoto = state.errores.filter(e => !e.path_fotografia);
  if (erroresSinFoto.length > 0) {
    toast(`Hay ${erroresSinFoto.length} error(es) sin fotografía de evidencia`, 'error');
    return;
  }

  const tk = state.tracking;
  const modalBody = document.querySelector('#modal-cierre .modal-body');

  const tieneDanado  = state.errores.some(e => e.tipo_error === 'Calidad' || e.tipo_error === 'Otro');
  const tieneNoMarca = state.errores.some(e => e.tipo_error === 'Mercancía ajena');

  let tieneRetrabajos = false;
  if (tieneDanado) {
    try {
      const rts = await API.get(`/trackings/${tk.id}/retrabajos`);
      tieneRetrabajos = rts.length > 0;
    } catch(e) {}
  }

  // Piezas dañadas con retrabajo asignado se corrigen → Good Condition
  const tipoCajaReq = (tieneDanado && !tieneRetrabajos) ? 'Damage'
    : tieneNoMarca ? 'Non-brand merchandise'
    : 'Good Condition';

  const tipoCajaLabel = { 'Damage': 'Dañado (Damage)', 'Good Condition': 'Buen Estado (Good Condition)', 'Non-brand merchandise': 'Sin Marca (Non-brand)' }[tipoCajaReq];
  const tipoCajaHint = (tieneDanado && tieneRetrabajos)
    ? 'Piezas con retrabajo asignado — se clasifican como buen estado tras corrección'
    : '';

  const tipoBadgeText = { 'Damage': 'DMG', 'Good Condition': 'GDC', 'Non-brand merchandise': 'NBM' };
  let optionsHtml = '<option value="">— Cargando... —</option>';
  try {
    const cajas = await API.get(`/cajas?cliente_id=${tk.cliente_id}&estatus=Abierta&tipo=${encodeURIComponent(tipoCajaReq)}`);
    if (cajas.length === 0) {
      optionsHtml = `<option value="">— Sin cajas "${tipoBadgeText[tipoCajaReq]}" abiertas —</option>`;
    } else {
      optionsHtml = '<option value="">— Seleccionar caja —</option>' +
        cajas.map(c => `<option value="${c.id}">[${tipoBadgeText[c.tipo]||c.tipo}] ${c.nombre}</option>`).join('');
    }
  } catch(e) {
    optionsHtml = '<option value="">— Error al cargar —</option>';
  }

  modalBody.innerHTML = `
    <p style="margin:0 0 12px;color:var(--text-secondary);font-size:14px">
      Selecciona la caja/pallet donde se guardará esta inspección. Una vez cerrado no se podrán agregar más SKUs.
    </p>
    <div style="padding:8px 12px;background:rgba(0,230,118,.07);border:1px solid rgba(0,230,118,.2);border-radius:var(--radius-sm);margin-bottom:14px;font-size:12px;color:var(--text-secondary)">
      Tipo requerido: <strong style="color:var(--text-primary)">${tipoCajaLabel}</strong>
      ${tipoCajaHint ? `<div style="margin-top:4px;color:var(--accent-amber)">${tipoCajaHint}</div>` : ''}
    </div>
    <div class="form-group">
      <label class="form-label">Caja / Pallet *</label>
      <select class="form-control form-control-mono" id="cierre-caja-select">
        ${optionsHtml}
      </select>
      <div class="form-hint"><a href="cajas.html" target="_blank" style="color:var(--accent-cyan)">Administrar cajas →</a></div>
    </div>`;

  openModal('modal-cierre');
}

}

    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Reactivar chat`;
    btn.style.color = 'var(--accent-amber)';
    btn.style.borderColor = 'rgba(255,179,0,.4)';
    if (banner) {
      banner.style.display = 'block';
      const por = chatResueltoInfo?.por || '';
      const at = chatResueltoInfo?.at ? formatDate(chatResueltoInfo.at) : '';
      banner.innerHTML = `✓ Chat resuelto por <strong>${escapeHtml(por)}</strong>${at ? ' — ' + at : ''}`;
    }
  } else {
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><polyline points="20 6 9 17 4 12"/></svg> Marcar resuelto`;
    btn.style.color = '';
    btn.style.borderColor = '';
    if (banner) banner.style.display = 'none';
  }
}

async function toggleChatResuelto() {
  const btn = document.getElementById('chat-resolve-btn');
  if (btn) btn.disabled = true;
  try {
    const result = await API.post(`/trackings/${chatInitializedFor}/chat-resuelto`, {});
    chatResuelto = result.resuelto;
    chatResueltoInfo = result.resuelto ? { por: result.nombre, at: result.at } : null;
    updateChatResolvedUI();
    toast(result.resuelto ? 'Chat marcado como resuelto' : 'Chat reactivado', 'success');
  } catch(e) {
    toast('Error al cambiar estado del chat', 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function initChat(trackingId) {
  if (chatInitializedFor === trackingId) {
    // Re-render sin reiniciar polling — solo refrescar comentarios en la nueva DOM
    const box = document.getElementById('chat-mensajes');
    if (box && chatUltimosIds.size > 0) {
      loadComentarios(trackingId, true);
    }
    updateChatResolvedUI();
    return;
  }
  chatInitializedFor = trackingId;
  chatResuelto = !!state.tracking?.chat_resuelto;
  chatResueltoInfo = chatResuelto ? { por: state.tracking?.chat_resuelto_por, at: state.tracking?.chat_resuelto_at } : null;
  if (chatPollingInterval) clearInterval(chatPollingInterval);
  chatUltimosIds = new Set();
  loadComentarios(trackingId, true);
  chatPollingInterval = setInterval(() => loadComentarios(trackingId, false), 10000);
  loadHistorialCorreos();
  const liveEl = document.getElementById('chat-live-indicator');
  if (liveEl) liveEl.style.display = 'flex';
  setTimeout(updateChatResolvedUI, 0);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && chatTituloAlerta) {
      document.title = chatTituloOriginal;
      chatTituloAlerta = false;
    }
  });

  if (scrollChatParam === 'chat' && !chatScrollDone) {
    chatScrollDone = true;
    setTimeout(() => {
      const sec = document.getElementById('chat-section');
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 500);
  }
}

async function loadComentarios(trackingId, inicial) {
  try {
    const comentarios = await API.get(`/trackings/${trackingId}/comentarios`);
    window._chatMensajes = comentarios;
    const nuevos = inicial
      ? comentarios
      : comentarios.filter(c => !chatUltimosIds.has(c.id));

    comentarios.forEach(c => chatUltimosIds.add(c.id));

    const box = document.getElementById('chat-mensajes');
    if (!box) return;

    if (inicial) {
      box.innerHTML = comentarios.length === 0
        ? `<div style="text-align:center;color:var(--text-muted);font-size:12px;padding:30px 0">Sin comentarios aún. ¡Sé el primero!</div>`
        : comentarios.map(c => renderMensaje(c)).join('');
      box.scrollTop = box.scrollHeight;
      return;
    }

    if (nuevos.length > 0) {
      const estaAbajo = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
      const vacios = box.querySelector('[style*="Sin comentarios"]');
      if (vacios) box.innerHTML = '';
      nuevos.forEach(c => {
        box.insertAdjacentHTML('beforeend', renderMensaje(c));
      });
      if (estaAbajo) box.scrollTop = box.scrollHeight;
      if (document.hidden) {
        document.title = `💬 Nuevo mensaje — ${state.tracking?.tracking_number || ''}`;
        chatTituloAlerta = true;
      }
    }
  } catch(e) {}
}

function renderMensaje(c) {
  const esPropio = c.usuario_id === (_pageUser?.id || '');
  const iniciales = c.nombre_usuario.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
  const color = ROL_AVATAR_COLORS[c.rol_usuario] || '#607d8b';
  const rolLabel = { ADMIN:'Admin', SUPERVISOR:'Supervisor', OPERADOR:'Operador', CLIENTE:'Cliente', LOGISTICA:'Logística' }[c.rol_usuario] || c.rol_usuario;
  const fecha = formatDate(c.created_at);

  return `<div class="chat-msg" style="display:flex;gap:8px;align-items:flex-start;${esPropio ? 'flex-direction:row-reverse' : ''}">
    <div class="chat-avatar" style="background:${color}">${iniciales}</div>
    <div style="display:flex;flex-direction:column;gap:3px;${esPropio ? 'align-items:flex-end' : ''}">
      <div style="display:flex;align-items:center;gap:6px;${esPropio ? 'flex-direction:row-reverse' : ''}">
        <span style="font-size:12px;font-weight:600;color:var(--text-primary)">${c.nombre_usuario}</span>
        <span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:${color}22;color:${color};font-family:'IBM Plex Mono',monospace">${rolLabel}</span>
      </div>
      <div class="chat-bubble${esPropio ? ' own' : ''}">
        <div style="font-size:13px;color:var(--text-primary);white-space:pre-wrap;word-break:break-word">${escapeHtml(c.mensaje)}</div>
      </div>
      <div style="font-size:10px;color:var(--text-muted)">${fecha}</div>
    </div>
  </div>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendComentario();
  }
}

async function sendComentario() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const mensaje = input.value.trim();
  if (!mensaje) return;

  const btn = input.nextElementSibling;
  if (btn) btn.disabled = true;
  input.disabled = true;

  try {
    const result = await API.post(`/trackings/${state.tracking.id}/comentarios`, { mensaje });
    input.value = '';
    input.style.height = 'auto';
    if (result.reactivado) {
      chatResuelto = false;
      chatResueltoInfo = null;
      updateChatResolvedUI();
      toast('Chat reactivado automáticamente', 'info');
    }
    await loadComentarios(state.tracking.id, false);
    const box = document.getElementById('chat-mensajes');
    if (box) box.scrollTop = box.scrollHeight;
  } catch(e) {
    toast('Error al enviar comentario', 'error');
  } finally {
    input.disabled = false;
    if (btn) btn.disabled = false;
    input.focus();
  }
}

// ========================
// INIT
// ========================
init();

// ========================
// ENVIAR POR CORREO
// ========================
let emailChips = [];

function handleChipKey(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    addEmailChipFromInput();
  }
  if (e.key === 'Backspace' && e.target.value === '' && emailChips.length > 0) {
    removeEmailChip(emailChips.length - 1);
  }
}

function addEmailChipFromInput() {
  const input = document.getElementById('email-chip-input');
  const email = (input?.value || '').trim().replace(/,$/, '');
  if (!email) return;
  const errEl = document.getElementById('email-chips-error');
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRe.test(email)) {
    errEl.textContent = `"${escHf(email)}" no es un email válido`;
    errEl.style.display = 'block'; return;
  }
  if (emailChips.includes(email)) {
    errEl.textContent = `"${escHf(email)}" ya fue agregado`;
    errEl.style.display = 'block'; return;
  }
  if (emailChips.length >= 10) {
    errEl.textContent = 'Máximo 10 destinatarios';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';
  emailChips.push(email);
  input.value = '';
  renderEmailChips();
}

function removeEmailChip(idx) {
  emailChips.splice(idx, 1);
  renderEmailChips();
}

function renderEmailChips() {
  const el = document.getElementById('email-chips');
  if (!el) return;
  el.innerHTML = emailChips.map((email, i) => `
    <span style="display:inline-flex;align-items:center;gap:4px;background:rgba(0,230,118,.1);color:var(--accent-green);border:1px solid rgba(0,230,118,.25);border-radius:4px;padding:3px 8px;font-size:12px;font-family:'IBM Plex Mono',monospace">
      ${escHf(email)}
      <button onclick="removeEmailChip(${i})" style="background:none;border:none;color:inherit;cursor:pointer;padding:0;line-height:1;font-size:15px;opacity:.7" title="Eliminar">×</button>
    </span>`).join('');
}

function escHf(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateCorreoPreview() {
  const sel = document.getElementById('correo-comentarios')?.value;
  const total = (window._chatMensajes || []).length;
  const n = sel === 'todos' ? total : Math.min(parseInt(sel) || 10, total);
  const el = document.getElementById('correo-comentarios-preview');
  if (el) el.textContent = `Se incluirán ${n} comentario${n !== 1 ? 's' : ''} de ${total} totales`;
}

function abrirEnviarCorreo() {
  emailChips = [];
  renderEmailChips();
  const chipInput = document.getElementById('email-chip-input');
  if (chipInput) chipInput.value = '';
  const errEl = document.getElementById('email-chips-error');
  if (errEl) errEl.style.display = 'none';
  const asuntoEl = document.getElementById('correo-asunto');
  if (asuntoEl) asuntoEl.value = `Seguimiento: Tracking ${state.tracking?.tracking_number || ''} — ${state.tracking?.cliente_nombre || ''}`;
  const msgEl = document.getElementById('correo-mensaje');
  if (msgEl) msgEl.value = '';
  const cntEl = document.getElementById('correo-mensaje-count');
  if (cntEl) cntEl.textContent = '0';
  const selEl = document.getElementById('correo-comentarios');
  if (selEl) selEl.value = '10';
  const errCorreo = document.getElementById('correo-error');
  if (errCorreo) errCorreo.style.display = 'none';
  const btn = document.getElementById('btn-enviar-correo');
  if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Enviar correo'; }
  updateCorreoPreview();
  openModal('modal-enviar-correo');
}

async function enviarCorreo() {
  const btn = document.getElementById('btn-enviar-correo');
  if (btn?.disabled) return;
  addEmailChipFromInput();
  const errEl = document.getElementById('correo-error');
  errEl.style.display = 'none';
  if (emailChips.length === 0) {
    errEl.textContent = 'Agrega al menos un destinatario';
    errEl.style.display = 'block'; return;
  }
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px"></span>Enviando…'; }
  try {
    const sel = document.getElementById('correo-comentarios').value;
    const result = await API.post(`/trackings/${state.tracking.id}/enviar-correo`, {
      destinatarios: emailChips,
      asunto: (document.getElementById('correo-asunto').value || '').trim() || undefined,
      mensaje_adicional: (document.getElementById('correo-mensaje').value || '').trim() || undefined,
      incluir_comentarios: sel,
    });
    closeModal('modal-enviar-correo');
    toast(`Correo enviado a ${result.enviados} destinatario${result.enviados !== 1 ? 's' : ''} ✓`);
    loadHistorialCorreos();
  } catch(e) {
    errEl.textContent = e.error || 'Error al enviar el correo';
    errEl.style.display = 'block';
    if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Enviar correo'; }
  }
}

// Historial de correos (ADMIN / SUPERVISOR only)
let _historialVisible = false;
let _historialData = [];

async function loadHistorialCorreos() {
  if (!['ADMIN','SUPERVISOR'].includes(_pageUser?.rol)) return;
  if (!state.tracking?.id) return;
  try {
    _historialData = await API.get(`/trackings/${state.tracking.id}/correos-enviados`);
    renderHistorialCorreos();
  } catch(e) {}
}

function toggleHistorialCorreos() {
  _historialVisible = !_historialVisible;
  renderHistorialCorreos();
}

function renderHistorialCorreos() {
  const link = document.getElementById('historial-correos-link');
  const sec  = document.getElementById('historial-correos-section');
  if (!link || !sec) return;
  const n = _historialData.length;
  link.textContent = `${_historialVisible ? '▴' : '▾'} Ver historial de correos enviados (${n})`;
  if (!_historialVisible) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  if (n === 0) { sec.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:6px 0">Sin correos enviados aún.</div>'; return; }
  sec.innerHTML = _historialData.map(c => {
    const dests = c.destinatarios || [];
    const show  = dests.slice(0,2).join(', ') + (dests.length > 2 ? ` +${dests.length - 2} más` : '');
    return `<div style="padding:7px 0;border-bottom:1px solid var(--border);font-size:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:2px">
        <span style="color:var(--text-secondary);font-weight:600">${escHf(c.nombre_usuario)}</span>
        <span style="color:var(--text-muted);font-family:'IBM Plex Mono',monospace;font-size:11px">${escHf(c.created_at)}</span>
      </div>
      <div style="color:var(--text-muted)">→ ${escHf(show)}</div>
    </div>`;
  }).join('');
}
</script>
