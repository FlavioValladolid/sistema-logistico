let skusData = [];
let clientesData = [];
let csvRows = [];
let filteredSkus = [];
let currentPage = 1;
let pageSize = 50;

async function loadAll() {
  const [clientes, skus] = await Promise.all([API.get('/clientes'), API.get('/skus')]);
  clientesData = clientes;
  skusData = skus;

  const opts = clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');

  // Preserve current filter selection before replacing options
  const filtroEl = document.getElementById('filtro-cliente');
  const prevCliente = filtroEl.value;
  filtroEl.innerHTML = '<option value="">— Todos los clientes —</option>' + opts;
  if (prevCliente) filtroEl.value = prevCliente;

  document.getElementById('sku-cliente').innerHTML = opts;
  document.getElementById('imp-cliente').innerHTML = '<option value="">— Seleccionar cliente —</option>' + opts;

  applyFilters();
}

function renderTabla() {
  const el = document.getElementById('tabla-skus');
  if (filteredSkus.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📋</div>
        <div class="empty-state-title">Sin SKUs registrados</div>
        <div class="empty-state-text">Agrega productos al catálogo para habilitar la inspección</div>
      </div>`;
    return;
  }

  const totalPages = Math.ceil(filteredSkus.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * pageSize;
  const end = Math.min(start + pageSize, filteredSkus.length);
  const pageData = filteredSkus.slice(start, end);

  // Pagination numbers: always show first, last, and ±2 around current
  function paginationHtml() {
    if (totalPages <= 1) return '';
    const pages = new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1, currentPage - 2, currentPage + 2]);
    const sorted = [...pages].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);
    let html = '';
    let prev = 0;
    for (const p of sorted) {
      if (prev && p - prev > 1) html += `<span style="padding:0 4px;color:var(--text-muted)">…</span>`;
      html += `<button onclick="goToPage(${p})" style="min-width:30px;height:28px;padding:0 6px;border-radius:4px;border:1px solid ${p === currentPage ? 'var(--accent-cyan)' : 'var(--border)'};background:${p === currentPage ? 'rgba(0,188,212,.15)' : 'transparent'};color:${p === currentPage ? 'var(--accent-cyan)' : 'var(--text-secondary)'};font-size:12px;cursor:${p === currentPage ? 'default' : 'pointer'};font-family:'IBM Plex Mono',monospace">${p}</button>`;
      prev = p;
    }
    return html;
  }

  el.innerHTML = `
    <div class="table-wrapper" style="border:none">
      <table>
        <thead>
          <tr>
            <th>Código SKU</th>
            <th>UPC Code</th>
            <th>Descripción</th>
            <th>Cliente</th>
            <th>País Origen</th>
            <th>Insumos</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${pageData.map(s => {
            const cliente = clientesData.find(c => c.id === s.cliente_id);
            return `
              <tr>
                <td class="td-mono" style="color:var(--accent-cyan);font-weight:600">${s.sku_code}</td>
                <td class="td-mono">${s.upc_code || '—'}</td>
                <td>${s.descripcion || '—'}</td>
                <td>${cliente?.nombre || '—'}</td>
                <td>${s.pais_origen || '—'}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.insumos || '—'}</td>
                <td>
                  <div class="td-actions">
                    <button class="btn btn-secondary btn-sm" onclick="editarSKU('${s.id}')">Editar</button>
                    <button class="btn btn-danger btn-sm" onclick="eliminarSKU('${s.id}','${s.sku_code}')">Eliminar</button>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
    ${totalPages > 1 ? `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px">
      <span style="font-size:12px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace">
        Mostrando ${start + 1}–${end} de ${filteredSkus.length} SKUs
      </span>
      <div style="display:flex;align-items:center;gap:4px">
        <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="btn btn-ghost btn-sm" style="padding:0 10px;height:28px;font-size:12px">← Anterior</button>
        ${paginationHtml()}
        <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="btn btn-ghost btn-sm" style="padding:0 10px;height:28px;font-size:12px">Siguiente →</button>
      </div>
    </div>
    ` : `
    <div style="padding:8px 16px;border-top:1px solid var(--border)">
      <span style="font-size:12px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace">${filteredSkus.length} SKUs</span>
    </div>
    `}
  `;
}

function goToPage(p) {
  const totalPages = Math.ceil(filteredSkus.length / pageSize);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderTabla();
  document.getElementById('tabla-skus').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function changePageSize(val) {
  pageSize = parseInt(val);
  currentPage = 1;
  renderTabla();
}

function abrirNuevo() {
  document.getElementById('sku-id').value = '';
  document.getElementById('sku-code').value = '';
  document.getElementById('sku-upc').value = '';
  document.getElementById('sku-desc').value = '';
  document.getElementById('sku-pais').value = '';
  document.getElementById('sku-insumos').value = '';
  document.getElementById('modal-sku-title').textContent = 'Nuevo SKU';
  openModal('modal-sku');
}

function editarSKU(id) {
  const s = skusData.find(x => x.id === id);
  if (!s) return;
  document.getElementById('sku-id').value = s.id;
  document.getElementById('sku-cliente').value = s.cliente_id;
  document.getElementById('sku-code').value = s.sku_code;
  document.getElementById('sku-upc').value = s.upc_code || '';
  document.getElementById('sku-desc').value = s.descripcion || '';
  document.getElementById('sku-pais').value = s.pais_origen || '';
  document.getElementById('sku-insumos').value = s.insumos || '';
  document.getElementById('modal-sku-title').textContent = 'Editar SKU';
  openModal('modal-sku');
}

async function guardarSKU() {
  const id = document.getElementById('sku-id').value;
  const payload = {
    cliente_id: document.getElementById('sku-cliente').value,
    sku_code: document.getElementById('sku-code').value.trim().toUpperCase(),
    upc_code: document.getElementById('sku-upc').value.trim() || null,
    descripcion: document.getElementById('sku-desc').value.trim(),
    pais_origen: document.getElementById('sku-pais').value.trim(),
    insumos: document.getElementById('sku-insumos').value.trim(),
  };
  if (!payload.sku_code || !payload.cliente_id) {
    toast('Código SKU y cliente son requeridos', 'error'); return;
  }
  try {
    if (id) { await API.put(`/skus/${id}`, payload); toast('SKU actualizado'); }
    else { await API.post('/skus', payload); toast('SKU creado'); }
    closeModal('modal-sku');
    loadAll();
  } catch(e) { toast(e.error || 'Error al guardar', 'error'); }
}

async function eliminarSKU(id, code) {
  const ok = await confirm(`¿Eliminar SKU "${code}"?`, 'Eliminar SKU');
  if (!ok) return;
  try { await API.del(`/skus/${id}`); toast('SKU eliminado'); loadAll(); }
  catch(e) { toast(e.error || 'Error', 'error'); }
}

document.getElementById('btn-nuevo-sku').onclick = abrirNuevo;

document.getElementById('btn-descargar-layout').onclick = function() {
  const header = 'sku_code,upc_code,descripcion,pais_origen,insumos';
  const ejemplo = [
    'SKU-EJEMPLO-001,012345678905,Camisa Básica,China,100% Algodón',
    'SKU-EJEMPLO-002,012345678912,Pantalón Slim,Bangladesh,65% Poliéster 35% Algodón',
    'SKU-EJEMPLO-003,012345678929,Vestido Floral,Vietnam,100% Viscosa',
  ].join('\n');
  const csv = header + '\n' + ejemplo;
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'layout_skus.csv'; a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('btn-cargar-skus').onclick = function() {
  csvRows = [];
  document.getElementById('imp-archivo').value = '';
  document.getElementById('imp-preview').classList.add('hidden');
  document.getElementById('imp-alert').innerHTML = '';
  document.getElementById('imp-progress').style.display = 'none';
  document.getElementById('imp-progress-bar').style.width = '0%';
  document.getElementById('imp-progress-bar').style.background = 'var(--accent-cyan)';
  document.getElementById('btn-importar').disabled = true;
  document.getElementById('btn-cancelar-importar').disabled = false;
  openModal('modal-importar');
};

function splitCSVLine(line) {
  const cols = [];
  let cur = '', inQ = false;
  for (let c = 0; c < line.length; c++) {
    if (line[c] === '"') { inQ = !inQ; }
    else if (line[c] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
    else { cur += line[c]; }
  }
  cols.push(cur.trim());
  return cols;
}

function parseCSV(text) {
  // Strip BOM if present
  const clean = text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
  const lines = clean.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  const rows = [];
  // Find first non-empty line and skip it (header)
  let dataStart = 0;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].trim()) { dataStart = i + 1; break; }
  }
  for (let i = dataStart; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = splitCSVLine(line);
    const sku_code = cols[0] || '';
    if (!sku_code) continue;
    rows.push({ sku_code, upc_code: cols[1] || '', descripcion: cols[2] || '', pais_origen: cols[3] || '', insumos: cols[4] || '' });
  }
  return rows;
}

function previewCSV(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('imp-alert').innerHTML = '';
  const reader = new FileReader();
  reader.onload = function(e) {
    csvRows = parseCSV(e.target.result);
    const tbody = document.getElementById('imp-tbody');
    tbody.innerHTML = csvRows.map(r => `
      <tr>
        <td style="padding:5px 10px;font-family:monospace;color:var(--accent-cyan)">${r.sku_code}</td>
        <td style="padding:5px 10px;font-family:monospace">${r.upc_code || '—'}</td>
        <td style="padding:5px 10px">${r.descripcion || '—'}</td>
        <td style="padding:5px 10px">${r.pais_origen || '—'}</td>
        <td style="padding:5px 10px">${r.insumos || '—'}</td>
      </tr>
    `).join('');
    document.getElementById('imp-count').textContent = csvRows.length;
    document.getElementById('imp-preview').classList.toggle('hidden', csvRows.length === 0);
    document.getElementById('btn-importar').disabled = csvRows.length === 0;

    let alertHtml = '';
    if (csvRows.length === 0) {
      alertHtml = '<div class="alert alert-error" style="margin-top:10px">No se encontraron filas válidas. Verifica que el archivo sea el layout descargado con datos en las filas.</div>';
    } else {
      // Detectar UPCs duplicados dentro del archivo
      const upcCount = {};
      csvRows.forEach(r => {
        const upc = (r.upc_code || '').trim();
        if (upc) upcCount[upc] = (upcCount[upc] || 0) + 1;
      });
      const upcsDuplicados = Object.entries(upcCount).filter(([, n]) => n > 1);
      if (upcsDuplicados.length > 0) {
        const maxMostrar = 10;
        const lista = upcsDuplicados.slice(0, maxMostrar)
          .map(([upc, n]) => `<span style="font-family:'IBM Plex Mono',monospace;background:rgba(255,179,0,.12);padding:1px 6px;border-radius:3px">${upc}</span> ×${n}`)
          .join(' &nbsp; ');
        const resto = upcsDuplicados.length > maxMostrar ? `<div style="margin-top:4px;color:var(--text-muted)">…y ${upcsDuplicados.length - maxMostrar} más</div>` : '';
        alertHtml = `
          <div style="margin-top:10px;padding:10px 14px;border-radius:6px;border:1px solid rgba(255,179,0,.4);background:rgba(255,179,0,.08)">
            <div style="font-size:12px;font-weight:700;color:var(--accent-amber);margin-bottom:6px">
              ⚠ ${upcsDuplicados.length} UPC${upcsDuplicados.length > 1 ? 's duplicados' : ' duplicado'} en el archivo
            </div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.8">${lista}</div>
            ${resto}
            <div style="font-size:11px;color:var(--text-muted);margin-top:6px">Solo se importará la primera aparición de cada UPC duplicado.</div>
          </div>`;
      }
    }
    document.getElementById('imp-alert').innerHTML = alertHtml;
  };
  reader.onerror = function() {
    document.getElementById('imp-alert').innerHTML =
      '<div class="alert alert-error" style="margin-top:10px">No se pudo leer el archivo. Asegúrate de seleccionar un archivo CSV.</div>';
  };
  reader.readAsText(file, 'UTF-8');
}

async function importarCSV() {
  const clienteId = document.getElementById('imp-cliente').value;
  if (!clienteId) { toast('Selecciona un cliente', 'error'); return; }
  if (!csvRows.length) return;

  const BATCH = 500;
  const total = csvRows.length;
  let procesados = 0;
  let totalInsertados = 0;
  let totalActualizados = 0;
  let totalOmitidos = 0;

  document.getElementById('btn-importar').disabled = true;
  document.getElementById('btn-cancelar-importar').disabled = true;
  document.getElementById('imp-alert').innerHTML = '';
  document.getElementById('imp-progress').style.display = 'block';

  function setProgress(pct, detalle) {
    document.getElementById('imp-progress-bar').style.width = pct + '%';
    document.getElementById('imp-progress-pct').textContent = pct + '%';
    document.getElementById('imp-progress-text').textContent = `Procesando lote…`;
    document.getElementById('imp-progress-detail').textContent = detalle;
  }

  try {
    for (let i = 0; i < csvRows.length; i += BATCH) {
      const lote = csvRows.slice(i, i + BATCH);
      const res = await API.post('/skus/importar', { cliente_id: clienteId, skus: lote });
      totalInsertados += res.insertados || 0;
      totalActualizados += res.actualizados || 0;
      totalOmitidos += res.omitidos || 0;
      procesados += lote.length;
      const pct = Math.round(procesados / total * 100);
      setProgress(pct, `${procesados.toLocaleString()} de ${total.toLocaleString()} filas — ${totalInsertados.toLocaleString()} nuevos, ${totalActualizados.toLocaleString()} actualizados, ${totalOmitidos.toLocaleString()} omitidos`);
    }

    document.getElementById('imp-progress-text').textContent = '¡Importación completada!';
    document.getElementById('imp-progress-bar').style.background = 'var(--accent-green)';
    await new Promise(r => setTimeout(r, 800));
    const partes = [];
    if (totalInsertados) partes.push(`${totalInsertados.toLocaleString()} nuevos`);
    if (totalActualizados) partes.push(`${totalActualizados.toLocaleString()} actualizados`);
    if (totalOmitidos) partes.push(`${totalOmitidos.toLocaleString()} omitidos`);
    toast(`Importación completada: ${partes.join(', ')}`);
    closeModal('modal-importar');
    loadAll();
  } catch(e) {
    const msg = e?.error || e?.message || 'Error al comunicarse con el servidor. Verifica que el servidor esté corriendo.';
    document.getElementById('imp-alert').innerHTML = `<div class="alert alert-error" style="margin-top:10px">${msg}</div>`;
    document.getElementById('imp-progress').style.display = 'none';
    document.getElementById('btn-importar').disabled = false;
    document.getElementById('btn-cancelar-importar').disabled = false;
  }
}

document.getElementById('search-sku').addEventListener('input', applyFilters);
document.getElementById('filtro-cliente').addEventListener('change', applyFilters);

function applyFilters() {
  const q = document.getElementById('search-sku').value.toLowerCase();
  const clienteId = document.getElementById('filtro-cliente').value;
  filteredSkus = skusData.filter(s => {
    const matchQ = !q || s.sku_code.toLowerCase().includes(q) || (s.descripcion||'').toLowerCase().includes(q);
    const matchC = !clienteId || s.cliente_id === clienteId;
    return matchQ && matchC;
  });
  currentPage = 1;
  renderTabla();
}

loadAll();
</script>
