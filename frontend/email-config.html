<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Config. Email — Sistema Logístico</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
const _pageUser = checkAuth(['ADMIN']);
buildShell('Config. Email', 'Config. Email', '', _pageUser);

async function init() {
  document.getElementById('page-content').innerHTML = `
    <div class="page-header">
      <div>
        <div class="breadcrumb">SISTEMA / CONFIG. EMAIL</div>
        <h1 class="page-title">Configuración de Email</h1>
        <p class="page-subtitle">API Key de Resend y resumen semanal automático</p>
      </div>
    </div>

    <div style="max-width:640px">

      <!-- Resend API Key Card -->
      <div class="card mb-16">
        <div class="card-header">
          <span class="card-title">Resend API Key</span>
          <span id="resend-status" class="badge badge-muted" style="margin-left:auto">Cargando...</span>
        </div>
        <div style="padding:20px;display:flex;flex-direction:column;gap:16px">

          <div>
            <label class="form-label">API Key</label>
            <div style="position:relative">
              <input id="resend-api-key" type="password" class="form-control" placeholder="re_xxxxxxxxxxxxxxxxxxxxxxxxxxxx" style="padding-right:44px">
              <button onclick="toggleApiKey()" type="button" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div id="key-hint" style="font-size:11px;color:var(--text-muted);margin-top:4px"></div>
          </div>

          <div style="background:var(--bg-elevated);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:var(--text-muted);line-height:1.6">
            El remitente será: <strong style="color:var(--text-secondary)">Retornos &lt;onboarding@resend.dev&gt;</strong>
            hasta que se verifique un dominio propio en Resend.
          </div>

          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-primary" onclick="guardarConfig()" id="btn-guardar">Guardar API Key</button>
          </div>
        </div>
      </div>

      <!-- Resumen semanal Card -->
      <div class="card mb-16">
        <div class="card-header">
          <span class="card-title">Resumen Semanal Automático</span>
          <span class="badge badge-green" style="margin-left:auto">Activo</span>
        </div>
        <div style="padding:20px;display:flex;flex-direction:column;gap:16px">

          <div style="background:var(--bg-elevated);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between">
              <span style="font-size:13px;color:var(--text-muted)">Frecuencia</span>
              <span style="font-size:13px;font-weight:600">Lunes 8:00 AM</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="font-size:13px;color:var(--text-muted)">Zona horaria</span>
              <span style="font-size:13px;font-weight:600">America/Tijuana</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="font-size:13px;color:var(--text-muted)">Destinatarios</span>
              <span style="font-size:13px;font-weight:600">ADMIN y SUPERVISOR activos</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="font-size:13px;color:var(--text-muted)">Contenido</span>
              <span style="font-size:13px;font-weight:600">Trackings · Piezas · Errores · Top clientes</span>
            </div>
          </div>

          <div id="destinatarios-lista">
            <div style="font-size:12px;color:var(--text-muted)">Cargando destinatarios...</div>
          </div>

          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-primary" onclick="enviarPrueba()" id="btn-enviar-prueba">
              Enviar resumen de prueba ahora
            </button>
          </div>
          <div id="prueba-resultado"></div>
        </div>
      </div>

      <!-- Ayuda Resend -->
      <div class="card mb-16">
        <div class="card-header"><span class="card-title">Cómo obtener tu API Key de Resend</span></div>
        <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
          <p style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin:0">
            Resend es un servicio de email transaccional. La cuenta gratuita incluye 3,000 emails/mes.
          </p>
          <ol style="font-size:12px;color:var(--text-muted);line-height:2;margin:0;padding-left:20px">
            <li>Crea una cuenta en <strong>resend.com</strong></li>
            <li>Ve a <strong>API Keys → Create API Key</strong></li>
            <li>Copia la clave (empieza con <code>re_</code>)</li>
            <li>Pégala en el campo de arriba y guarda</li>
          </ol>
          <div style="background:var(--bg-elevated);border-radius:var(--radius-sm);padding:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;display:flex;flex-direction:column;gap:4px">
            <div><span style="color:var(--text-muted)">Remitente: </span>onboarding@resend.dev</div>
            <div><span style="color:var(--text-muted)">Plan gratis: </span>3,000 emails/mes · 100/día</div>
          </div>
        </div>
      </div>

    </div>
  `;

  await cargarConfig();
  await cargarDestinatarios();
}

function toggleApiKey() {
  const inp = document.getElementById('resend-api-key');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function cargarConfig() {
  try {
    const data = await API.get('/email/config');
    const hint  = document.getElementById('key-hint');
    const badge = document.getElementById('resend-status');

    hint.textContent = data.RESEND_API_KEY_SET
      ? 'API Key guardada. Dejar vacío para mantenerla.'
      : 'Sin API Key configurada.';

    badge.textContent = data.RESEND_API_KEY_SET ? 'Configurado' : 'Sin configurar';
    badge.className   = 'badge ' + (data.RESEND_API_KEY_SET ? 'badge-green' : 'badge-amber');
  } catch(e) {
    toast('Error cargando configuración', 'error');
  }
}

async function cargarDestinatarios() {
  try {
    const usuarios = await API.get('/usuarios');
    const dests = usuarios.filter(u => ['ADMIN','SUPERVISOR'].includes(u.rol) && u.activo);
    const el = document.getElementById('destinatarios-lista');
    if (!dests.length) {
      el.innerHTML = `<div class="alert alert-warning" style="font-size:12px">Sin usuarios ADMIN o SUPERVISOR activos.</div>`;
      return;
    }
    el.innerHTML = `
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Destinatarios (${dests.length})</div>
      ${dests.map(u => `
        <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg-elevated);border-radius:var(--radius-sm);margin-bottom:4px">
          <span style="font-size:10px;font-weight:700;color:${u.rol==='ADMIN'?'#e74c3c':'#e67e22'};min-width:70px">${u.rol}</span>
          <span style="font-size:13px">${u.nombre}</span>
          <span style="font-size:11px;color:var(--text-muted);margin-left:auto;font-family:'IBM Plex Mono',monospace">${u.email}</span>
        </div>
      `).join('')}
    `;
  } catch(e) {}
}

async function guardarConfig() {
  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const key = document.getElementById('resend-api-key').value.trim();
    if (!key) { toast('Ingresa una API Key', 'error'); return; }
    await API.put('/email/config', { RESEND_API_KEY: key });
    document.getElementById('resend-api-key').value = '';
    toast('API Key guardada', 'success');
    cargarConfig();
  } catch(e) {
    toast(e.error || 'Error al guardar', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar API Key';
  }
}

async function enviarPrueba() {
  const btn = document.getElementById('btn-enviar-prueba');
  const res = document.getElementById('prueba-resultado');
  btn.disabled = true; btn.textContent = 'Enviando...';
  res.innerHTML = '';
  try {
    await API.post('/email/test-semanal', {});
    res.innerHTML = `<div class="alert alert-success" style="font-size:12px;margin-top:8px">✓ Resumen enviado correctamente a todos los destinatarios.</div>`;
  } catch(e) {
    res.innerHTML = `<div class="alert alert-error" style="font-size:12px;margin-top:8px">Error: ${e.error || 'No se pudo enviar. Verifica la API Key de Resend.'}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar resumen de prueba ahora';
  }
}

init();
</script>
</body>
</html>
