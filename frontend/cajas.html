<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajas / Pallets — Sistema Logístico</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
const _pageUser = checkAuth();
buildShell('Cajas / Pallets', 'ADMINISTRACIÓN / CAJAS Y PALLETS', `
  <button class="btn btn-primary btn-sm" id="btn-nueva-caja">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Nueva Caja/Pallet
  </button>
`, _pageUser);

document.getElementById('page-content').innerHTML = `
  <div class="flex justify-between items-center mb-24">
    <div>
      <h1 class="page-title">Gestión de Cajas / Pallets</h1>
      <p class="page-subtitle">Administra las cajas y pallets de almacenamiento por cliente</p>
    </div>
  </div>

  <div class="card">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <span class="card-title">Cajas / Pallets</span>
      <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap">
        <select class="form-control" id="filtro-cliente" style="width:180px" onchange="applyFilters()">
          <option value="">Todos los clientes</option>
        </select>
        <select class="form-control" id="filtro-tipo" style="width:180px" onchange="applyFilters()">
          <option value="">Todos los tipos</option>
          <option value="Damage">Damage</option>
          <option value="Good Condition">Good Condition</option>
          <option value="Non-brand merchandise">Non-brand merchandise</option>
        </select>
        <select class="form-control" id="filtro-estatus" style="width:140px" onchange="applyFilters()">
          <option value="">Todos los estatus</option>
          <option value="Abierta">Abierta</option>
          <option value="Cerrada">Cerrada</option>
        </select>
      </div>
    </div>
    <div id="tabla-cajas">
      <div class="text-center" style="padding:32px"><div class="spinner"></div></div>
    </div>
  </div>
`;

// Modal: crear caja
document.body.insertAdjacentHTML('beforeend', `
  <div id="modal-caja" class="modal-overlay">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <span class="modal-title">Nueva Caja / Pallet</span>
        <button class="modal-close" onclick="closeModal('modal-caja')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Cliente *</label>
          <select class="form-control" id="cj-cliente" onchange="previewNombre()">
            <option value="">— Seleccionar cliente —</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tipo *</label>
          <select class="form-control" id="cj-tipo" onchange="previewNombre()">
            <option value="">— Seleccionar tipo —</option>
            <option value="Damage">Damage — mercancía dañada</option>
            <option value="Good Condition">Good Condition — buen estado</option>
            <option value="Non-brand merchandise">Non-brand merchandise — sin marca</option>
          </select>
        </div>
        <div id="cj-preview" style="display:none;margin-top:12px;padding:12px 16px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm)">
          <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Nombre que se generará</div>
          <div id="cj-preview-nombre" style="font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--accent-cyan)"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-caja')">Cancelar</button>
        <button class="btn btn-primary" onclick="crearCaja()">Crear Caja</button>
      </div>
    </div>
  </div>
`);

// Modal: ver QR
document.body.insertAdjacentHTML('beforeend', `
  <div id="modal-qr" class="modal-overlay">
    <div class="modal" style="max-width:340px">
      <div class="modal-header">
        <span class="modal-title" id="qr-modal-title">QR de Caja</span>
        <button class="modal-close" onclick="closeModal('modal-qr')">×</button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px">
        <div id="qr-container" style="background:white;padding:12px;border-radius:8px"></div>
        <div id="qr-nombre" style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;color:var(--text-primary);text-align:center"></div>
        <div style="font-size:11px;color:var(--text-muted);text-align:center">Escanear con cualquier lector de QR</div>
      </div>
    </div>
  </div>
`);

let cajasData = [];
let clientesData = [];
let currentQR = null;

async function loadAll() {
  const [clientes, cajas] = await Promise.all([
    API.get('/clientes'),
    API.get('/cajas')
  ]);
  clientesData = clientes;
  cajasData = cajas;

  const filtroEl = document.getElementById('filtro-cliente');
  const prevVal = filtroEl.value;
  filtroEl.innerHTML = '<option value="">Todos los clientes</option>' +
    clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  if (prevVal) filtroEl.value = prevVal;

  document.getElementById('cj-cliente').innerHTML =
    '<option value="">— Seleccionar cliente —</option>' +
    clientes.map(c => `<option value="${c.id}" data-nombre="${c.nombre}">${c.nombre}</option>`).join('');

  applyFilters();
}

function tipoBadge(tipo) {
  const cfg = {
    'Damage':                  { cls: 'badge-red',   label: 'Damage' },
    'Good Condition':          { cls: 'badge-green', label: 'Good Condition' },
    'Non-brand merchandise':   { cls: 'badge-blue',  label: 'Non-brand' }
  }[tipo] || { cls: 'badge-muted', label: tipo };
  return `<span class="badge ${cfg.cls}">${cfg.label}</span>`;
}

function applyFilters() {
  const clienteId = document.getElementById('filtro-cliente').value;
  const tipo      = document.getElementById('filtro-tipo').value;
  const estatus   = document.getElementById('filtro-estatus').value;
  renderTabla(cajasData.filter(c => {
    if (clienteId && c.cliente_id !== clienteId) return false;
    if (tipo      && c.tipo !== tipo)             return false;
    if (estatus   && c.estatus !== estatus)       return false;
    return true;
  }));
}

function renderTabla(data) {
  const el = document.getElementById('tabla-cajas');
  if (!el) return;
  if (data.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📦</div>
        <div class="empty-state-title">Sin cajas registradas</div>
        <div class="empty-state-text">Crea la primera caja/pallet para comenzar</div>
      </div>`;
    return;
  }
  el.innerHTML = `
    <div class="table-wrapper" style="border:none">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>#</th>
            <th>Estatus</th>
            <th>Creación</th>
            <th>Cierre</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(c => `
            <tr>
              <td class="td-mono" style="font-weight:700;color:var(--accent-cyan)">${c.nombre}</td>
              <td>${c.cliente_nombre || '—'}</td>
              <td>${tipoBadge(c.tipo)}</td>
              <td class="td-mono text-muted">${String(c.consecutivo).padStart(3,'0')}</td>
              <td>
                <span class="badge ${c.estatus === 'Abierta' ? 'badge-green' : 'badge-muted'}">
                  ${c.estatus === 'Abierta' ? '● Abierta' : '✓ Cerrada'}
                </span>
              </td>
              <td class="td-mono text-muted" style="font-size:11px">${c.created_at ? c.created_at.slice(0,10) : '—'}</td>
              <td class="td-mono text-muted" style="font-size:11px">${c.closed_at ? c.closed_at.slice(0,10) : '—'}</td>
              <td>
                <div class="td-actions">
                  <button class="btn btn-ghost btn-sm" onclick="verQR('${c.nombre}')">QR</button>
                  <button class="btn btn-secondary btn-sm" onclick='imprimirEtiqueta(${JSON.stringify(c)})'>🏷 Etiqueta</button>
                  ${c.estatus === 'Abierta'
                    ? `<button class="btn btn-danger btn-sm" onclick="cerrarCaja('${c.id}','${c.nombre}')">Cerrar</button>`
                    : '<span style="font-size:11px;color:var(--text-muted)">Cerrada</span>'}
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
}

async function previewNombre() {
  const clienteEl = document.getElementById('cj-cliente');
  const tipo      = document.getElementById('cj-tipo').value.split(' —')[0];
  const opt       = clienteEl.selectedOptions[0];
  const preview   = document.getElementById('cj-preview');

  if (!opt?.value || !tipo || tipo === '— Seleccionar tipo —') {
    preview.style.display = 'none';
    return;
  }
  try {
    const cajas = await API.get(`/cajas?cliente_id=${opt.value}&tipo=${encodeURIComponent(tipo)}`);
    const nextCons = (cajas.length > 0 ? Math.max(...cajas.map(c => c.consecutivo)) : 0) + 1;
    const iniciales = opt.dataset.nombre.replace(/\s+/g, '').substring(0, 3).toUpperCase().padEnd(3, 'X');
    const abr = { 'Damage': 'DMG', 'Good Condition': 'GDC', 'Non-brand merchandise': 'NBM' }[tipo] || 'UNK';
    const nombre = `${iniciales}-${abr}-${String(nextCons).padStart(3,'0')}`;
    document.getElementById('cj-preview-nombre').textContent = nombre;
    preview.style.display = '';
  } catch(e) {
    preview.style.display = 'none';
  }
}

async function crearCaja() {
  const clienteId = document.getElementById('cj-cliente').value;
  const tipoRaw   = document.getElementById('cj-tipo').value;
  const tipo      = tipoRaw.split(' —')[0];

  if (!clienteId || !tipo) { toast('Cliente y tipo son requeridos', 'error'); return; }

  try {
    await API.post('/cajas', { cliente_id: clienteId, tipo });
    toast('Caja creada exitosamente ✓');
    closeModal('modal-caja');
    loadAll();
  } catch(e) {
    toast(e.error || 'Error al crear caja', 'error');
  }
}

async function cerrarCaja(id, nombre) {
  const ok = await confirm(`¿Cerrar la caja "${nombre}"? Esta acción no se puede revertir.`, 'Cerrar Caja');
  if (!ok) return;
  try {
    await API.put(`/cajas/${id}/cerrar`, {});
    toast(`Caja ${nombre} cerrada ✓`);
    loadAll();
  } catch(e) {
    toast(e.error || 'Error al cerrar', 'error');
  }
}

function verQR(nombre) {
  document.getElementById('qr-modal-title').textContent = `QR — ${nombre}`;
  document.getElementById('qr-nombre').textContent = nombre;
  const container = document.getElementById('qr-container');
  container.innerHTML = '';
  if (currentQR) { try { currentQR.clear(); } catch(e) {} }
  currentQR = new QRCode(container, {
    text: nombre,
    width: 200, height: 200,
    correctLevel: QRCode.CorrectLevel.H
  });
  openModal('modal-qr');
}

function imprimirEtiqueta(caja) {
  const win = window.open('', '_blank', 'width=780,height=560');
  const fecha = caja.created_at ? caja.created_at.slice(0,10) : '—';
  win.document.write(`<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Etiqueta ${caja.nombre}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  @page{size:6in 4in;margin:0}
  @media print{.no-print{display:none!important}}
  body{width:6in;height:4in;overflow:hidden;font-family:Arial,sans-serif;background:white;color:black;display:flex;flex-direction:column}
  .lbl-top{height:40%;display:flex;align-items:center;justify-content:center;border-bottom:3px solid #000;padding:10px;text-align:center}
  .lbl-top .name{font-size:54px;font-weight:900;line-height:1.1;text-transform:uppercase;word-break:break-word;letter-spacing:-1px}
  .lbl-mid{height:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:3px solid #000;padding:8px;gap:4px}
  .lbl-tipo{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:#444}
  .lbl-code{font-family:'Courier New',monospace;font-size:42px;font-weight:900;letter-spacing:3px}
  .lbl-bot{height:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;gap:4px}
  .lbl-meta{font-size:9px;color:#888;text-align:center;margin-top:4px}
  .btn-print{margin:18px auto;display:block;padding:10px 28px;font-size:14px;cursor:pointer;background:#000;color:#fff;border:none;border-radius:4px}
</style>
</head>
<body>
  <div class="lbl-top"><div class="name">${(caja.cliente_nombre || '').toUpperCase()}</div></div>
  <div class="lbl-mid">
    <div class="lbl-tipo">${caja.tipo}</div>
    <div class="lbl-code">${caja.nombre}</div>
  </div>
  <div class="lbl-bot">
    <div id="qr-label" style="display:flex;justify-content:center"></div>
    <div class="lbl-meta">Creado: ${fecha} &nbsp;·&nbsp; Estatus: ${caja.estatus}</div>
  </div>
  <button class="btn-print no-print" onclick="window.print()">🖨 Imprimir Etiqueta</button>
  <script>
    window.onload = function() {
      new QRCode(document.getElementById('qr-label'), {
        text: '${caja.nombre}',
        width: 90, height: 90,
        correctLevel: QRCode.CorrectLevel.H
      });
      setTimeout(function(){ window.print(); }, 1200);
    };
  <\/script>
</body>
</html>`);
  win.document.close();
}

document.getElementById('btn-nueva-caja').onclick = function() {
  document.getElementById('cj-cliente').value = '';
  document.getElementById('cj-tipo').value = '';
  document.getElementById('cj-preview').style.display = 'none';
  openModal('modal-caja');
};

loadAll();
</script>
</body>
</html>
