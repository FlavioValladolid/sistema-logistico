<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trackings — Sistema Logístico</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
const _pageUser = checkAuth(['ADMIN','SUPERVISOR','CLIENTE','LOGISTICA','OPERADOR']);
const _soloVisibilidad = ['OPERADOR','CLIENTE'].includes(_pageUser?.rol);

buildShell('Trackings', 'TRACKINGS', _soloVisibilidad ? '' : `
  <button class="btn btn-primary btn-sm" onclick="window.location='operacion.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    ${t('trackings.new_op')}
  </button>
`, _pageUser);

document.getElementById('page-content').innerHTML = `
  <div class="flex justify-between items-center mb-24">
    <div>
      <h1 class="page-title">${t('trackings.title')}</h1>
      <p class="page-subtitle">${t('trackings.subtitle')}</p>
    </div>
  </div>

  <div class="card">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <span class="card-title">${t('trackings.card_title')}</span>
      <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center">
        <select class="form-control" id="filtro-cliente" style="width:200px">
          <option value="">${t('label.all_clients')}</option>
        </select>
        <select class="form-control" id="filtro-estatus" style="width:160px">
          <option value="">${t('label.all_statuses')}</option>
          <option value="abierto">${t('status.open_badge')}</option>
          <option value="cerrado">${t('status.closed_badge')}</option>
          <option value="refunded">${t('status.refunded_badge')}</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text-secondary);white-space:nowrap;user-select:none">
          <input type="checkbox" id="filtro-pendiente-refund" onchange="applyFilters()" style="accent-color:var(--accent-amber)">
          ${t('trackings.filter_pending_refund')}
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text-secondary);white-space:nowrap;user-select:none">
          <input type="checkbox" id="filtro-con-comentarios" onchange="applyFilters()" style="accent-color:var(--accent-cyan)">
          ${t('trackings.filter_comments')}
        </label>
        <select class="form-control" id="filtro-grado" style="width:130px" onchange="applyFilters()">
          <option value="">Todos los grados</option>
          <option value="0">G0</option>
          <option value="1">G1</option>
          <option value="2">G2</option>
          <option value="3">G3</option>
        </select>
        <input type="text" class="form-control" id="search-tracking" placeholder="Buscar por tracking, cliente u orden..." style="width:220px">
        <select class="form-control" id="page-size-selector" style="width:100px" onchange="changePageSize(this.value)">
          <option value="50">50 / pág</option>
          <option value="100">100 / pág</option>
          <option value="200">200 / pág</option>
          <option value="500">500 / pág</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--border)">
        <input type="text" class="form-control" id="filtro-tracking-num" placeholder="Tracking #" style="width:160px" oninput="applyFiltersDebounced()">
        <input type="text" class="form-control" id="filtro-orden" placeholder="Orden #" style="width:140px" oninput="applyFiltersDebounced()">
        <input type="text" class="form-control" id="filtro-destinatario" placeholder="Destinatario" style="width:160px" oninput="applyFiltersDebounced()">
        <input type="text" class="form-control" id="filtro-retailer" placeholder="Retailer" style="width:140px" oninput="applyFiltersDebounced()">
        <input type="date" class="form-control" id="filtro-fecha-desde" title="Fecha desde" style="width:150px" onchange="applyFilters()">
        <input type="date" class="form-control" id="filtro-fecha-hasta" title="Fecha hasta" style="width:150px" onchange="applyFilters()">
        <button class="btn btn-ghost btn-sm" onclick="limpiarFiltros()">Limpiar filtros</button>
        <button class="btn btn-secondary btn-sm" onclick="descargarCSVTrackings()">⬇ CSV</button>
      </div>
    </div>
    <div id="tabla-trackings">
      <div class="text-center" style="padding:32px"><div class="spinner"></div></div>
    </div>
  </div>
`;

let trackingsData = [];
let filteredTrackings = [];
let currentPage = 1;
let pageSize = 50;
let totalTrackings = 0;
let _filterDebounceTimer = null;
let selectedIds = new Set();

function updateBulkUI() {
  if (_pageUser?.rol !== 'CLIENTE') return;
  const bulkHeader = document.getElementById('bulk-action-header');
  const bulkCount = document.getElementById('bulk-count');
  if (!bulkHeader || !bulkCount) return;

  const n = selectedIds.size;
  if (n > 0) {
    bulkCount.textContent = `${n} tracking${n > 1 ? 's' : ''} seleccionado${n > 1 ? 's' : ''}`;
    bulkHeader.style.display = '';
    // Ocultar los th normales (todos excepto el de checkbox y el bulk-action-header)
    const ths = bulkHeader.closest('tr').querySelectorAll('th:not(#bulk-action-header):not(:first-child)');
    ths.forEach(th => th.style.display = 'none');
  } else {
    const ths = bulkHeader.closest('tr').querySelectorAll('th');
    ths.forEach(th => th.style.display = '');
    bulkHeader.style.display = 'none';
  }
}

async function loadTrackings() {
  // Apply URL params before parallel fetch so first request already includes them
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('grado')) document.getElementById('filtro-grado').value = urlParams.get('grado');
  if (urlParams.get('estatus')) document.getElementById('filtro-estatus').value = urlParams.get('estatus');

  const [clientes, result] = await Promise.all([
    API.get('/clientes'),
    API.get(`/trackings?${_buildFilterParams()}`)
  ]);

  const sel = document.getElementById('filtro-cliente');
  while (sel.options.length > 1) sel.remove(1);
  clientes.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.nombre;
    sel.appendChild(opt);
  });

  filteredTrackings = result.data;
  trackingsData = result.data;
  totalTrackings = result.total;
  renderTabla();
}

function _buildFilterParams(overrides = {}) {
  const q = document.getElementById('search-tracking').value.trim();
  const estatus = document.getElementById('filtro-estatus').value;
  const clienteId = document.getElementById('filtro-cliente').value;
  const grado = document.getElementById('filtro-grado').value;
  const soloComentarios = document.getElementById('filtro-con-comentarios').checked;
  const soloPendienteRefund = document.getElementById('filtro-pendiente-refund').checked;
  const fTrackingNum = document.getElementById('filtro-tracking-num').value.trim();
  const fOrden = document.getElementById('filtro-orden').value.trim();
  const fDestinatario = document.getElementById('filtro-destinatario').value.trim();
  const fRetailer = document.getElementById('filtro-retailer').value.trim();
  const fFechaDesde = document.getElementById('filtro-fecha-desde').value;
  const fFechaHasta = document.getElementById('filtro-fecha-hasta').value;
  const p = new URLSearchParams();
  if (q) p.set('q', q);
  if (estatus) p.set('estatus', estatus);
  if (clienteId) p.set('cliente_id', clienteId);
  if (grado) p.set('grado', grado);
  if (soloComentarios) p.set('con_comentarios', '1');
  if (soloPendienteRefund) p.set('pendiente_refund', '1');
  if (fTrackingNum) p.set('tracking_num', fTrackingNum);
  if (fOrden) p.set('orden', fOrden);
  if (fDestinatario) p.set('destinatario', fDestinatario);
  if (fRetailer) p.set('retailer_f', fRetailer);
  if (fFechaDesde) p.set('fecha_desde', fFechaDesde);
  if (fFechaHasta) p.set('fecha_hasta', fFechaHasta);
  p.set('page', overrides.page ?? currentPage);
  p.set('page_size', overrides.page_size ?? pageSize);
  return p;
}

function applyFiltersDebounced() {
  clearTimeout(_filterDebounceTimer);
  _filterDebounceTimer = setTimeout(() => applyFilters(), 350);
}

async function _fetchAndRender() {
  const el = document.getElementById('tabla-trackings');
  el.innerHTML = '<div class="text-center" style="padding:32px"><div class="spinner"></div></div>';
  try {
    const result = await API.get(`/trackings?${_buildFilterParams()}`);
    filteredTrackings = result.data;
    trackingsData = result.data;
    totalTrackings = result.total;
    renderTabla();
  } catch(e) {
    el.innerHTML = `<div class="text-center" style="padding:32px;color:var(--text-muted)">Error cargando trackings</div>`;
  }
}

function toggleRow(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  const chkAll = document.getElementById('chk-select-all');
  if (chkAll) {
    const total = document.querySelectorAll('.chk-tracking').length;
    const checkedCount = document.querySelectorAll('.chk-tracking:checked').length;
    chkAll.indeterminate = checkedCount > 0 && checkedCount < total;
    chkAll.checked = checkedCount === total && total > 0;
  }
  updateBulkUI();
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.chk-tracking').forEach(chk => {
    chk.checked = checked;
    const id = chk.dataset.id;
    if (checked) selectedIds.add(id);
    else selectedIds.delete(id);
  });
  updateBulkUI();
}

function renderTabla() {
  const el = document.getElementById('tabla-trackings');
  const total = totalTrackings;
  if (total === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📦</div>
        <div class="empty-state-title">${t('trackings.empty_title')}</div>
        <div class="empty-state-text">${t('trackings.empty_text')}</div>
      </div>`;
    return;
  }

  const totalPages = Math.ceil(total / pageSize) || 1;
  const start = (currentPage - 1) * pageSize;
  const end = start + filteredTrackings.length;
  const pageData = filteredTrackings;

  function paginationHtml() {
    if (totalPages <= 1) return '';
    const pages = [];
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
        pages.push(`<button class="btn btn-sm ${p === currentPage ? 'btn-primary' : 'btn-ghost'}" onclick="goToPage(${p})">${p}</button>`);
      } else if (pages[pages.length - 1] !== '…') {
        pages.push('…');
      }
    }
    return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${pages.join('')}</div>`;
  }

  el.innerHTML = `
    <div class="table-wrapper table-scroll" style="border:none">
      <table>
        <thead>
          <tr>
            ${_pageUser?.rol === 'CLIENTE' ? `
              <th style="width:32px;padding:6px 8px;text-align:center">
                <input type="checkbox" id="chk-select-all" title="Seleccionar todos los cerrados"
                  style="accent-color:var(--accent-cyan);cursor:pointer"
                  onchange="toggleSelectAll(this.checked)">
              </th>
              <th id="bulk-action-header" colspan="16"
                style="display:none;padding:6px 12px;background:rgba(0,188,212,.08);border-left:2px solid var(--accent-cyan)">
                <div style="display:flex;align-items:center;gap:12px">
                  <span id="bulk-count" style="font-size:12px;color:var(--accent-cyan);font-weight:700"></span>
                  <button class="btn btn-primary btn-sm" onclick="openBulkRefundModal()">
                    Marcar como Refunded
                  </button>
                  <button class="btn btn-ghost btn-sm" onclick="toggleSelectAll(false)">
                    Limpiar selección
                  </button>
                </div>
              </th>` : ''}
            <th>${t('trackings.col_tracking')}</th>
            <th>${t('label.client')}</th>
            <th>${t('trackings.col_box')}</th>
            <th>${t('trackings.col_inspector')}</th>
            <th>${t('label.grade')}</th>
            <th>Orden #</th>
            <th>Destinatario</th>
            <th>Canal</th>
            <th>Retailer</th>
            <th>${t('trackings.col_declared')}</th>
            <th>${t('trackings.col_inspected')}</th>
            <th>${t('label.status')}</th>
            <th>${t('trackings.col_credit_note')}</th>
            <th>${t('trackings.col_comments')}</th>
            <th>${t('label.date')}</th>
            <th>${t('label.actions')}</th>
          </tr>
        </thead>
        <tbody>
          ${pageData.map(tr => {
            const pct = tr.cantidad_declarada > 0 ? Math.round(tr.cantidad_final / tr.cantidad_declarada * 100) : 0;
            const discrepancia = tr.cantidad_final !== tr.cantidad_declarada && tr.cantidad_declarada > 0;
            const numComent = tr.total_comentarios || 0;
            return `
              <tr ondblclick="window.location='operacion.html?id=${tr.id}'" style="cursor:pointer" title="Doble clic para ver detalle">
                ${_pageUser?.rol === 'CLIENTE' ? `
                  <td style="width:32px;padding:6px 8px;text-align:center" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()">
                    ${tr.estatus === 'cerrado' ? `
                      <input type="checkbox" class="chk-tracking" data-id="${tr.id}"
                        style="accent-color:var(--accent-cyan);cursor:pointer"
                        ${selectedIds.has(String(tr.id)) ? 'checked' : ''}
                        onchange="toggleRow('${tr.id}', this.checked)">
                    ` : ''}
                  </td>` : ''}
                <td class="td-mono" style="color:var(--accent-cyan);font-weight:700">${escHTML(tr.tracking_number)}</td>
                <td>${escHTML(tr.cliente_nombre) || '—'}</td>
                <td class="td-mono">
                  <div>${escHTML(tr.caja_id)}</div>
                  <div style="font-size:10px;color:var(--text-muted)">${tr.tipo_almacenamiento === 'pallet' ? 'Pallet' : 'Caja'}</div>
                </td>
                <td>${escHTML(tr.operador) || '—'}</td>
                <td>${gradoBadge(tr.grado_confianza)}</td>
                <td class="td-mono" style="font-size:12px">
                  ${tr.numero_orden
                    ? `<span onclick="event.stopPropagation();verOrden('${escHTML(tr.numero_orden)}','${escHTML(tr.cliente_id)}')"
                        style="color:var(--accent-cyan);cursor:pointer;text-decoration:underline"
                        title="Ver todos los trackings de esta orden">${escHTML(tr.numero_orden)}</span>`
                    : '<span style="color:var(--text-muted)">—</span>'}
                  ${packingPendiente(tr) ? `<div style="margin-top:3px"><span class="badge badge-amber" style="font-size:9px">⚠ Packing</span></div>` : ''}
                </td>
                <td style="font-size:12px">
                  ${tr.nombre_destinatario
                    ? `<span style="color:var(--text-primary)">${escHTML(tr.nombre_destinatario)}</span>`
                    : '<span style="color:var(--text-muted)">—</span>'}
                </td>
                <td style="font-size:12px;text-align:center">
                  ${tr.canal
                    ? `<span class="badge ${tr.canal === 'B2B' ? 'badge-amber' : 'badge-muted'}" style="font-size:10px">${tr.canal}</span>`
                    : '<span style="color:var(--text-muted)">—</span>'}
                </td>
                <td style="font-size:12px">
                  ${tr.retailer
                    ? `<span style="color:var(--text-primary)">${escHTML(tr.retailer)}</span>`
                    : '<span style="color:var(--text-muted)">—</span>'}
                </td>
                <td class="td-mono">${formatNum(tr.cantidad_declarada)}</td>
                <td>
                  <div class="td-mono">${formatNum(tr.cantidad_final)}</div>
                  <div class="progress-bar" style="width:80px;margin-top:4px">
                    <div class="progress-fill" style="width:${Math.min(pct,100)}%;background:${pct>=100?'var(--accent-green)':'var(--accent-amber)'}"></div>
                  </div>
                  ${discrepancia ? `<span class="badge badge-amber" style="margin-top:2px">${t('trackings.discrepancy')}</span>` : ''}
                </td>
                <td>
                  <span class="badge ${tr.estatus === 'cerrado' ? 'badge-green' : tr.estatus === 'refunded' ? 'badge-blue' : 'badge-amber'}">
                    ${tr.estatus === 'cerrado' ? t('status.closed') : tr.estatus === 'refunded' ? t('status.refunded') : t('status.open')}
                  </span>
                </td>
                <td class="td-mono" style="font-size:12px">
                  ${tr.nota_credito
                    ? `<span style="color:var(--accent-cyan)">${escHTML(tr.nota_credito)}</span>`
                    : '<span style="color:var(--text-muted)">—</span>'}
                </td>
                <td style="text-align:center">
                  ${numComent > 0
                    ? tr.chat_resuelto
                      ? `<span onclick="event.stopPropagation();window.location='operacion.html?id=${tr.id}&scroll=chat'"
                          style="display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:rgba(39,174,96,.15);color:var(--accent-green);font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;cursor:pointer;border:1px solid rgba(39,174,96,.3);transition:all .15s"
                          onmouseover="this.style.background='rgba(39,174,96,.28)'" onmouseout="this.style.background='rgba(39,174,96,.15)'"
                          title="Chat resuelto — ver comentarios">✓ ${numComent}</span>`
                      : `<span onclick="event.stopPropagation();window.location='operacion.html?id=${tr.id}&scroll=chat'"
                          style="display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:rgba(0,188,212,.2);color:var(--accent-cyan);font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;cursor:pointer;border:1px solid rgba(0,188,212,.3);transition:all .15s"
                          onmouseover="this.style.background='rgba(0,188,212,.35)'" onmouseout="this.style.background='rgba(0,188,212,.2)'"
                          title="Ver comentarios">💬 ${numComent}</span>`
                    : `<span style="color:var(--text-muted);font-size:12px">—</span>`}
                </td>
                <td class="td-mono text-muted">${formatDate(tr.created_at)}</td>
                <td>
                  <div class="td-actions">
                    <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();window.location='operacion.html?id=${tr.id}'">
                      ${_soloVisibilidad ? t('btn.view') : (tr.estatus === 'abierto' ? t('btn.inspect') : t('btn.view'))}
                    </button>
                    ${!_soloVisibilidad ? `
                      <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();window.location='reportes.html?tracking=${tr.id}'">
                        ${t('btn.report')}
                      </button>
                    ` : ''}
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px">
      <span style="font-size:12px;color:var(--text-muted)">Mostrando ${start + 1}–${end} de ${total} trackings</span>
      ${paginationHtml()}
    </div>
  `;
}

async function goToPage(p) {
  selectedIds.clear();
  updateBulkUI();
  currentPage = p;
  await _fetchAndRender();
  document.getElementById('tabla-trackings').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function changePageSize(val) {
  pageSize = parseInt(val);
  currentPage = 1;
  await _fetchAndRender();
}

async function applyFilters() {
  selectedIds.clear();
  updateBulkUI();
  currentPage = 1;
  await _fetchAndRender();
}

function packingPendiente(tr) {
  if (tr.canal !== 'B2B' || !tr.numero_orden || tr.tiene_packing) return false;
  try {
    const retailers = JSON.parse(tr.clientes_retail || '[]');
    const match = retailers.find(r => {
      const nombre = typeof r === 'string' ? r : r.nombre;
      return nombre === tr.retailer;
    });
    return match && typeof match === 'object' && match.packing === true;
  } catch(e) { return false; }
}

async function verOrden(numeroOrden, clienteId) {
  if (!numeroOrden) return;
  try {
    const data = await API.get(`/ordenes/resumen-por-numero?numero_orden=${encodeURIComponent(numeroOrden)}`);
    const { stats, trackings, packing } = data;
    const resolvedClienteId = clienteId || trackings[0]?.cliente_id || '';
    const safePackingUrl = packing && /^(https?:\/\/|\/)/.test(packing.archivo_url) ? packing.archivo_url : null;
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
    modal.onclick = e => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-width:560px;max-width:90vw;max-height:80vh;overflow:auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div>
            <div style="font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.06em">ORDEN</div>
            <div style="font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--accent-cyan)">${escHTML(numeroOrden)}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            ${safePackingUrl ? `<a href="${escHTML(safePackingUrl)}" target="_blank" class="btn btn-secondary btn-sm" title="${escHTML(packing.archivo_nombre)}">⬇ Packing List</a>` : ''}
            <button class="btn btn-secondary btn-sm" data-orden="${escHTML(numeroOrden)}" data-cliente="${escHTML(resolvedClienteId)}" onclick="_descargarOrdenCSV(this.dataset.orden,this.dataset.cliente)">⬇ CSV</button>
            <button class="btn btn-ghost btn-sm" onclick="this.closest('[style*=fixed]').remove()">✕</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
          <div style="background:var(--bg-secondary);border-radius:var(--radius-sm);padding:12px;text-align:center">
            <div style="font-size:20px;font-weight:700">${stats.total}</div>
            <div style="font-size:10px;color:var(--text-muted)">Trackings</div>
          </div>
          <div style="background:var(--bg-secondary);border-radius:var(--radius-sm);padding:12px;text-align:center">
            <div style="font-size:20px;font-weight:700;color:var(--accent-amber)">${stats.abiertos}</div>

async function _descargarOrdenCSV(numeroOrden, clienteId) {
  try {
    const items = await API.get(`/ordenes/items-por-numero?order_number=${encodeURIComponent(numeroOrden)}&cliente_id=${encodeURIComponent(clienteId)}`);
    const escCsv = v => {
      const s = v == null ? '' : String(v);
      const safe = /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
      return '"' + safe.replace(/"/g, '""') + '"';
    };
    const exportDate = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
    const meta = [
      `# Order: ${numeroOrden}`,
      `# Exported: ${exportDate}`,
      `# Records: ${items.length}`,
      '',
    ].join('\r\n');
    const headers = ['Tracking', 'Box/Pallet', 'Recipient', 'SKU', 'Product', 'Quantity', 'Country of Origin', 'Materials', 'Condition', 'Order Number', 'Client', 'Retailer'];
    const rows = items.map(i => [
      i.tracking_number, i.caja_id, i.nombre_destinatario,
      i.sku, i.product_title, i.quantity,
      i.country_of_origin, i.materials, i.condition,
      i.order_number, i.cliente_nombre, i.retailer,
    ].map(escCsv).join(','));
    const csv = meta + [headers.map(escCsv).join(','), ...rows].join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `orden-${numeroOrden}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e) {
    toast(e.error || 'Error al descargar CSV', 'error');
  }
}

function openBulkRefundModal() {
  const ids = [...selectedIds];
  if (ids.length === 0) return;

  const selTrackings = filteredTrackings.filter(tr => ids.includes(String(tr.id)));
  const requiereNota = selTrackings.some(tr => tr.requiere_nota_credito);

  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
  modal.onclick = e => { if (e.target === modal) modal.remove(); };

  modal.innerHTML = `
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-width:420px;max-width:90vw;max-height:80vh;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-size:16px;font-weight:700">Marcar como Refunded</div>
        <button class="btn btn-ghost btn-sm" onclick="this.closest('[style*=fixed]').remove()">✕</button>
      </div>

      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">
        Vas a marcar <strong>${ids.length} tracking${ids.length > 1 ? 's' : ''}</strong> como refunded:
      </p>

      <div style="background:var(--bg-secondary);border-radius:var(--radius-sm);padding:10px 14px;max-height:180px;overflow-y:auto;margin-bottom:16px">
        ${selTrackings.map(tr => `
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent-cyan);padding:2px 0">
            ${escHTML(tr.tracking_number)}
          </div>`).join('')}
      </div>

      ${requiereNota ? `
        <div style="margin-bottom:16px">
          <label style="display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">
            Número de nota de crédito <span style="color:var(--accent-red)">*</span>
          </label>
          <input id="bulk-nota-credito" type="text" class="form-control"
            placeholder="Ej: NC-2026-001"
            style="width:100%"
            oninput="document.getElementById('btn-confirmar-refund').disabled = !this.value.trim()">
        </div>
      ` : ''}

      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="this.closest('[style*=fixed]').remove()">Cancelar</button>
        <button id="btn-confirmar-refund" class="btn btn-primary btn-sm" ${requiereNota ? 'disabled' : ''}>
          Confirmar
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  modal.querySelector('#btn-confirmar-refund').addEventListener('click', async () => {
    const notaCredito = requiereNota
      ? (document.getElementById('bulk-nota-credito')?.value.trim() || null)
      : null;
    modal.remove();
    await executeBulkRefund(ids, notaCredito);
  });

  if (requiereNota) {
    setTimeout(() => document.getElementById('bulk-nota-credito')?.focus(), 50);
  }
}

async function executeBulkRefund(ids, notaCredito) {
  let exitosos = 0;
  let fallidos = 0;

  await Promise.all(ids.map(async id => {
    try {
      if (notaCredito) {
        await API.put(`/trackings/${id}/nota-credito`, { nota_credito: notaCredito });
      }
      await API.put(`/trackings/${id}/refunded`, {});
      exitosos++;
    } catch (e) {
      fallidos++;
    }
  }));

  selectedIds.clear();

  if (fallidos === 0) {
    toast(`${exitosos} tracking${exitosos > 1 ? 's' : ''} marcado${exitosos > 1 ? 's' : ''} como refunded`, 'success');
  } else {
    toast(`${exitosos} exitosos, ${fallidos} fallido${fallidos > 1 ? 's' : ''} (ya estaban en refunded o error)`, 'warning');
  }

  await applyFilters();
}

function limpiarFiltros() {
  ['search-tracking','filtro-tracking-num','filtro-orden','filtro-destinatario','filtro-retailer','filtro-fecha-desde','filtro-fecha-hasta'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('filtro-estatus').value = '';
  document.getElementById('filtro-cliente').value = '';
  document.getElementById('filtro-grado').value = '';
  document.getElementById('filtro-con-comentarios').checked = false;
  document.getElementById('filtro-pendiente-refund').checked = false;
  applyFilters();
}

async function descargarCSVTrackings() {
  const esc = v => { const s = String(v ?? ''); return '"' + (/^[=+\-@\t\r]/.test(s) ? "'" + s : s).replace(/"/g, '""') + '"'; };
  try {
    const result = await API.get(`/trackings?${_buildFilterParams({ page: 1, page_size: 5000 })}`);
    const allRows = result.data;
    const exportDate = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
    const filtroEstatus = document.getElementById('filtro-estatus')?.value || 'todos';
    const filtroCliente = document.getElementById('filtro-cliente')?.selectedOptions[0]?.text || 'todos';
    const meta = [
      `# Exported: ${exportDate}`,
      `# Records: ${result.total}`,
      `# Filters: status=${filtroEstatus} | client=${filtroCliente}`,
      '',
    ].join('\r\n');
    const headers = ['Tracking','Cliente','Caja/Pallet','Inspector','Grado','Orden #','Destinatario','Canal','Retailer','Piezas Declaradas','Piezas Inspeccionadas','Estatus','Nota Crédito','Fecha Inicio','Fecha Cierre'];
    const rows = allRows.map(tr => [
      esc(tr.tracking_number),
      esc(tr.cliente_nombre),
      esc(tr.caja_id),
      esc(tr.operador),
      esc(tr.grado_confianza != null ? 'G' + tr.grado_confianza : ''),
      esc(tr.numero_orden),
      esc(tr.nombre_destinatario),
      esc(tr.canal),
      esc(tr.retailer),
      esc(tr.cantidad_declarada),
      esc(tr.cantidad_final),
      esc(tr.estatus),
      esc(tr.nota_credito),
      esc(tr.created_at || ''),
      esc(tr.closed_at || ''),
    ].join(','));
    const csv = meta + [headers.map(h => '"' + h + '"').join(','), ...rows].join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `trackings-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    toast('Error al generar CSV', 'error');
  }
}
