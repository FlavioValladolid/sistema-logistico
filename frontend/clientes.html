<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Sistema Logístico</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
const _pageUser = checkAuth(['ADMIN','SUPERVISOR']);
buildShell('Clientes', 'ADMINISTRACIÓN / CLIENTES', `
  <button class="btn btn-primary btn-sm" onclick="openModal('modal-cliente')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    ${t('clients.new')}
  </button>
`, _pageUser);

// Inject modal + page content
document.getElementById('page-content').innerHTML = `
  <div class="flex justify-between items-center mb-24">
    <div>
      <h1 class="page-title">${t('clients.title')}</h1>
      <p class="page-subtitle">${t('clients.subtitle')}</p>
    </div>
  </div>

  <div id="alert-area"></div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">${t('clients.card_title')}</span>
      <input type="text" class="form-control" id="search-clientes" placeholder="${t('clients.search')}" style="width:220px">
    </div>
    <div id="tabla-clientes">
      <div class="text-center" style="padding:32px"><div class="spinner"></div></div>
    </div>
  </div>
`;

// Add modal
const modalHtml = `
  <div id="modal-cliente" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-cliente-title">${t('clients.modal_new')}</span>
        <button class="modal-close" onclick="closeModal('modal-cliente')">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="cliente-id">

        <div class="form-group">
          <label class="form-label">${t('clients.field_name')}</label>
          <input type="text" class="form-control" id="cliente-nombre" placeholder="Ej: Textiles Express SA">
        </div>

        <div class="form-group">
          <label class="form-label">${t('clients.field_grade')}</label>
          <select class="form-control" id="cliente-grado" onchange="onGradoChange()">
            <option value="1">${t('grade.1_opt')}</option>
            <option value="2" selected>${t('grade.2_opt')}</option>
            <option value="3">${t('grade.3_opt')}</option>
          </select>
          <div class="form-hint" id="grado-hint">Inspección estadística: 30% de las piezas</div>
        </div>

        <div id="pct-group" class="form-group">
          <label class="form-label">${t('clients.field_pct')}</label>
          <input type="number" class="form-control" id="cliente-pct" value="30" min="1" max="100">
          <div class="form-hint">${t('clients.pct_hint')}</div>
        </div>

        <div class="section-title" style="margin-top:20px">${t('clients.field_storage')}</div>

        <div class="form-group">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label id="btn-tipo-caja" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);border:2px solid var(--accent-green);background:rgba(0,230,118,0.08);cursor:pointer">
              <input type="radio" name="tipo-almacenamiento" id="tipo-caja" value="caja" checked style="accent-color:var(--accent-green)">
              <div>
                <div style="font-weight:600;font-size:13px">${t('clients.storage_box')}</div>
                <div class="form-hint" style="margin:0">${t('clients.storage_box_hint')}</div>
              </div>
            </label>
            <label id="btn-tipo-pallet" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elevated);cursor:pointer">
              <input type="radio" name="tipo-almacenamiento" id="tipo-pallet" value="pallet" style="accent-color:var(--accent-green)">
              <div>
                <div style="font-weight:600;font-size:13px">${t('clients.storage_pallet')}</div>
                <div class="form-hint" style="margin:0">${t('clients.storage_pallet_hint')}</div>
              </div>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">${t('clients.field_uph')}</label>
          <input type="number" class="form-control" id="cliente-uph" value="0" min="0" placeholder="Ej: 30">
          <div class="form-hint">${t('clients.uph_hint')}</div>
        </div>

        <div class="section-title" style="margin-top:4px">${t('clients.field_modules')}</div>

        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="flex items-center justify-between" style="background:var(--bg-elevated);padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
            <div>
              <div style="font-weight:600;font-size:13px">${t('clients.mod_quality')}</div>
              <div class="form-hint" style="margin:0">${t('clients.mod_quality_hint')}</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="cliente-calidad">
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="flex items-center justify-between" style="background:var(--bg-elevated);padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
            <div>
              <div style="font-weight:600;font-size:13px">${t('clients.mod_rework')}</div>
              <div class="form-hint" style="margin:0">${t('clients.mod_rework_hint')}</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="cliente-retrabajo" onchange="onRetrabajoToggle()">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="section-title" style="margin-top:20px">${t('clients.field_pkg_info')}</div>

        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="flex items-center justify-between" style="background:var(--bg-elevated);padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
            <div>
              <div style="font-weight:600;font-size:13px">${t('clients.order_num')}</div>
              <div class="form-hint" style="margin:0">${t('clients.order_num_hint')}</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="cliente-requiere-orden">
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="flex items-center justify-between" style="background:var(--bg-elevated);padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
            <div>
              <div style="font-weight:600;font-size:13px">${t('clients.return_type')}</div>
              <div class="form-hint" style="margin:0">${t('clients.return_type_hint')}</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="cliente-requiere-tipo-retorno">
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="flex items-center justify-between" style="background:var(--bg-elevated);padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
            <div>
              <div style="font-weight:600;font-size:13px">${t('clients.credit_note')}</div>
              <div class="form-hint" style="margin:0">${t('clients.credit_note_hint')}</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="cliente-requiere-nota-credito">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div id="seccion-tipo-mercancia" class="hidden" style="margin-top:16px">
          <div class="section-title" style="margin-top:0">Tipo de Mercancía</div>
          <div class="form-group">
            <select class="form-control" id="cliente-tipo-mercancia">
              <option value="textil">Textil</option>
              <option value="calzado">Calzado</option>
              <option value="traje_bano">Traje de baño</option>
              <option value="sombreros">Sombreros</option>
            </select>
            <div class="form-hint">Determina los tipos de retrabajos disponibles para este cliente.</div>
          </div>
        </div>

        <div id="seccion-fotos-adicionales" class="hidden" style="margin-top:16px">
          <div class="section-title" style="margin-top:0">Fotos Adicionales (G3)</div>
          <div class="form-group">
            <label class="form-label">Número de fotos adicionales requeridas por pieza</label>
            <select class="form-control" id="cliente-fotos-adicionales" style="width:120px">
              <option value="0">0 — Sin fotos adicionales</option>
              <option value="1">1 foto</option>
              <option value="2">2 fotos</option>
              <option value="3">3 fotos</option>
              <option value="4">4 fotos</option>
            </select>
            <div class="form-hint">Se exigirán estas fotos durante cada inspección de SKU. Solo disponible para clientes G3.</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-cliente')">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarCliente()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          Guardar
        </button>
      </div>
    </div>
  </div>
`;
document.body.insertAdjacentHTML('beforeend', modalHtml);

let clientesData = [];

function onRetrabajoToggle() {
  const activo = document.getElementById('cliente-retrabajo').checked;
  document.getElementById('seccion-tipo-mercancia').classList.toggle('hidden', !activo);
}

function onTipoAlmacenamientoChange() {
  const val = document.querySelector('input[name="tipo-almacenamiento"]:checked')?.value || 'caja';
  const esCaja = val === 'caja';
  document.getElementById('btn-tipo-caja').style.cssText =
    `display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;border:${esCaja ? '2px solid var(--accent-green);background:rgba(0,230,118,0.08)' : '1px solid var(--border);background:var(--bg-elevated)'}`;
  document.getElementById('btn-tipo-pallet').style.cssText =
    `display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;border:${!esCaja ? '2px solid var(--accent-green);background:rgba(0,230,118,0.08)' : '1px solid var(--border);background:var(--bg-elevated)'}`;
}

// Bind radio change
document.querySelectorAll('input[name="tipo-almacenamiento"]').forEach(r =>
  r.addEventListener('change', onTipoAlmacenamientoChange)
);

function onGradoChange() {
  const g = parseInt(document.getElementById('cliente-grado').value);
  const hints = {
    1: t('clients.grade_hint_1'),
    2: t('clients.grade_hint_2'),
    3: t('clients.grade_hint_3')
  };
  document.getElementById('grado-hint').textContent = hints[g];
  document.getElementById('pct-group').style.display = g === 2 ? 'block' : 'none';
  document.getElementById('seccion-fotos-adicionales').classList.toggle('hidden', g !== 3);
  if (g !== 3) document.getElementById('cliente-fotos-adicionales').value = '0';
}

async function loadClientes() {
  try {
    clientesData = await API.get('/clientes');
    renderTabla(clientesData);
  } catch(e) {
    document.getElementById('tabla-clientes').innerHTML =
      `<div class="alert alert-error">Error: ${e.error || 'No se pudo cargar'}</div>`;
  }
}

function renderTabla(clientes) {
  const el = document.getElementById('tabla-clientes');
  if (clientes.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">👥</div>
        <div class="empty-state-title">${t('clients.empty_title')}</div>
        <div class="empty-state-text">${t('clients.empty_text')}</div>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="table-wrapper table-scroll" style="border:none">
      <table>
        <thead>
          <tr>
            <th>${t('label.name')}</th>
            <th>${t('clients.col_trust_grade')}</th>
            <th>${t('clients.col_sampling')}</th>
            <th>${t('clients.col_storage')}</th>
            <th>UPH</th>
            <th>${t('clients.col_quality')}</th>
            <th>${t('clients.col_rework')}</th>
            <th>${t('clients.col_merch')}</th>
            <th>${t('clients.col_pkg_info')}</th>
            <th>${t('label.registered')}</th>
            <th>${t('label.actions')}</th>
          </tr>
        </thead>
        <tbody>
          ${clientes.map(c => `
            <tr>
              <td style="font-weight:600">${c.nombre}</td>
              <td>${gradoBadge(c.grado_confianza)}</td>
              <td class="td-mono">${c.grado_confianza === 2 ? c.porcentaje_muestreo + '%' : '—'}</td>
              <td>
                <span class="badge ${c.tipo_almacenamiento === 'pallet' ? 'badge-blue' : 'badge-muted'}">
                  ${c.tipo_almacenamiento === 'pallet' ? '⬛ Pallet' : '📦 Caja'}
                </span>
              </td>
              <td class="td-mono">${c.uph > 0 ? c.uph + ' u/h' : '—'}</td>
              <td>
                <span class="badge ${c.modulo_calidad ? 'badge-green' : 'badge-muted'}">
                  ${c.modulo_calidad ? t('label.active') : t('label.inactive')}
                </span>
              </td>
              <td>
                <span class="badge ${c.modulo_retrabajo ? 'badge-blue' : 'badge-muted'}">
                  ${c.modulo_retrabajo ? t('label.active') : t('label.inactive')}
                </span>
              </td>
              <td>
                ${c.modulo_retrabajo ? `<span class="badge badge-muted">${{textil:'Textil',calzado:'Calzado',traje_bano:'Traje baño',sombreros:'Sombreros'}[c.tipo_mercancia]||'Textil'}</span>` : '—'}
                ${parseInt(c.grado_confianza) === 3 && c.fotos_adicionales > 0 ? `<span class="badge badge-blue" style="margin-left:4px">📷 +${c.fotos_adicionales}</span>` : ''}
              </td>
              <td>
                ${c.requiere_orden ? `<span class="badge badge-green" style="margin-bottom:3px;display:inline-block">${t('clients.badge_order')}</span>` : ''}
                ${c.requiere_tipo_retorno ? `<span class="badge badge-amber" style="margin-bottom:3px;display:inline-block">${t('clients.badge_rma')}</span>` : ''}
                ${c.requiere_nota_credito ? `<span class="badge badge-blue" style="display:inline-block">${t('clients.badge_credit')}</span>` : ''}
                ${!c.requiere_orden && !c.requiere_tipo_retorno && !c.requiere_nota_credito ? `<span style="color:var(--text-muted);font-size:12px">${t('label.none')}</span>` : ''}
              </td>
              <td class="td-mono text-muted">${formatDate(c.created_at).split(',')[0]}</td>
              <td>
                <div class="td-actions">
                  <button class="btn btn-secondary btn-sm" onclick="editarCliente('${c.id}')">${t('btn.edit')}</button>
                  <button class="btn btn-danger btn-sm" onclick="eliminarCliente('${c.id}','${c.nombre}')">${t('btn.delete')}</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function abrirNuevo() {
  document.getElementById('cliente-id').value = '';
  document.getElementById('cliente-nombre').value = '';
  document.getElementById('cliente-grado').value = '2';
  document.getElementById('cliente-pct').value = '30';
  document.getElementById('cliente-calidad').checked = false;
  document.getElementById('cliente-retrabajo').checked = false;
  document.getElementById('cliente-uph').value = '0';
  document.getElementById('tipo-caja').checked = true;
  document.getElementById('cliente-tipo-mercancia').value = 'textil';
  document.getElementById('cliente-fotos-adicionales').value = '0';
  document.getElementById('cliente-requiere-orden').checked = false;
  document.getElementById('cliente-requiere-tipo-retorno').checked = false;
  document.getElementById('cliente-requiere-nota-credito').checked = false;
  document.getElementById('seccion-tipo-mercancia').classList.add('hidden');
  document.getElementById('seccion-fotos-adicionales').classList.add('hidden');
  document.getElementById('modal-cliente-title').textContent = t('clients.modal_new');
  onGradoChange();
  onTipoAlmacenamientoChange();
  openModal('modal-cliente');
}

// Override button
document.querySelector('.topbar-actions .btn-primary').onclick = abrirNuevo;

function editarCliente(id) {
  const c = clientesData.find(x => x.id === id);
  if (!c) return;
  document.getElementById('cliente-id').value = c.id;
  document.getElementById('cliente-nombre').value = c.nombre;
  document.getElementById('cliente-grado').value = c.grado_confianza;
  document.getElementById('cliente-pct').value = c.porcentaje_muestreo || 30;
  document.getElementById('cliente-calidad').checked = !!c.modulo_calidad;
  document.getElementById('cliente-retrabajo').checked = !!c.modulo_retrabajo;
  document.getElementById('cliente-uph').value = c.uph || 0;
  const tipo = c.tipo_almacenamiento || 'caja';
  document.getElementById(tipo === 'pallet' ? 'tipo-pallet' : 'tipo-caja').checked = true;
  document.getElementById('cliente-tipo-mercancia').value = c.tipo_mercancia || 'textil';
  document.getElementById('cliente-fotos-adicionales').value = String(parseInt(c.fotos_adicionales) || 0);
  document.getElementById('cliente-requiere-orden').checked = !!c.requiere_orden;
  document.getElementById('cliente-requiere-tipo-retorno').checked = !!c.requiere_tipo_retorno;
  document.getElementById('cliente-requiere-nota-credito').checked = !!c.requiere_nota_credito;
  document.getElementById('seccion-tipo-mercancia').classList.toggle('hidden', !c.modulo_retrabajo);
  document.getElementById('seccion-fotos-adicionales').classList.toggle('hidden', parseInt(c.grado_confianza) !== 3);
  document.getElementById('modal-cliente-title').textContent = t('clients.modal_edit');
  onGradoChange();
  onTipoAlmacenamientoChange();
  openModal('modal-cliente');
}

async function guardarCliente() {
  const id = document.getElementById('cliente-id').value;
  const nombre = document.getElementById('cliente-nombre').value.trim();
  if (!nombre) { toast(t('clients.error_name'), 'error'); return; }

  const payload = {
    nombre,
    grado_confianza: parseInt(document.getElementById('cliente-grado').value),
    porcentaje_muestreo: parseFloat(document.getElementById('cliente-pct').value) || 30,
    modulo_calidad: document.getElementById('cliente-calidad').checked,
    modulo_retrabajo: document.getElementById('cliente-retrabajo').checked,
    tipo_almacenamiento: document.querySelector('input[name="tipo-almacenamiento"]:checked')?.value || 'caja',
    uph: parseInt(document.getElementById('cliente-uph').value) || 0,
    tipo_mercancia: document.getElementById('cliente-tipo-mercancia').value || 'textil',
    fotos_adicionales: Math.max(0, parseInt(document.getElementById('cliente-fotos-adicionales')?.value) || 0),
    requiere_orden: document.getElementById('cliente-requiere-orden').checked,
    requiere_tipo_retorno: document.getElementById('cliente-requiere-tipo-retorno').checked,
    requiere_nota_credito: document.getElementById('cliente-requiere-nota-credito').checked,
  };

  try {
    if (id) {
      await API.put(`/clientes/${id}`, payload);
      toast(t('clients.saved'));
    } else {
      await API.post('/clientes', payload);
      toast(t('clients.created'));
    }
    closeModal('modal-cliente');
    loadClientes();
  } catch(e) {
    toast(e.error || 'Error al guardar', 'error');
  }
}

async function eliminarCliente(id, nombre) {
  const ok = await confirm(t('clients.confirm_delete', { name: nombre }), t('clients.confirm_delete_title'));
  if (!ok) return;
  try {
    await API.del(`/clientes/${id}`);
    toast(t('clients.deleted'));
    loadClientes();
  } catch(e) {
    toast(e.error || 'Error al eliminar', 'error');
  }
}

// Search
document.getElementById('search-clientes').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderTabla(clientesData.filter(c => c.nombre.toLowerCase().includes(q)));
});

loadClientes();
onGradoChange();
</script>
</body>
</html>
