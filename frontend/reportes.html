<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes — Sistema Logístico</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      @page { size: A4; margin: 1.2cm; }
      .sidebar, .topbar, .no-print { display:none !important; }
      .main-content { margin-left:0 !important; padding:0 !important; }
      body { background:white !important; color:black !important; }
      .card { border:1px solid #ccc !important; background:white !important; box-shadow:none !important; max-width:none !important; margin:0 !important; padding:16px !important; }
      * { color:black !important; }
      table { width:100% !important; table-layout:fixed !important; border-collapse:collapse !important; font-size:8px !important; }
      table th { padding:3px 4px !important; white-space:nowrap !important; overflow:hidden !important; border:1px solid #ccc !important; font-size:7.5px !important; }
      table td { padding:3px 4px !important; word-break:break-word !important; overflow-wrap:break-word !important; white-space:normal !important; overflow:hidden !important; text-overflow:ellipsis !important; border:1px solid #ccc !important; vertical-align:top !important; }
      /* Ocultar columna Evidencia (fotos) en impresión */
      table th:last-child, table td:last-child { display:none !important; }
      /* SKU table: #, Tracking, SKU, Descripción, Cant., Orden, País Origen, Barcode/Insumos, Condición */
      table th:nth-child(1), table td:nth-child(1) { width:3% !important; }
      table th:nth-child(2), table td:nth-child(2) { width:19% !important; white-space:nowrap !important; overflow:hidden !important; }
      table th:nth-child(3), table td:nth-child(3) { width:14% !important; }
      table th:nth-child(4), table td:nth-child(4) { width:13% !important; }
      table th:nth-child(5), table td:nth-child(5) { width:5% !important; text-align:center !important; }
      table th:nth-child(6), table td:nth-child(6) { width:9% !important; }
      table th:nth-child(7), table td:nth-child(7) { width:8% !important; }
      table th:nth-child(8), table td:nth-child(8) { width:18% !important; }
      table th:nth-child(9), table td:nth-child(9) { width:10% !important; }
      .mani-data-grid { grid-template-columns:1fr 1fr 1fr !important; }
      .table-wrapper { overflow:visible !important; }
    }
    .manifiesto-header { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; padding-bottom:20px; border-bottom:2px solid var(--border); }
    .mani-logo { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--accent-green); letter-spacing:-.02em; }
    .mani-title { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-muted); letter-spacing:.1em; text-transform:uppercase; }
    .mani-data-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:20px; }
    .mani-data-item { background:var(--bg-elevated); padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); }
    .mani-data-label { font-size:9px; color:var(--text-muted); letter-spacing:.12em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace; margin-bottom:3px; }
    .mani-data-val { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; color:var(--text-primary); }
    .foto-thumb { width:80px; height:80px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--border); cursor:pointer; }
    .cb-select { width:16px; height:16px; accent-color:var(--accent-green); cursor:pointer; }
    #btn-csv:disabled { opacity:.4; cursor:not-allowed; }
    .badge-impresa { background:rgba(0,180,216,.15); color:var(--accent-cyan); border:1px solid rgba(0,180,216,.3); }
    .tracking-chip { display:inline-flex; align-items:center; gap:6px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 12px; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  </style>
</head>
<body>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
const _pageUser = checkAuth();
const _esReadOnly = _pageUser?.rol === 'OPERADOR';
buildShell('Reportes', 'REPORTES', `
  <button id="btn-csv" class="btn btn-primary btn-sm" onclick="descargarCSV()" disabled style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Descargar CSV <span id="csv-count" style="display:none;margin-left:4px;background:rgba(255,255,255,.2);border-radius:10px;padding:0 6px;font-size:10px"></span>
  </button>
`, _pageUser);

const urlParams = new URLSearchParams(window.location.search);
const trackingIdParam = urlParams.get('tracking');
const cajaIdParam     = urlParams.get('caja');

document.getElementById('page-content').innerHTML = `<div id="view-root"></div>`;

// Module-level state for manifest CSV export
let _maniTracking = null;
let _maniDetalles = [];

// ========================================
// VISTA 1: LISTA DE CAJAS / PALLETS
// ========================================
let cajasData = [];
let filteredCajasR = [];
let currentPageR = 1;
let pageSizeR = 50;
// Clave de selección: "caja_id|||cliente_id" para separar mismo caja en distintos clientes
let seleccion = new Set();
// Map de clave → tracking_ids[] para poder pasar IDs al CSV/marcar-impresa
let seleccionMeta = new Map();

async function loadCajas() {
  document.getElementById('btn-csv').style.display = '';

  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="flex justify-between items-center mb-24">
      <div>
        <h1 class="page-title">Reportes</h1>
        <p class="page-subtitle">Todas las cajas y pallets — exportación y control de impresión</p>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px" class="no-print">
      <button class="btn btn-secondary btn-sm" onclick="window.location='?tipocaja=1'" style="display:flex;align-items:center;gap:6px">
        📦 Reporte por Tipo de Caja
      </button>
      <button class="btn btn-secondary btn-sm" onclick="window.location='?retrabajos=1'" style="display:flex;align-items:center;gap:6px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Reporte de Retrabajos
      </button>
      <button class="btn btn-secondary btn-sm" onclick="window.location='?operadores=1'" style="display:flex;align-items:center;gap:6px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Piezas por Operador
      </button>
      <button class="btn btn-secondary btn-sm" onclick="window.location='?calidad=1'" style="display:flex;align-items:center;gap:6px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Calidad por Cliente
      </button>
    </div>

    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px">
        <span class="card-title">Cajas / Pallets</span>
        <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap">
          <select class="form-control" id="filtro-cliente" style="width:160px" onchange="applyFilters()">
            <option value="">Todos los clientes</option>
          </select>
          <select class="form-control" id="filtro-tipo-caja" style="width:160px" onchange="applyFilters()">
            <option value="">Todos los tipos</option>
            <option value="Damage">Damage</option>
            <option value="Good Condition">Good Condition</option>
            <option value="Non-brand merchandise">Non-brand</option>
          </select>
          <input type="date" class="form-control" id="filtro-desde" style="width:140px" onchange="applyFilters()">
          <input type="date" class="form-control" id="filtro-hasta" style="width:140px" onchange="applyFilters()">
          <input type="text" class="form-control" id="filtro-buscar" placeholder="Buscar..." style="width:160px" oninput="applyFilters()">
          <select class="form-control" id="page-size-selector-r" style="width:100px" onchange="changePageSizeR(this.value)">
            <option value="50">50 / pág</option>
            <option value="100">100 / pág</option>
            <option value="200">200 / pág</option>
            <option value="500">500 / pág</option>
          </select>
        </div>
      </div>
      <div id="tabla-cajas">
        <div class="text-center" style="padding:32px"><div class="spinner"></div></div>
      </div>
    </div>
  `;

  cajasData = await API.get('/reportes/cajas');

  // Poblar dropdown clientes
  const clientesUnicos = [...new Map(cajasData.map(c => [c.cliente_nombre, c.cliente_nombre])).entries()];
  const sel = document.getElementById('filtro-cliente');
  clientesUnicos.forEach(([nombre]) => {
    const o = document.createElement('option');
    o.value = o.textContent = nombre;
    sel.appendChild(o);
  });

  filteredCajasR = cajasData;
  currentPageR = 1;
  renderListaCajas(filteredCajasR);
}

function applyFilters() {
  const cliente   = document.getElementById('filtro-cliente')?.value || '';
  const tipoCaja  = document.getElementById('filtro-tipo-caja')?.value || '';
  const desde     = document.getElementById('filtro-desde')?.value || '';
  const hasta     = document.getElementById('filtro-hasta')?.value || '';
  const q         = (document.getElementById('filtro-buscar')?.value || '').toLowerCase();

  filteredCajasR = cajasData.filter(c => {
    if (cliente   && c.cliente_nombre !== cliente) return false;
    if (tipoCaja  && c.tipo_caja !== tipoCaja) return false;
    if (desde && (c.closed_at || '') < desde) return false;
    if (hasta && (c.closed_at || '') > hasta + 'T99') return false;
    if (q && !c.caja_id.toLowerCase().includes(q) && !(c.tracking_numbers || '').toLowerCase().includes(q)) return false;
    return true;
  });
  currentPageR = 1;
  renderListaCajas(filteredCajasR);
}

function renderListaCajas(data) {
  const el = document.getElementById('tabla-cajas');
  if (!el) return;

  if (data.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📦</div>
        <div class="empty-state-title">Sin cajas registradas</div>
        <div class="empty-state-text">Crea cajas en Administración → Cajas / Pallets para verlas aquí</div>
      </div>`;
    actualizarBotonCSV();
    return;
  }

  const totalPages = Math.ceil(data.length / pageSizeR);
  if (currentPageR > totalPages) currentPageR = Math.max(1, totalPages);
  const start = (currentPageR - 1) * pageSizeR;
  const end = Math.min(start + pageSizeR, data.length);
  const pageData = data.slice(start, end);

  const allKeys = pageData.map(c => cajaKey(c));
  const allSel  = allKeys.length > 0 && allKeys.every(k => seleccion.has(k));
  const allKeysJson = JSON.stringify(allKeys).replace(/"/g, '&quot;');

  function paginationHtml() {
    if (totalPages <= 1) return '';
    const pages = new Set([1, totalPages, currentPageR, currentPageR-1, currentPageR+1, currentPageR-2, currentPageR+2]);
    const sorted = [...pages].filter(p => p >= 1 && p <= totalPages).sort((a,b) => a-b);
    let html = ''; let prev = 0;
    for (const p of sorted) {
      if (prev && p - prev > 1) html += `<span style="padding:0 4px;color:var(--text-muted)">…</span>`;
      html += `<button onclick="goToPageR(${p})" style="min-width:30px;height:28px;padding:0 6px;border-radius:4px;border:1px solid ${p===currentPageR?'var(--accent-cyan)':'var(--border)'};background:${p===currentPageR?'rgba(0,188,212,.15)':'transparent'};color:${p===currentPageR?'var(--accent-cyan)':'var(--text-secondary)'};font-size:12px;cursor:${p===currentPageR?'default':'pointer'};font-family:'IBM Plex Mono',monospace">${p}</button>`;
      prev = p;
    }
    return html;
  }

  el.innerHTML = `
    <div class="table-wrapper" style="border:none">
      <table>
        <thead>
          <tr>
            <th style="width:36px">
              <input type="checkbox" class="cb-select" id="cb-all" ${allSel ? 'checked' : ''}
                onchange="toggleAll(this.checked, ${allKeysJson})">
            </th>
            <th>Caja / Pallet</th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>Trackings</th>
            <th>SKUs</th>
            <th>Piezas</th>
            <th>Fecha cierre</th>
            <th>Impresa</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${pageData.map(c => {
            const key = cajaKey(c);
            const detailUrl = `?caja=${encodeURIComponent(c.caja_id)}&cid=${encodeURIComponent(c.cliente_id)}`;
            return `
              <tr>
                <td><input type="checkbox" class="cb-select cb-row" data-key="${key}"
                  ${seleccion.has(key) ? 'checked' : ''}
                  onchange="toggleRow('${key}', this.checked, ${JSON.stringify(c.tracking_ids || '').replace(/"/g,'&quot;')})">
                </td>
                <td>
                  <a href="${detailUrl}" style="font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--accent-cyan);text-decoration:none">
                    ${c.caja_id}
                  </a>
                  <div style="font-size:10px;color:var(--text-muted)">${c.tipo_almacenamiento === 'pallet' ? 'Pallet' : 'Caja'}</div>
                </td>
                <td>${c.cliente_nombre || '—'}</td>
                <td>${c.tipo_caja ? tipoCajaBadge(c.tipo_caja) : '—'}</td>
                <td style="font-size:11px;font-family:'IBM Plex Mono',monospace">
                  ${c.num_trackings === 0
                    ? '<span style="color:var(--text-muted)">Sin trackings</span>'
                    : `<span style="color:var(--accent-green)">${c.num_cerrados} cerrado${c.num_cerrados !== 1 ? 's' : ''}</span>`}
                </td>
                <td class="td-mono">${c.num_skus || '—'}</td>
                <td class="td-mono">${c.total_piezas ? formatNum(c.total_piezas) : '—'}</td>
                <td class="td-mono text-muted">${c.closed_at ? formatDate(c.closed_at).split(',')[0] : '—'}</td>
                <td>
                  ${c.num_cerrados > 0
                    ? (c.impresa ? '<span class="badge badge-impresa">✓ Impresa</span>' : '<span class="badge badge-muted">Pendiente</span>')
                    : '<span class="badge badge-amber" style="font-size:10px">En proceso</span>'}
                </td>
                <td>
                  <button class="btn btn-secondary btn-sm" onclick="window.location='${detailUrl}'">
                    Ver detalle →
                  </button>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
    ${totalPages > 1 ? `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px">
      <span style="font-size:12px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace">Mostrando ${start+1}–${end} de ${data.length} cajas</span>
      <div style="display:flex;align-items:center;gap:4px">
        <button onclick="goToPageR(${currentPageR-1})" ${currentPageR===1?'disabled':''} class="btn btn-ghost btn-sm" style="padding:0 10px;height:28px;font-size:12px">← Anterior</button>
        ${paginationHtml()}
        <button onclick="goToPageR(${currentPageR+1})" ${currentPageR===totalPages?'disabled':''} class="btn btn-ghost btn-sm" style="padding:0 10px;height:28px;font-size:12px">Siguiente →</button>
      </div>
    </div>
    ` : `<div style="padding:8px 16px;border-top:1px solid var(--border)"><span style="font-size:12px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace">${data.length} cajas</span></div>`}
  `;
  actualizarBotonCSV();
}

function goToPageR(p) {
  const totalPages = Math.ceil(filteredCajasR.length / pageSizeR);
  if (p < 1 || p > totalPages) return;
  currentPageR = p;
  renderListaCajas(filteredCajasR);
  document.getElementById('tabla-cajas')?.scrollIntoView({ behavior:'smooth', block:'start' });
}
function changePageSizeR(val) {
  pageSizeR = parseInt(val);
  currentPageR = 1;
  renderListaCajas(filteredCajasR);
}

function cajaKey(c) { return `${c.caja_id}|||${c.cliente_id}`; }

function toggleRow(key, checked, trackingIdsStr) {
  if (checked) {
    seleccion.add(key);
    seleccionMeta.set(key, (trackingIdsStr || '').split('|').filter(Boolean));
  } else {
    seleccion.delete(key);
    seleccionMeta.delete(key);
  }
  actualizarBotonCSV();
  const rows = document.querySelectorAll('.cb-row');
  const cbAll = document.getElementById('cb-all');
  if (cbAll) cbAll.checked = rows.length > 0 && [...rows].every(r => r.checked);
}

function toggleAll(checked, keys) {
  if (checked) {
    // Re-populate meta from data
    cajasData.forEach(c => {
      const k = cajaKey(c);
      if (keys.includes(k)) {
        seleccion.add(k);
        seleccionMeta.set(k, (c.tracking_ids || '').split('|').filter(Boolean));
      }
    });
  } else {
    keys.forEach(k => { seleccion.delete(k); seleccionMeta.delete(k); });
  }
  document.querySelectorAll('.cb-row').forEach(cb => { cb.checked = checked; });
  actualizarBotonCSV();
}

function actualizarBotonCSV() {
  const btn = document.getElementById('btn-csv');
  const cnt = document.getElementById('csv-count');
  const n = seleccion.size;
  if (btn) btn.disabled = n === 0;
  if (cnt) { cnt.style.display = n > 0 ? 'inline' : 'none'; cnt.textContent = n; }
}

async function descargarCSV() {
  if (seleccion.size === 0) return;
  // Recopilar todos los tracking_ids de las seleccionadas
  const tracking_ids = [...seleccionMeta.values()].flat();
  if (tracking_ids.length === 0) { toast('Sin SKUs en las cajas seleccionadas', 'error'); return; }
  try {
    const rows = await API.post('/reportes/csv-detalles', { tracking_ids });
    generarDescargaCSV(rows, `reporte_${new Date().toISOString().slice(0,10)}.csv`);
    await API.post('/reportes/marcar-impresa', { tracking_ids });
    // Actualizar estado local
    [...seleccionMeta.values()].flat().forEach(tid => {
      const c = cajasData.find(x => (x.tracking_ids || '').includes(tid));
      if (c) c.impresa = 1;
    });
    seleccion.clear(); seleccionMeta.clear();
    applyFilters();
    toast(`CSV descargado — ${seleccion.size || tracking_ids.length} caja(s) marcada(s) como impresas`);
  } catch(e) {
    toast(e.error || 'Error al generar CSV', 'error');
  }
}

function generarDescargaCSV(rows, filename) {
  const esc = v => `"${(v || '').toString().replace(/"/g, '""')}"`;
  const header = ['Tracking', 'Box/Pallet', 'Order Number', 'Return Type', 'Return Reason', 'Canal', 'Retailer', 'SKU', 'QTY', 'Country of Origin', 'Barcode', 'Materials', 'Condition'];
  const lines  = [header.join(',')];
  rows.forEach(r => lines.push([
    esc(r.tracking_number),
    esc(r.caja_id),
    esc(r.order_number || r.numero_orden),
    esc(r.tipo_retorno),
    esc(r.razon_retorno),
    esc(r.canal),
    esc(r.retailer),
    esc(r.sku || r.sku_code),
    r.qty ?? r.cantidad ?? 1,
    esc(r.country_of_origin || r.pais_origen_real),
    esc(r.barcode),
    esc(r.materials || r.insumos_real || ''),
    esc(r.condicion),
  ].join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ========================================
// VISTA 2: DETALLE DE CAJA / PALLET
// ========================================
async function loadCajaDetalle(cajaId, clienteId) {
  document.getElementById('btn-csv').style.display = 'none';
  const root = document.getElementById('view-root');
  root.innerHTML = `<div class="text-center" style="padding:80px"><div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto"></div></div>`;

  try {
    let url = `/reportes/caja-detalle?caja_id=${encodeURIComponent(cajaId)}`;
    if (clienteId) url += `&cliente_id=${encodeURIComponent(clienteId)}`;
    const { trackings, detalles, errores } = await API.get(url);
    _maniDetalles = detalles;
    _maniTracking = { tracking_number: cajaId };
    const t0 = trackings[0];
    const tipoAlm = t0.tipo_almacenamiento === 'pallet' ? 'Pallet' : 'Caja';
    const totalPiezas = detalles.reduce((s, d) => s + (d.cantidad || 1), 0);
    const impresa = trackings.every(t => t.impresa);
    const tids = trackings.map(t => t.id);

    root.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <button class="btn btn-secondary btn-sm no-print" onclick="window.location='reportes.html'">← Reportes</button>
        <h1 class="page-title" style="margin:0">${tipoAlm}: <span style="color:var(--accent-cyan)">${cajaId}</span></h1>
        <span style="font-size:12px;color:var(--text-muted)">${t0.cliente_nombre}</span>
        ${impresa ? '<span class="badge badge-impresa" style="padding:6px 14px">✓ Impresa</span>' : '<span class="badge badge-muted" style="padding:6px 14px">Pendiente</span>'}
        <div style="margin-left:auto;display:flex;gap:8px" class="no-print">
          <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 Imprimir</button>
        </div>
      </div>

      <!-- INFO GENERAL -->
      <div class="mani-data-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
        <div class="mani-data-item">
          <div class="mani-data-label">Cliente</div>
          <div class="mani-data-val" style="font-size:13px">${t0.cliente_nombre}</div>
        </div>
        <div class="mani-data-item">
          <div class="mani-data-label">Total SKUs</div>

              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">

                  ${t.estatus === 'cerrado' ? '✓ Cerrado' : t.estatus === 'refunded' ? 'Refunded' : '● Abierto'}
                </span>
                ${t.numero_orden ? `<span class="badge badge-green" style="font-size:10px"># ${t.numero_orden}</span>` : ''}
                ${t.tipo_retorno ? `<span class="badge badge-amber" style="font-size:10px">${t.tipo_retorno}</span>` : ''}
                <a href="?tracking=${t.id}" class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px">Ver</a>
                ${_esReadOnly ? '' : `<a href="operacion.html?id=${t.id}" class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px">✏ Editar</a>`}
              </div>
              ${t.razon_retorno ? `<div style="font-size:11px;color:var(--text-muted);padding-left:2px">RTS: ${t.razon_retorno}</div>` : ''}

      <div class="card mb-16">
        <div class="card-header">

          <span class="badge badge-muted">${detalles.length}</span>

            <button class="btn btn-secondary btn-sm no-print" onclick="descargarCSVManifiesto()" style="margin-left:auto;display:flex;align-items:center;gap:5px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              CSV
            </button>` : ''}
        </div>
        ${detalles.length === 0 ? `
          <div class="empty-state" style="padding:32px">
            <div class="empty-state-icon">🔍</div>
            <div class="empty-state-title">Sin SKUs</div>
          </div>
        ` : `
          <div class="table-wrapper" style="border:none">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Tracking</th><th>SKU</th><th>Descripción</th>
                  <th>Cant.</th><th>Orden</th><th>País Origen</th><th>Barcode / Insumos</th><th>Condición</th><th>Evidencia</th>
                </tr>
              </thead>
              <tbody>
                ${detalles.map((d, i) => {
                  const isG0  = d.tipo_pieza === 'g0';
                  const errD  = errores.filter(e => e.detalle_sku_id === d.id);
                  const condColor = isG0
                    ? (d.calidad === 'Buena' ? 'badge-green' : d.calidad === 'Dañada' ? 'badge-red' : 'badge-amber')
                    : (d.calidad === 'Mala' ? 'badge-red' : 'badge-green');
                  return `
                    <tr style="${errD.length > 0 ? 'background:rgba(255,61,61,.04)' : ''}${isG0 ? ';background:rgba(0,188,212,.03)' : ''}">
                      <td class="td-mono text-muted">${String(i+1).padStart(2,'0')}${isG0 ? '<span style="font-size:9px;color:var(--accent-cyan);margin-left:2px">G0</span>' : ''}</td>
                      <td class="td-mono" style="font-size:11px;color:var(--text-secondary)">${d.tracking_number}</td>
                      <td class="td-mono" style="color:var(--accent-cyan)">${d.sku_code}</td>
                      <td>${d.descripcion || '—'}</td>
                      <td class="td-mono">${d.cantidad}</td>
                      <td class="td-mono" style="font-size:11px">${d.orden_number || '—'}</td>
                      <td style="font-size:12px">${d.pais_origen_real || '—'}${d.pais_origen_real && !d.pais_coincide ? '<span class="badge badge-amber" style="margin-left:4px">≠</span>' : ''}</td>
                      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'IBM Plex Mono',monospace;font-size:11px">
                        ${d.insumos_real || '—'}
                      </td>
                      <td>${d.calidad ? `<span class="badge ${condColor}">${d.calidad}</span>` : '—'}</td>
                      <td>
                        ${d.foto_etiqueta ? `
                          <div style="display:flex;gap:3px">
                            <img src="${d.foto_etiqueta}" style="width:28px;height:28px;object-fit:cover;border-radius:3px;border:1px solid var(--border);cursor:pointer" onclick="window.open('${d.foto_etiqueta}','_blank')" title="Etiqueta">
                            <img src="${d.foto_insumos}" style="width:28px;height:28px;object-fit:cover;border-radius:3px;border:1px solid var(--border);cursor:pointer" onclick="window.open('${d.foto_insumos}','_blank')" title="Insumos/Origen">
                            <img src="${d.foto_pieza}" style="width:28px;height:28px;object-fit:cover;border-radius:3px;border:1px solid var(--border);cursor:pointer" onclick="window.open('${d.foto_pieza}','_blank')" title="Pieza completa">
                          </div>
                        ` : '—'}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>

      <!-- ERRORES -->
      ${errores.length > 0 ? `
        <div class="card">
          <div class="card-header">
            <span class="card-title">Errores y evidencias</span>
            <span class="badge badge-red">${errores.length}</span>
          </div>
          <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
            ${errores.map((e, i) => `
              <div style="background:var(--bg-elevated);border:1px solid rgba(255,61,61,.25);border-radius:var(--radius-sm);padding:12px 14px">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                  <span class="badge badge-red">Error ${String(i+1).padStart(2,'0')}</span>
                  <span class="badge badge-amber">${e.tipo_error}</span>
                  <span class="td-mono text-muted" style="font-size:10px">${e.tracking_number}</span>
                  <span class="td-mono text-muted" style="margin-left:auto;font-size:10px">${formatDate(e.created_at)}</span>
                </div>
                <div style="display:flex;gap:12px;align-items:flex-start">
                  ${e.path_fotografia ? `<img src="${e.path_fotografia}" class="foto-thumb" onclick="window.open('${e.path_fotografia}','_blank')">` : ''}
                  <div style="flex:1;font-size:13px;line-height:1.5">${e.comentarios || '—'}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    `;
  } catch(e) {
    root.innerHTML = `<div class="alert alert-error">Error: ${e.error || 'Caja no encontrada'}</div>`;
  }
}

async function descargarCSVCaja(tracking_ids, cajaId) {
  try {
    const rows = await API.post('/reportes/csv-detalles', { tracking_ids });
    generarDescargaCSV(rows, `${cajaId}_${new Date().toISOString().slice(0,10)}.csv`);
    await API.post('/reportes/marcar-impresa', { tracking_ids });
    toast('CSV descargado — caja marcada como impresa');
    // Refrescar para mostrar badge Impresa
    loadCajaDetalle(cajaId, urlParams.get('cid'));
  } catch(e) {
    toast(e.error || 'Error al generar CSV', 'error');
  }
}

async function loadManifiesto(trackingId) {
  document.getElementById('btn-csv').style.display = 'none';
  const root = document.getElementById('view-root');
  root.innerHTML = `<div class="text-center" style="padding:80px"><div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto"></div></div>`;

  try {
    const { tracking, detalles, errores, discrepancias, retrabajos = [] } = await API.get(`/reportes/manifiesto/${trackingId}`);
    _maniTracking = tracking;
    _maniDetalles = detalles;
    const t = tracking;
    const erroresPorTipo = { Calidad: 0, Origen: 0, Insumo: 0, Otro: 0 };
    errores.forEach(e => { erroresPorTipo[e.tipo_error] = (erroresPorTipo[e.tipo_error] || 0) + 1; });
    const totalPiezas = detalles.reduce((s, d) => s + (d.cantidad || 1), 0);

    // Agrupar filas con mismo SKU + país + insumos + calidad
    const detallesAgrupados = (() => {
      const map = new Map();
      for (const d of detalles) {
        const sku = d.sku_code || d.sku || '';
        const key = `${sku}|${d.pais_origen_real || ''}|${d.insumos_real || ''}|${d.calidad || d.condicion || ''}`;
        if (map.has(key)) {
          const g = map.get(key);
          g.cantidad += (d.cantidad || 1);
          if (d.pais_coincide === 0 || d.pais_coincide === false) g.pais_coincide = 0;
          if (d.insumos_coincide === 0 || d.insumos_coincide === false) g.insumos_coincide = 0;
          g._ids.push(d.id);
        } else {
          map.set(key, { ...d, cantidad: d.cantidad || 1, _ids: [d.id] });
        }
      }
      return [...map.values()];
    })();
    const tipoAlm = t.tipo_almacenamiento === 'pallet' ? 'Pallet' : 'Caja';
    const rtPorEstado = {};
    retrabajos.forEach(r => { rtPorEstado[r.estatus] = (rtPorEstado[r.estatus] || 0) + 1; });

    root.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px" class="no-print">
        <button class="btn btn-secondary btn-sm" onclick="window.location='reportes.html'">← Reportes</button>
        ${t.caja_id ? `<button class="btn btn-ghost btn-sm" onclick="window.location='?caja=${encodeURIComponent(t.caja_id)}'">← ${tipoAlm} ${t.caja_id}</button>` : ''}
      </div>

      <div class="card" style="max-width:900px;margin:0 auto">
        <div class="manifiesto-header">
          <div>
            <div class="mani-logo">LOGÍSTICA</div>
            <div class="mani-title">Manifiesto de Inspección</div>
            <div style="margin-top:12px;font-size:11px;color:var(--text-muted)">Generado: ${new Date().toLocaleString('es-MX')}</div>
          </div>
          <div style="text-align:right">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--accent-cyan)">${t.tracking_number}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px">TRACKING / INSPECCIÓN</div>
            <div style="margin-top:8px">${gradoBadge(t.grado_confianza)}</div>
            <div style="margin-top:6px">
              <span class="badge ${t.estatus==='cerrado'?'badge-green':'badge-amber'}" style="font-size:12px;padding:4px 12px">
                ${t.estatus === 'cerrado' ? '✓ CERRADO' : '⟳ EN PROCESO'}
              </span>
            </div>
          </div>
        </div>

        <div class="section-title">Información General</div>
        <div class="mani-data-grid">
          <div class="mani-data-item"><div class="mani-data-label">Cliente</div><div class="mani-data-val" style="font-size:13px">${t.cliente_nombre}</div></div>
          <div class="mani-data-item"><div class="mani-data-label">${tipoAlm}</div><div class="mani-data-val">${t.caja_id || '—'}</div></div>
          <div class="mani-data-item"><div class="mani-data-label">Operador</div><div class="mani-data-val" style="font-size:12px">${t.operador || '—'}</div></div>
          <div class="mani-data-item"><div class="mani-data-label">Cant. Declarada</div><div class="mani-data-val">${formatNum(t.cantidad_declarada)}</div></div>
          <div class="mani-data-item"><div class="mani-data-label">Cant. Final</div><div class="mani-data-val" style="color:${t.cantidad_final !== t.cantidad_declarada ? 'var(--accent-amber)' : 'var(--accent-green)'}">${formatNum(t.cantidad_final)}</div></div>
          <div class="mani-data-item"><div class="mani-data-label">Inspeccionadas</div><div class="mani-data-val">${formatNum(totalPiezas)}</div></div>
          ${t.numero_orden ? `<div class="mani-data-item" style="border-color:rgba(0,230,118,.3)"><div class="mani-data-label">Número de Orden</div><div class="mani-data-val" style="color:var(--accent-green)">${t.numero_orden}</div></div>` : ''}
          ${t.nombre_destinatario ? `<div class="mani-data-item" style="border-color:rgba(0,188,212,.3)"><div class="mani-data-label">Destinatario</div><div class="mani-data-val" style="color:var(--accent-cyan)">${escHTML(t.nombre_destinatario)}</div></div>` : ''}
          ${t.canal ? `<div class="mani-data-item" style="border-color:rgba(255,193,7,.3)"><div class="mani-data-label">Canal</div><div class="mani-data-val" style="color:var(--accent-amber)">${t.canal}</div></div>` : ''}
          ${t.retailer ? `<div class="mani-data-item" style="border-color:rgba(255,193,7,.3)"><div class="mani-data-label">Retailer</div><div class="mani-data-val" style="color:var(--accent-amber)">${escHTML(t.retailer)}</div></div>` : ''}
          ${t.tipo_retorno ? `<div class="mani-data-item" style="border-color:rgba(255,171,0,.3)"><div class="mani-data-label">Tipo de Retorno</div><div class="mani-data-val" style="color:#ffab00">${t.tipo_retorno}</div></div>` : ''}
          ${t.razon_retorno ? `<div class="mani-data-item" style="grid-column:span 3"><div class="mani-data-label">Razón de Retorno (RTS)</div><div class="mani-data-val" style="font-size:12px;white-space:normal;line-height:1.4">${t.razon_retorno}</div></div>` : ''}
        </div>

        ${errores.length > 0 ? `
          <div class="section-title">Resumen de Errores</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
            ${Object.entries(erroresPorTipo).map(([tipo, cnt]) => `
              <div class="mani-data-item" style="border-color:${cnt>0?'rgba(255,61,61,.3)':'var(--border)'}">
                <div class="mani-data-label">${tipo}</div>
                <div class="mani-data-val" style="color:${cnt>0?'var(--accent-red)':'var(--text-muted)'}">${cnt}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${discrepancias.length > 0 ? `
          <div class="section-title">Discrepancias</div>
          <div style="margin-bottom:20px">
            ${discrepancias.map(d => `
              <div class="alert alert-warning">

        ${retrabajos.length > 0 ? `

          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px">

              <div class="mani-data-val" style="color:#ffab00">${rtPorEstado.Pendiente||0}</div>
            </div>
            <div class="mani-data-item" style="border-color:rgba(68,138,255,.3)">
              <div class="mani-data-label">En proceso</div>
              <div class="mani-data-val" style="color:#448aff">${rtPorEstado['En proceso']||0}</div>
            </div>
            <div class="mani-data-item" style="border-color:rgba(0,230,118,.3)">
              <div class="mani-data-label">Completados</div>
              <div class="mani-data-val" style="color:var(--accent-green)">${rtPorEstado.Completado||0}</div>
            </div>
            <div class="mani-data-item" style="border-color:rgba(255,61,61,.3)">
              <div class="mani-data-label">Rechazados</div>
              <div class="mani-data-val" style="color:var(--accent-red)">${rtPorEstado.Rechazado||0}</div>
            </div>
          </div>
          <div class="table-wrapper" style="margin-bottom:20px">
            <table>
              <thead><tr><th>#</th><th>SKU</th><th>Descripción</th><th>Retrabajos</th><th>Estatus</th></tr></thead>
              <tbody>
                ${retrabajos.map((r, i) => {
                  let rtLista = [];
                  try { rtLista = JSON.parse(r.retrabajos_seleccionados || '[]'); } catch(e) {}
                  if (r.retrabajo_otro) rtLista.push('Otro: ' + r.retrabajo_otro);
                  const estColors = { Pendiente:'#ffab00', 'En proceso':'#448aff', Completado:'#00e676', Rechazado:'#ff3d3d' };
                  return `<tr>
                    <td class="td-mono text-muted">${String(i+1).padStart(2,'0')}</td>
                    <td class="td-mono" style="color:var(--accent-cyan)">${r.sku_code || '—'}</td>
                    <td>${r.descripcion_sku || '—'}</td>
                    <td style="font-size:11px">${rtLista.join(' | ') || '—'}</td>
                    <td><span style="font-size:11px;font-weight:700;color:${estColors[r.estatus]||'inherit'}">${r.estatus||'—'}</span></td>

        ${detallesAgrupados.length === 0 ? `<div class="alert alert-info">Sin SKUs en este tracking</div>` : `
          <div class="table-wrapper" style="margin-bottom:20px">
            <table>
              <thead><tr><th>#</th><th>SKU</th><th>Descripción</th><th>Cant.</th><th>País Origen</th><th>Insumos</th><th>Calidad</th></tr></thead>

                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                  <span class="badge badge-red">Error ${String(i+1).padStart(2,'0')}</span>
                  <span class="badge badge-amber">${e.tipo_error}</span>
                  <span class="td-mono text-muted" style="margin-left:auto;font-size:11px">${formatDate(e.created_at)}</span>
                </div>
                <div style="display:flex;gap:16px;align-items:flex-start">
                  ${e.path_fotografia ? `<img src="${e.path_fotografia}" class="foto-thumb" onclick="window.open('${e.path_fotografia}','_blank')">` : `<div style="width:80px;height:80px;background:var(--bg-card);border:1px dashed var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);text-align:center">Sin foto</div>`}
                  <div style="flex:1"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">DESCRIPCIÓN</div><div style="font-size:13px;line-height:1.5">${e.comentarios || '—'}</div></div>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${t.estatus === 'cerrado' ? `
          <div style="border-top:1px solid var(--border);padding-top:20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:8px">

function descargarCSVManifiesto() {
  if (!_maniDetalles.length) return;
  const tk = _maniTracking;
  const SEP = ',';
  const esc = v => {
    const s = String(v ?? '');
    return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const header = ['#','Tracking','SKU','Descripción','Cantidad','Orden','País Origen','Barcode / Insumos','Condición','Tipo'];
  const lines = [header.join(SEP)];
  _maniDetalles.forEach((d, i) => {
    lines.push([
      String(i + 1).padStart(2, '0'),
      esc(d.tracking_number),
      esc(d.sku_code),
      esc(d.descripcion),
      d.cantidad,
      esc(d.orden_number),
      esc(d.pais_origen_real),
      esc(d.insumos_real),
      esc(d.calidad || d.condicion),
      d.tipo_pieza === 'g0' ? 'G0' : 'Inspección',
    ].join(SEP));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `skus_${tk?.tracking_number || 'manifiesto'}_${fecha}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportarCSVRt() {
  if (!rrtData.length) return;
  const SEP = '|';
  const esc = v => String(v ?? '').replace(/\|/g, '/');
  const header = ['Fecha', 'Tracking #', 'SKU', 'Retrabajos realizados', 'Operador', 'Pallet / Caja', 'Estatus'];
  const lines = [header.join(SEP)];
  rrtData.forEach(r => {
    let lista = [];
    try { lista = JSON.parse(r.retrabajos_seleccionados || '[]'); } catch(e) {}
    if (r.retrabajo_otro) lista.push(r.retrabajo_otro);
    lines.push([
      esc((r.created_at || '').slice(0,10)),
      esc(r.tracking_number),
      esc(r.sku_code || ''),
      esc(lista.join('; ')),
      esc(r.operador || ''),
      esc(r.caja_id || ''),
      esc(r.estatus),
    ].join(SEP));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `retrabajos_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

  const res = document.getElementById('pu-resultado');
  res.innerHTML = `<div class="text-center" style="padding:40px"><div class="spinner" style="margin:0 auto;width:28px;height:28px;border-width:3px"></div></div>`;

  try {
    let url = '/reportes/piezas-usuario?x=1';
    if (desde)     url += `&fecha_desde=${desde}`;
    if (hasta)     url += `&fecha_hasta=${hasta}`;
    if (clienteId) url += `&cliente_id=${clienteId}`;
    if (operador)  url += `&operador=${encodeURIComponent(operador)}`;
    _puData = await API.get(url);
    document.getElementById('btn-csv-pu').disabled = _puData.length === 0;

    if (_puData.length === 0) {
      res.innerHTML = `<div class="empty-state" style="padding:48px 32px"><div style="font-size:32px;margin-bottom:12px">📭</div><div>Sin datos para los filtros seleccionados</div></div>`;
      return;
    }

    // Agrupar por operador
    const porOperador = new Map();
    for (const r of _puData) {
      const op = r.operador || '(sin asignar)';
      if (!porOperador.has(op)) porOperador.set(op, []);
      porOperador.get(op).push(r);
    }

    const totalPiezas = _puData.reduce((s, r) => s + (r.piezas || 0), 0);
    const totalTrackings = _puData.length;

    let html = `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">TOTAL PIEZAS</div>
          <div style="font-size:28px;font-weight:700;color:var(--accent-cyan)">${formatNum(totalPiezas)}</div>
        </div>
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">TRACKINGS CERRADOS</div>
          <div style="font-size:28px;font-weight:700;color:var(--accent-green)">${totalTrackings}</div>
        </div>
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">OPERADORES</div>
          <div style="font-size:28px;font-weight:700;color:var(--accent-amber)">${porOperador.size}</div>
        </div>
      </div>
    `;

    for (const [op, rows] of porOperador) {
      const opTotal = rows.reduce((s, r) => s + (r.piezas || 0), 0);
      html += `
        <div class="card mb-16">
          <div class="card-header" style="background:var(--bg-elevated)">
            <span class="card-title" style="color:var(--accent-cyan)">${op}</span>
            <span class="badge badge-muted" style="margin-left:auto">${formatNum(opTotal)} piezas</span>
            <span class="badge badge-muted">${rows.length} tracking${rows.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Hora</th>
                  <th>Cliente</th>
                  <th>Tracking</th>
                  <th>Caja / Pallet</th>
                  <th class="td-mono" style="text-align:right">Piezas</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr>
                    <td class="td-mono">${r.fecha || '—'}</td>
                    <td class="td-mono" style="color:var(--text-secondary)">${r.hora_cierre ? r.hora_cierre.slice(0,5) : '—'}</td>
                    <td>${escHTML(r.cliente_nombre || '—')}</td>
                    <td class="td-mono" style="color:var(--accent-cyan)">${escHTML(r.tracking_number || '—')}</td>
                    <td class="td-mono" style="color:var(--text-secondary)">${escHTML(r.caja_nombre || '—')}</td>
                    <td class="td-mono" style="text-align:right;font-weight:600;color:var(--accent-green)">${formatNum(r.piezas || 0)}</td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot>
                <tr style="border-top:2px solid var(--border)">
                  <td colspan="5" style="font-size:11px;color:var(--text-muted);padding:8px 12px">Total</td>
                  <td class="td-mono" style="text-align:right;font-weight:700;color:var(--accent-cyan);padding:8px 12px">${formatNum(opTotal)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      `;
    }

    res.innerHTML = html;
  } catch(e) {
    res.innerHTML = `<div class="alert alert-error">Error: ${e.error || e.message}</div>`;
  }
}

function exportarCSVPU() {
  if (!_puData.length) return;
  const esc = v => `"${(v || '').toString().replace(/"/g, '""')}"`;
  const header = ['Operador','Fecha','Hora','Cliente','Tracking','Caja/Pallet','Piezas'];
  const lines = [header.join(',')];
  _puData.forEach(r => lines.push([
    esc(r.operador), esc(r.fecha), esc(r.hora_cierre ? r.hora_cierre.slice(0,5) : ''),
    esc(r.cliente_nombre), esc(r.tracking_number), esc(r.caja_nombre), r.piezas || 0
  ].join(',')));
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `piezas-operador-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function generarReporteCQ() {
  const desde    = document.getElementById('cq-desde').value;
  const hasta    = document.getElementById('cq-hasta').value;
  const clienteId = document.getElementById('cq-cliente').value;
  const res = document.getElementById('cq-resultado');
  res.innerHTML = `<div class="text-center" style="padding:40px"><div class="spinner" style="margin:0 auto;width:28px;height:28px;border-width:3px"></div></div>`;

  try {
    let url = '/reportes/calidad?x=1';
    if (desde)     url += `&fecha_desde=${desde}`;
    if (hasta)     url += `&fecha_hasta=${hasta}`;
    if (clienteId) url += `&cliente_id=${clienteId}`;
    const { porCliente, tiposError, tendencia, paises } = await API.get(url);

    if (!porCliente.length) {
      res.innerHTML = `<div class="empty-state" style="padding:48px 32px"><div style="font-size:32px;margin-bottom:12px">📭</div><div>Sin datos para los filtros seleccionados</div></div>`;
      return;
    }

    const totalPiezas = porCliente.reduce((s, r) => s + (r.total_piezas || 0), 0);
    const totalBuenas = porCliente.reduce((s, r) => s + (r.piezas_buenas || 0), 0);
    const pctGlobal   = totalPiezas > 0 ? (100 * totalBuenas / totalPiezas).toFixed(1) : '—';
    const totalErrors = tiposError.reduce((s, r) => s + (r.total || 0), 0);

    // ── SECCIÓN 1: % Buenas vs Malas por cliente ──────────────────
    let html = `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">PIEZAS INSPECCIONADAS</div>
          <div style="font-size:26px;font-weight:700;color:var(--accent-cyan)">${formatNum(totalPiezas)}</div>
        </div>
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">% CALIDAD GLOBAL</div>
          <div style="font-size:26px;font-weight:700;color:${parseFloat(pctGlobal)>=95?'var(--accent-green)':parseFloat(pctGlobal)>=80?'var(--accent-amber)':'var(--accent-red)'}">${pctGlobal}%</div>
        </div>
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">TOTAL ERRORES</div>
          <div style="font-size:26px;font-weight:700;color:${totalErrors>0?'var(--accent-red)':'var(--accent-green)'}">${formatNum(totalErrors)}</div>
        </div>
      </div>

      <div class="card mb-16">
        <div class="card-header"><span class="card-title">Buenas vs Malas por Cliente</span></div>
        <div style="padding:16px;display:flex;flex-direction:column;gap:14px">
          ${porCliente.map(r => {
            const pct = r.total_piezas > 0 ? (100 * r.piezas_buenas / r.total_piezas) : 0;
            const color = pct >= 95 ? 'var(--accent-green)' : pct >= 80 ? 'var(--accent-amber)' : 'var(--accent-red)';
            return `
              <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span style="font-size:13px">${escHTML(r.cliente_nombre)}</span>
                  <span style="font-size:12px;font-family:'IBM Plex Mono',monospace">
                    <span style="color:${color};font-weight:700">${pct.toFixed(1)}%</span>
                    <span style="color:var(--text-muted);margin-left:8px">${formatNum(r.piezas_buenas)} buenas · ${formatNum(r.piezas_malas)} malas · ${formatNum(r.total_piezas)} total</span>
                  </span>
                </div>
                <div style="height:8px;background:var(--bg-elevated);border-radius:4px;overflow:hidden">
                  <div style="height:100%;width:${pct.toFixed(1)}%;background:${color};border-radius:4px;transition:width .4s ease"></div>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
    `;

    // ── SECCIÓN 2: Tipos de errores más frecuentes ─────────────────
    if (tiposError.length) {
      // Agrupar por tipo_error globalmente
      const errMap = new Map();
      for (const e of tiposError) {
        const cur = errMap.get(e.tipo_error) || { tipo: e.tipo_error, total: 0, clientes: [] };
        cur.total += e.total;
        cur.clientes.push(`${e.cliente_nombre} (${e.total})`);
        errMap.set(e.tipo_error, cur);
      }
      const errList = [...errMap.values()].sort((a,b) => b.total - a.total);
      const maxErr  = errList[0].total;
      const errColors = { Calidad:'var(--accent-red)', Origen:'var(--accent-amber)', Insumo:'#448aff', 'Mercancía ajena':'var(--accent-cyan)' };

      html += `
        <div class="card mb-16">
          <div class="card-header"><span class="card-title">Tipos de Errores más Frecuentes</span></div>
          <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
            ${errList.map(e => `
              <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span style="font-size:13px;font-weight:600;color:${errColors[e.tipo]||'inherit'}">${escHTML(e.tipo)}</span>
                  <span style="font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--accent-red);font-weight:700">${e.total} errores</span>
                </div>
                <div style="height:8px;background:var(--bg-elevated);border-radius:4px;overflow:hidden;margin-bottom:4px">
                  <div style="height:100%;width:${(100*e.total/maxErr).toFixed(1)}%;background:${errColors[e.tipo]||'var(--accent-red)'};border-radius:4px"></div>
                </div>
                <div style="font-size:10px;color:var(--text-muted)">${e.clientes.join(' · ')}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ── SECCIÓN 3: Tendencia mes a mes ─────────────────────────────
    if (tendencia.length) {
      // Agrupar por mes
      const mesMap = new Map();
      for (const r of tendencia) {
        if (!mesMap.has(r.mes)) mesMap.set(r.mes, []);
        mesMap.get(r.mes).push(r);
      }
      const meses = [...mesMap.keys()].sort().reverse().slice(0, 12).reverse();

      html += `
        <div class="card mb-16">
          <div class="card-header"><span class="card-title">Tendencia de Calidad Mes a Mes</span></div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Mes</th>
                  <th>Cliente</th>
                  <th class="td-mono" style="text-align:right">Total piezas</th>
                  <th class="td-mono" style="text-align:right">Buenas</th>
                  <th style="text-align:right">% Calidad</th>
                  <th style="min-width:120px">Indicador</th>
                </tr>
              </thead>
              <tbody>
                ${meses.flatMap(mes => mesMap.get(mes).map(r => {
                  const pct = r.pct_buenas || 0;
                  const color = pct >= 95 ? 'var(--accent-green)' : pct >= 80 ? 'var(--accent-amber)' : 'var(--accent-red)';
                  return `<tr>
                    <td class="td-mono" style="color:var(--text-secondary)">${r.mes}</td>
                    <td>${escHTML(r.cliente_nombre)}</td>
                    <td class="td-mono" style="text-align:right">${formatNum(r.total_piezas)}</td>
                    <td class="td-mono" style="text-align:right;color:var(--accent-green)">${formatNum(r.buenas)}</td>
                    <td class="td-mono" style="text-align:right;font-weight:700;color:${color}">${pct}%</td>
                    <td>
                      <div style="height:6px;background:var(--bg-elevated);border-radius:3px;overflow:hidden">
                        <div style="height:100%;width:${pct}%;background:${color};border-radius:3px"></div>
                      </div>
                    </td>
                  </tr>`;
                })).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ── SECCIÓN 4: Países con más discrepancias ────────────────────
    if (paises.length) {
      html += `
        <div class="card mb-16">
          <div class="card-header"><span class="card-title">Países de Origen con Discrepancias</span></div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>País</th>
                  <th>Cliente</th>
                  <th class="td-mono" style="text-align:right">Total piezas</th>
                  <th class="td-mono" style="text-align:right">Disc. País</th>
                  <th class="td-mono" style="text-align:right">Disc. Insumos</th>
                  <th class="td-mono" style="text-align:right">Total disc.</th>
                </tr>
              </thead>
              <tbody>
                ${paises.map(r => {
                  const totalDisc = (r.disc_pais || 0) + (r.disc_insumos || 0);
                  return `<tr>
                    <td style="font-weight:600">${escHTML(r.pais)}</td>
                    <td>${escHTML(r.cliente_nombre)}</td>
                    <td class="td-mono" style="text-align:right">${formatNum(r.total)}</td>
                    <td class="td-mono" style="text-align:right;color:${r.disc_pais>0?'var(--accent-amber)':'var(--text-muted)'}">${formatNum(r.disc_pais)}</td>
                    <td class="td-mono" style="text-align:right;color:${r.disc_insumos>0?'var(--accent-amber)':'var(--text-muted)'}">${formatNum(r.disc_insumos)}</td>
                    <td class="td-mono" style="text-align:right;font-weight:700;color:var(--accent-red)">${formatNum(totalDisc)}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    res.innerHTML = html;
  } catch(e) {
    res.innerHTML = `<div class="alert alert-error">Error: ${e.error || e.message}</div>`;
  }
}
